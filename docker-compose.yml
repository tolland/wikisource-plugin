---

# Two independent MediaWiki+ProofreadPage stacks.
#
# The `upstream` pair (db, mediawiki) always starts and is what the original
# single-instance `wikisource` fixture uses. The `local` pair only starts under
# the `pair` profile, and exists so sync/promotion tests have a real second wiki
# to copy from and push back to -- FakeWikiClient cannot model revision history,
# sha1 semantics, createonly or undo.
#
#   docker compose up -d                    # upstream only
#   docker compose --profile pair up -d     # both
#
# Run the pair under its own COMPOSE_PROJECT_NAME: MW_SERVER (and therefore the
# port) is baked into LocalSettings.php at install time, so a volume installed
# for one port must not be reused on another.

x-mediawiki-common: &mediawiki-common
  build:
    context: .
    dockerfile: docker/mediawiki/Dockerfile
  healthcheck:
    test:
      [
        "CMD-SHELL",
        "php /var/www/html/maintenance/run.php eval 'exit(ExtensionRegistry::getInstance()->isLoaded(\"ProofreadPage\") ? 0 : 1);'",
      ]
    interval: 10s
    timeout: 10s
    retries: 30
    start_period: 30s

x-db-common: &db-common
  image: mariadb:11.4
  healthcheck:
    test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
    interval: 5s
    timeout: 5s
    retries: 24

x-db-env: &db-env
  MARIADB_DATABASE: mediawiki
  MARIADB_USER: mediawiki
  MARIADB_PASSWORD: mediawiki
  MARIADB_ROOT_PASSWORD: mediawiki-root

services:
  db:
    <<: *db-common
    environment: *db-env
    volumes:
      - mediawiki-db:/var/lib/mysql

  mediawiki:
    <<: *mediawiki-common
    depends_on:
      db:
        condition: service_healthy
    environment:
      MW_ADMIN_PASSWORD: "${MW_ADMIN_PASSWORD:-AdminPassword123!}"
      MW_ADMIN_USER: "${MW_ADMIN_USER:-Admin}"
      MW_DB_HOST: db
      MW_DB_NAME: mediawiki
      MW_DB_PASSWORD: mediawiki
      MW_DB_USER: mediawiki
      MW_LANG: en
      MW_SCRIPT_PATH: ""
      MW_SERVER: "http://localhost:${WIKISOURCE_PORT:-8080}"
      MW_SITE_NAME: "${WIKISOURCE_SITE_NAME:-Test Wikisource}"
    ports:
      - "${WIKISOURCE_PORT:-8080}:80"
    volumes:
      - mediawiki-images:/var/www/html/images
      - ./src-py/tests/fixtures:/fixtures:ro

  db-local:
    <<: *db-common
    profiles: ["pair"]
    environment: *db-env
    volumes:
      - mediawiki-local-db:/var/lib/mysql

  mediawiki-local:
    <<: *mediawiki-common
    profiles: ["pair"]
    depends_on:
      db-local:
        condition: service_healthy
    environment:
      MW_ADMIN_PASSWORD: "${MW_ADMIN_PASSWORD:-AdminPassword123!}"
      MW_ADMIN_USER: "${MW_ADMIN_USER:-Admin}"
      MW_DB_HOST: db-local
      MW_DB_NAME: mediawiki
      MW_DB_PASSWORD: mediawiki
      MW_DB_USER: mediawiki
      MW_LANG: en
      MW_SCRIPT_PATH: ""
      MW_SERVER: "http://localhost:${WIKISOURCE_LOCAL_PORT:-18582}"
      MW_SITE_NAME: "${WIKISOURCE_LOCAL_SITE_NAME:-Test Wikisource (local)}"
    ports:
      - "${WIKISOURCE_LOCAL_PORT:-18582}:80"
    volumes:
      - mediawiki-local-images:/var/www/html/images
      - ./src-py/tests/fixtures:/fixtures:ro

volumes:
  mediawiki-db:
  mediawiki-images:
  mediawiki-local-db:
  mediawiki-local-images:
