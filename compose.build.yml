---

# Standalone image/DB warm-up, isolated from the main compose project.
#
# Not overlaid on compose.yml and not automatically consumed by it -- it just
# builds the mediawiki image and runs install.php + the minimal module import
# once, ahead of time, into its own volume. Restoring that volume (a plain
# `docker cp`/`cp -a` of the mariadb data directory) is a manual speed-up for
# whoever wants to skip the ~30s install penalty; nothing here wires that up
# automatically any more. compose.yml no longer needs that automatic
# snapshot-restore itself: with content-seeding off by default, a plain
# `docker compose up -d` on compose.yml is already fast.
#
# Named as its own compose project (not the directory-derived default), and
# with no published ports, so it can run in parallel with the main project
# without container/volume/port collisions:
#
#   docker compose -f compose.build.yml build
#   docker compose -f compose.build.yml up -d --wait

name: wikisource-build

services:
  db:
    image: mariadb:11.4
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 24
    environment:
      MARIADB_DATABASE: mediawiki
      MARIADB_USER: mediawiki
      MARIADB_PASSWORD: mediawiki
      MARIADB_ROOT_PASSWORD: mediawiki-root
    volumes:
      - mediawiki-db-seed:/var/lib/mysql

  mediawiki:
    build:
      context: .
      dockerfile: docker/mediawiki/Dockerfile
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php /var/www/html/maintenance/run.php eval 'exit(ExtensionRegistry::getInstance()->isLoaded(\"ProofreadPage\") ? 0 : 1);'",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    environment:
      MW_ADMIN_PASSWORD: "${MW_ADMIN_PASSWORD:-AdminPassword123!}"
      MW_ADMIN_USER: "${MW_ADMIN_USER:-Admin}"
      MW_DB_HOST: db
      MW_DB_NAME: mediawiki
      MW_DB_PASSWORD: mediawiki
      MW_DB_USER: mediawiki
      MW_LANG: en
      MW_SCRIPT_PATH: ""
      # No published port (see above) so this never needs to be reachable --
      # MW_SERVER only has to be a syntactically valid value for LocalSettings.
      MW_SERVER: "http://localhost"
      MW_SITE_NAME: "${WIKISOURCE_SITE_NAME:-Test Wikisource}"
    volumes:
      - mediawiki-images:/var/www/html/images
      - ./src-py/tests/fixtures:/fixtures:ro,z
      - ./docker/mediawiki/Wikisource.php:/var/www/html/LocalSettings.d/Wikisource.php:z,ro

volumes:
  mediawiki-db-seed:
  mediawiki-images:
