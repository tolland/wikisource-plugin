default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: black
        name: black
        entry: uv run black
        language: system
        types_or: [python, pyi]
      - id: gradle-check
        name: gradle check
        entry: ./gradlew check
        language: system
        types_or: [kotlin, xml]
        pass_filenames: false
