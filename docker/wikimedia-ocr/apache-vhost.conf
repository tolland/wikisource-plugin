# Minimal vhost for the Wikimedia OCR Symfony-style app: serve public/,
# route everything through index.php. Adjust the DocumentRoot/entry point
# if the upstream repo layout differs from what this was written against.
<VirtualHost *:80>
    DocumentRoot /var/www/tool/public

    <Directory /var/www/tool/public>
        AllowOverride All
        Require all granted
        FallbackResource /index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
