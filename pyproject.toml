[project]
name = "wtbot"
version = "0.1.0"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.18.5",
    "bs4>=0.0.2",
    "fastapi[standard]==0.140.0",
    "httpx2>=2.9.1",
    #    "mariadb>=1.1.14",
    "opencv-python>=5.0.0.93",
    "pandas-stubs~=3.0.3",
    "pillow>=11.0.0",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.1",
    "pytimeparse>=1.1.8",
    "pywikibot>=11.4.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.51",
    "sqlmodel>=0.0.39",
    "typer>=0.26.8",
    "typer-di>=0.1.5",
    "uvicorn[standard]>=0.49.0",
]

[project.urls]
Homepage = "https://github.com/tolland/wikisource-plugin"
Repository = "https://github.com/tolland/wikisource-plugin"
Issues = "https://github.com/tolland/wikisource-plugin/issues"


[dependency-groups]
test = [
    "pytest>=9.1.1",
    "black>=26.0",
    "ruff>=0.15",
]

dev = [
    { include-group = "test" },
    "black[jupyter]>=26.5.1",
    "ipykernel>=7.3.0",
    "pre-commit>=4.0",
    "pandas==3.0.3",
    "vcrpy>=8.3.0",
    "mypy>=2.3.0",
    "tox>=4.63.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
wtbot = "wtbot.cli.run_cli:run_cli"

[tool.hatch.build.targets.wheel]
packages = ["src-py/wtbot"]

[tool.pytest.ini_options]
pythonpath = ["src-py"]
testpaths = ["src-py/tests"]
addopts = "-ra -q --strict-markers"
env = ["_TYPER_FORCE_DISABLE_TERMINAL=1", "TERMINAL_WIDTH=200"]
markers = [
    "slow: marks a test as longrunning"
    ]

[tool.black]
line-length = 88
target-version = ["py313"]
extend-exclude = '''
/(
    \.venv
  | \.gradle
  | build
  | src-py/wtbot/notebooks
)/
'''

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src-py"]
extend-exclude = [
    "src-py/wtbot/notebooks",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]

[tool.ruff.lint.per-file-ignores]
"src-py/wtbot/model/__init__.py" = ["E402"]

[tool.tox]
legacy_tox_ini = """
[tox]
requires =
    tox>=4.30
    tox-uv>=1.30
env_list = floor, naive-ok, naive-strict, latest

[gh-actions]
python =
    3.13: floor, naive-ok, naive-strict, latest
    3.14: floor, naive-ok, naive-strict, latest

[testenv]
description = pytest against one resolution of the dependency ranges
runner = uv-venv-runner
package = wheel
dependency_groups = test
commands = pytest {posargs}

[testenv:floor]
description = the declared sqlmodel floor -- proves the minimum really runs
deps = sqlmodel==0.0.39

[testenv:naive-ok]
description = last sqlmodel that stores naive datetimes without complaint
deps = sqlmodel==0.0.44

[testenv:naive-strict]
description = first sqlmodel whose UTCDateTime rejects naive datetimes
deps = sqlmodel==0.0.45

[testenv:latest]
description = unpinned -- what CI or a fresh clone resolves today
"""
