[project]
name = "wtbot"
version = "0.1.0"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi[standard]>=0.138.1",
    "ipykernel>=7.3.0",
    "pywikibot>=11.4.2",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.51",
    "sqlmodel>=0.0.39",
    "typer>=0.26.8",
    "uvicorn[standard]>=0.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
wtbot = "wtbot.cli:run_cli"

[tool.hatch.build.targets.wheel]
packages = ["src-py/wtbot"]

[project.urls]
Homepage = "https://github.com/tolland/wikisource-plugin"
Repository = "https://github.com/tolland/wikisource-plugin"
Issues = "https://github.com/tolland/wikisource-plugin/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src-py"]
testpaths = ["src-py/tests"]
addopts = "-ra"
