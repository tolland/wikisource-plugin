[project]
name = "wtbot"
version = "0.1.0"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "bs4>=0.0.2",
    "fastapi[standard]>=0.138.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.0",
    "pandas==3.0.3",
    "pywikibot>=11.4.2",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.51",
    "sqlmodel>=0.0.39",
    "typer>=0.26.8",
    "uvicorn[standard]>=0.49.0",
    "vcrpy>=8.2.1",
]

[project.urls]
Homepage = "https://github.com/tolland/wikisource-plugin"
Repository = "https://github.com/tolland/wikisource-plugin"
Issues = "https://github.com/tolland/wikisource-plugin/issues"


[dependency-groups]
test = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
wtbot = "wtbot.cli:run_cli"

[tool.hatch.build.targets.wheel]
packages = ["src-py/wtbot"]

[project.optional-dependencies]
dev = [
    "black>=26.0",
    "pre-commit>=4.0",
    "pytest>=9.1.1",
    "ruff>=0.15",
    "vcrpy>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src-py"]
testpaths = ["src-py/tests"]
addopts = "-ra -q --strict-markers"

[tool.black]
line-length = 88
target-version = ["py313"]
extend-exclude = '''
/(
    \.venv
  | \.gradle
  | build
  | src-py/wtbot/notebooks
)/
'''

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src-py"]
extend-exclude = [
    "src-py/wtbot/notebooks",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]
