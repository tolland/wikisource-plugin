# The suite against several resolutions of the declared dependency ranges.
#
# `uv run pytest` proves the code works against *one* resolution -- whichever
# uv.lock happens to hold, and the lock is gitignored (it carries LAN-local
# mirror URLs), so no two machines are guaranteed the same one. That is how a
# real breakage stayed invisible: every annotation write raised under sqlmodel
# 0.0.45+, which added a UTCDateTime bind processor that rejects naive
# datetimes, while a workstation resolved below that saw a green suite.
#
# So the envs pin the edges of what `project.dependencies` actually promises,
# rather than a spread of versions for its own sake. Raise a floor here and in
# `project.dependencies` together -- an env pinned below the declared minimum
# tests a claim the package does not make.
#
#   uv run --group tox tox                  # every env
#   uv run --group tox tox -e latest        # one env
#   uv run --group tox tox -- -x -k annotation   # args after -- reach pytest
#
# tox-uv builds each env with uv and deliberately does not read uv.lock: the
# point is to re-resolve, which is exactly what a lockfile prevents.
#
# This is tox's ini format rather than pyproject's `[tool.tox]` on purpose.
# In the TOML form `commands` must be a list of argument lists, and `{posargs}`
# is substituted into one of those elements as a single joined string -- so
# `tox -- -x -q` reaches pytest as the one unparseable argument "-x -q".
# Here posargs expand as written.

[tox]
requires =
    tox>=4.30
    tox-uv>=1.30
env_list = floor, naive-ok, naive-strict, latest

[testenv]
description = pytest against one resolution of the dependency ranges
runner = uv-venv-runner
package = wheel
dependency_groups = test
commands = pytest {posargs}

[testenv:floor]
description = the declared sqlmodel floor -- proves the minimum really runs
deps = sqlmodel==0.0.39

[testenv:naive-ok]
description = last sqlmodel that stores naive datetimes without complaint
deps = sqlmodel==0.0.44

[testenv:naive-strict]
description = first sqlmodel whose UTCDateTime rejects naive datetimes
deps = sqlmodel==0.0.45

[testenv:latest]
description = unpinned -- what CI or a fresh clone resolves today
