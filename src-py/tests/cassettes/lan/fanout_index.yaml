        name, signifying ''''Ens necessarium''''; in my belief Really creator of all
        three Universes of Experience.\n\nSome words shall herein be capitalised when
        used, not as vernacular, but as terms defined. Thus an \"idea\" is the substance
        of an actual unitary thought or fancy; but \"Idea,\" nearer Plato''s idea
        of \u1f30\u03b4\u03ad\u03b1, denotes anything whose Being consists in its
        mere capacity for getting fully represented, regardless of any person''s faculty
        or impotence to represent it.\n\n\"Real\" is a word invented in the thirteenth
        century to signify having Properties, ''''i.e.'''' characters sufficing to
        identify their subject, and possessing these whether they be anywise attributed
        to it by any single man or group of men, or not. Thus, the substance of a
        dream is not Real, since it was such as it was, merely in that a dreamer so
        dreamed it; but the fact of the dream is Real, if it was dreamed; since if
        so, its date, the name of the dreamer, etc., make up a set of circumstances
        sufficient to distinguish it from all other events; and these belong to it,
        ''''i.e.'''' would be true if predicated of it, whether A, B, or C Actually
        ascertains them or not. The \"Actual\" is that which is met with in the past,
        present, or future. An \"Experience\" is a brutally produced conscious effect
        that contributes to a habit, self-controlled, yet so satisfying, on<noinclude></noinclude>"}},"comment":"1
