        level=\"3\" user=\"JoanSevier\" /></noinclude>Only, the Player should bear
        in mind that the higher weapons\nin the arsenal of thought are not play-things
        but edge-tools.\nIn any mere Play they can be used by way of exercise alone;\nwhile
        logical analysis can be put to its full efficiency in\nMusement. So, continuing
        the counsels that had been asked\nof me, I should say, \"Enter your skiff
        of Musement, push\noff into the lake of thought, and leave the breath of heaven\nto
        swell your sail. With your eyes open, awake to what is\nabout or within you,
        and open conversation with yourself;\nfor such is all meditation.\" It is,
        however, not a conversation\nin words alone, but is illustrated, like a lecture,
        with diagrams\nand with experiments.\n\nDifferent people have such wonderfully
        different ways of\nthinking, that it would be far beyond my competence to
        say\nwhat courses Musements might not take; but a brain endowed\nwith automatic
        control, as man''s indirectly is, is so naturally\nand rightly interested
        in its own faculties that some psychological and semi-psychological questions
        would doubtless get\ntouched; such, in the latter class, as this: Darwinians,
        with\ntruly surprising ingenuity, have concocted, and with still more\nastonishing
        confidence have accepted as proved, one explanation for the diverse and delicate
        beauties of flowers, another\nfor those of butterflies, and so on; but why
        is all nature\u2014the\nforms of trees, the compositions of sunsets\u2014suffused
        with such\nbeauties throughout, and not nature only, but the other two\nUniverses
        as well? Among more purely psychological questions, the nature of pleasure
        and pain will be likely to attract\nattention. Are they mere qualities of
        feeling, or are they\nrather motor instincts attracting us to some feelings
        and\nrepelling others? Have pleasure and pain the same sort of\nconstitution,
        or are they contrasted in this respect, pleasure\narising upon the formation
        or strengthening of an association\nby resemblance, and pain upon the weakening
        or disruption of\nsuch a habit or conception?\n\nPsychological speculations
        will naturally lead on to musings\nupon metaphysical problems proper, good
        exercise for a mind<noinclude></noinclude>"}},"comment":"1 revision imported","parsedcomment":"1
        revision imported","tags":[]}]}},"userinfo":{"id":0,"name":"192.168.10.10","anon":""}}}'
