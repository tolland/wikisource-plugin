        level=\"3\" user=\"JoanSevier\" /></noinclude>dart through space too swiftly
        to be held down by the earth''s\ngravitation, coronium being the slowest-moving
        of these. This\nsmall number bespeaks comparative simplicity of structure.\nYet
        no mathematician but will confess the present hopelessness of attempting to
        comprehend the constitution of the\nhydrogen-atom, the simplest of the elements
        that can be\nheld to earth.\n\nFrom speculations on the homogeneities of each
        Universe,\nthe Muser will naturally pass to the consideration of homogeneities
        and connections between two different Universes, or\nall three. Especially
        in them all we find one type of occurrence, that of growth, itself consisting
        in the homogeneities of\nsmall parts. This is evident in the growth of motion
        into\ndisplacement, and the growth of force into motion. In growth,\ntoo,
        we find that the three Universes conspire; and a universal\nfeature of it
        is provision for later stages in earlier ones. This\nis a specimen of certain
        lines of reflection which will inevitably\nsuggest the hypothesis of God''s
        Reality. It is not that such\nphenomena might not be capable of being accounted
        for, in\none sense, by the action of chance with the smallest conceivable\ndose
        of a higher element; for if by God be meant the ''''Ens necessarium'''', that
        very hypothesis requires that such should be\nthe case. But the point is that
        that sort of explanation leaves\na mental explanation just as needful as before.
        Tell me, upon\nsufficient authority, that all cerebration depends upon movements
        of neurites that strictly obey certain physical laws, and\nthat thus all expressions
        of thought, both external and internal,\nreceive a physical explanation, and
        I shall be ready to believe\nyou. But if you go on to say that this explodes
        the theory\nthat my neighbour and myself are governed by reason, and are\nthinking
        beings, I must frankly say that it will not give me a\nhigh opinion of your
        intelligence. But however that may be,\nin the Pure Play of Musement the idea
        of God''s Reality will\nbe sure sooner or later to be found an attractive
        fancy, which\nthe Muser will develop in various ways. The more he ponders\nit,
