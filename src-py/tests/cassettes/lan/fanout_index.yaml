      string: '{"continue":{"rvcontinue":"20250208191426|23963","continue":"||info|proofread|userinfo"},"query":{"pageids":["11594"],"pages":{"11594":{"pageid":11594,"ns":250,"title":"Page:NeglectedArgument.pdf/23","contentmodel":"proofread-page","pagelanguage":"en","pagelanguagehtmlcode":"en","pagelanguagedir":"ltr","touched":"2026-06-30T06:28:22Z","lastrevid":23964,"length":2151,"proofread":{"quality":3,"quality_text":"Proofread"},"revisions":[{"revid":23964,"parentid":23963,"minor":"","user":"Admin","userid":1,"timestamp":"2026-06-30T06:28:22Z","size":2151,"sha1":"343df56ec0f60d9407bba5f435f9ca9074ffd9ab","roles":["main"],"slots":{"main":{"contentmodel":"proofread-page","contentformat":"text/x-wiki","*":"<noinclude><pagequality
        level=\"3\" user=\"JoanSevier\" /></noinclude>issue. This, I beg to point
        out, is a very different position\nfrom that of Mr [[Author:Ferdinand Canning
        Scott Schiller|Schiller]] and the pragmatists of to-day.\nI trust I shall
        be believed when I say that it is only a\ndesire to avoid being misunderstood
        in consequence of my\nrelations with pragmatism, and by no means as arrogating
        any\nsuperior immunity from error which I have too good reason\nto know that
        I do not enjoy, that leads me to express my\npersonal sentiments about their
        tenets. Their avowedly undefmable position, if it be not capable of logical
        characterisation,\nseems to me to be characterised by an angry hatred of strict\nlogic,
        and even some disposition to rate any exact thought\nwhich interferes with
        their doctrines as all humbug. At the\nsame time, it seems to me clear that
        their approximate acceptance of the Pragmaticist principle, and even that
        very casting\naside of difficult distinctions (although I cannot approve of
        it),\nhas helped them to a mightily clear discernment of some\nfundamental
        truths that other philosophers have seen but\nthrough a mist, and most of
        them not at all. Among such\ntruths\u2014all of them old, of course, yet acknowledged
        by\nfew\u2014I reckon their denial of necessitarianism; their rejection\nof
        any \"consciousness\" different from a visceral or other\nexternal sensation;
        their acknowledgment that there are,\nin a Pragmatistical sense, Real habits
        (which Really ''''would''''\nproduce effects, under circumstances that may
        not happen to\nget actualised, and are thus Real generals); and their insistence
        upon interpreting all hypostatic abstractions in terms\nof what they ''''would''''
        or ''''might'''' (not actually ''''will'''') come to in\nthe concrete. It
        seems to me a pity they should allow a\nphilosophy so instinct with life to
        become infected with seeds\nof death in such notions as that of the unreality
        of all ideas of\ninfinity and that of the mutability of truth, and in such
        confusions of thought as that of active willing (willing to control\nthought,
        to doubt, and to weigh reasons) with willing not to\nexert the will (willing
        to believe).\n\n{{right|{{larger|C. S. PEIRCE.}}}}\n\n{{smaller|WESTFALL,
        PENNSYLVANIA.}}<noinclude></noinclude>"}},"comment":"1 revision imported","parsedcomment":"1
        revision imported","tags":[]}]}},"userinfo":{"id":0,"name":"192.168.10.10","anon":""}}}'
