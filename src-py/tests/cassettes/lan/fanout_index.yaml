        level=\"3\" user=\"JoanSevier\" /></noinclude>expect that there would be some
        Argument for His Reality that should be obvious to all minds, high and low
        alike, that should earnestly strive to find the truth of the matter; and further,
        that this Argument should present its conclusion, not as a proposition of
        metaphysical theology, but in a form directly applicable to the conduct of
        life, and full of nutrition for man''s highest growth. What I shall refer
        to as the N.A.\u2014the Neglected Argument\u2014seems to me best to fulfil
        this condition, and I should not wonder if the majority of those whose own
        reflections have harvested belief in God must bless the radiance of the N.A.
        for that wealth. Its persuasiveness is no less than extraordinary; while it
        is not unknown to anybody. Nevertheless, of all those theologians (within
        my little range of reading) who, with commendable assiduity, scrape together
        all the sound reasons they can find or concoct to prove the first proposition
        of theology, few mention this one, and they most briefly. They probably share
        those current notions of logic which recognise no other Arguments than Argumentations.\n\nThere
        is a certain agreeable occupation of mind which, from its having no distinctive
        name, I infer is not as commonly practised as it deserves to be; for indulged
        in moderately\u2014say through some five to six per cent. of one''s waking
        time, perhaps during a stroll\u2014it is refreshing enough more than to repay
        the expenditure. Because it involves no purpose save that of casting aside
        all serious purpose, I have sometimes been half-inclined to call it reverie,
        with some qualification; but for a frame of mind so antipodal to vacancy and
        dreaminess such a designation would be too excruciating a misfit. In fact,
        it is Pure Play. Now, Play, we all know, is a lively exercise of one''s powers.
        Pure Play has no rules, except this very law of liberty. It bloweth where
        it listeth. It has no purpose, unless recreation. The particular occupation
        I mean\u2014a ''''petite bouch\u00e9e'''' with the Universes\u2014may take
        either the form of esthetic contemplation, or that of distant castle-building
        (whether in Spain or within one''s own moral training), or<noinclude></noinclude>"}},"comment":"1
