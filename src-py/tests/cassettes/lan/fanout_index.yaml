        speculation\nconcerning its cause. It is this last kind\u2014I will call it\n\"Musement\"
        on the whole\u2014that I particularly recommend,\nbecause it will in time
        flower into the N.A. One who sits\ndown with the purpose of becoming convinced
        of the truth\nof religion is plainly not inquiring in scientific singleness
        of\nheart, and must always suspect himself of reasoning unfairly.\nSo he can
        never attain the entirety even of a physicist''s belief\nin electrons, although
        this is avowedly but provisional. But\nlet religious meditation be allowed
        to grow up spontaneously\nout of Pure Play without any breach of continuity,
        and the\nMuser will retain the perfect candour proper to Musement.\n\nIf one
        who had determined to make trial of Musement\nas a favourite recreation were
        to ask me for advice, I should\nreply as follows: The dawn and the gloaming
        most invite\none to Musement; but I have found no watch of the\nnychthemeron
        that has not its own advantages for the pursuit.\nIt begins passively enough
        with drinking in the impression\nof some nook in one of the three Universes.
        But impression\nsoon passes into attentive observation, observation into\nmusing,
        musing into a lively give-and-take of communion\nbetween self and self. If
        one''s observations and reflections\nare allowed to specialise themselves
        too much, the Play will\nbe converted into scientific study; and that cannot
        be pursued\nin odd half-hours.\n\nI should add: adhere to the one ordinance
        of Play, the\nlaw of liberty. I can testify that the last half century, at\nleast,
        has never lacked tribes of Sir Oracles, colporting\nbrocards to bar off one
        or another roadway of inquiry; and\na Rabelais would be needed to bring out
        all the fun that has\nbeen packed in their airs of infallibility. Auguste
        Comte,\nnotwithstanding his having apparently produced some unquestionably
        genuine thinking, was long the chief of such a band.\nThe vogue of each particular
        maxim of theirs was necessarily\nbrief. For what distinction can be gained
