        level=\"3\" user=\"JoanSevier\" /></noinclude>In 1871, in a Metaphysical Club
        in Cambridge, Mass., I\nused to preach this principle as a sort of logical
        gospel, representing the unformulated method followed by Berkeley, and\nin
        conversation about it I called it \"Pragmatism.\" In\nDecember 1877 and January
        1878 I set forth the doctrine\nin the ''''Popular Science Monthly'''', and
        the two parts of my\nessay were printed in French in the ''''Revue Philosophique'''',\nvolumes
        vi. and vii. Of course, the doctrine attracted no particular attention, for,
        as I had remarked in my opening sentence,\nvery few people care for logic.
        But in 1897 Professor James\nremodelled the matter, and transmogrified it
        into a doctrine\nof philosophy, some parts of which I highly approved, while\nother
        and more prominent parts I regarded, and still regard, as\nopposed to sound
        logic. About the time Professor Papirie\ndiscovered, to the delight of the
        Pragmatist school, that this\ndoctrine was incapable of definition, which
        would certainly\nseem to distinguish it from every other doctrine in whatever\nbranch
        of science, I was coming to the conclusion that my\npoor little maxim should
        be called by another name; and\naccordingly, in April 1905, I renamed it ''''Pragmaticism''''.
        I had\nnever before dignified it by any name in print, except that, at\nProfessor
        Baldwin''s request, I wrote a definition of it for his\n''''Dictionary of
        Psychology and Philosophy''''. I did not insert the\nword in the ''''Century
        Dictionary'''', though I had charge of the\nphilosophical definitions of that
        work; for I have a perhaps\nexaggerated dislike of ''''r\u00e9clame''''.\n\nIt
        is that course of meditation upon the three Universes\nwhich gives birth to
        the hypothesis and ultimately to the\nbelief that they, or at any rate two
        of the three, have a\nCreator independent of them, that I have throughout
        this\narticle called the N.A., because I think the theologians ought\nto have
        recognised it as a line of thought reasonably productive\nof belief. This
        is the \"humble\" argument, the innermost of\nthe nest. In the mind of a metaphysician
        it will have a\nmetaphysical tinge; but that seems to me rather to detract\nfrom
        its force than to add anything to it. It is just as good<noinclude></noinclude>"}},"comment":"1
        revision imported","parsedcomment":"1 revision imported","tags":[]}]}},"userinfo":{"id":0,"name":"192.168.10.10","anon":""}}}'
