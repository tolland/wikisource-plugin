        level=\"3\" user=\"JoanSevier\" /></noinclude>explanation; but it will suffice
        to say that it limits itself to\nconsiderations already introduced or else
        involved in the Explication ofits conclusion; while ''''Theorematic'''' Demonstration\nresorts
        to a more complicated process of thought.\n\nThe purpose of Deduction, that
        of collecting consequents\nof the hypothesis, having been sufficiently carried
        out, the\ninquiry enters upon its Third Stage, that of ascertaining how\nfar
        those consequents accord with Experience, and of judging\naccordingly whether
        the hypothesis is sensibly correct, or\nrequires some inessential modification,
        or must be entirely\nrejected. Its characteristic way of reasoning is Induction.\nThis
        stage has three parts. For it must begin with Classification, which is an
        Inductive Non-argumentational kind of\nArgument, by which general Ideas are
        attached to objects of\nExperience; or rather by which the latter are subordinated
        to\nthe former. Following this will come the testing-argumentations, the Probations;
        and the whole inquiry will be wound\nup with the Sentential part of the Third
        Stage, which, by\nInductive reasonings, appraises the different Probations
        singly,\nthen their combinations, then makes self-appraisal of these\nvery
        appraisals themselves, and passes final judgment on the\nwhole result.\n\nThe
        Probations, or direct Inductive Argumentations, are\nof two kinds. The first
        is that which Bacon ill described as\n\"''''inductio ilia qu{{ae}} procedit
        per enumerationem simplicem''''.\" So\nat least he has been understood. For
        an enumeration of\ninstances is not essential to the argument that, for example,\nthere
        are no such beings as fairies, or no such events as\nmiracles. The point is
        that there is no well-established instance of such a thing. I call this Crude
        Induction. It is\nthe only Induction which concludes a logically Universal\nProposition.
        It is the weakest of arguments, being liable to\nbe demolished in a moment,
        as happened toward the end of\nthe eighteenth century to the opinion of the
