        level=\"3\" user=\"JoanSevier\" /></noinclude>The second is the misanthropical
        type, the type that makes\nitself heard. It suffices to call to mind the conduct
        of the\nfamous pessimists of this kind, Diogenes the Cynic, Schopenhauer,
        Carlyle, and their kin with Shakespeare''s Timon of\nAthens, to recognise
        them as diseased minds. The third is\nthe philanthropical type, people whose
        lively sympathies, easily\nexcited, become roused to anger at what they consider
        the\nstupid injustices of life. Being easily interested in everything,\nwithout
        being overloaded with exact thought of any kind, they\nare excellent raw material
        for ''''litt\u00e9rateurs'''': witness Voltaire.\nNo individual remotely approaching
        the calibre of a Leibniz is\nto be found among them.\n\nThe third argument,
        enclosing and defending the other\ntwo, consists in the development of those
        principles of logic\naccording to which the humble argument is the first stage
        of\na scientific inquiry into the origin of the three Universes, but\nof an
        inquiry which produces, not merely scientific belief,\nwhich is always provisional,
        but also a living, practical belief,\nlogically justified in crossing the
        Rubicon with all the freightage of eternity. The presentation of this argument
        would\nrequire the establishment of several principles of logic that\nthe
        logicians have hardly dreamed of, and particularly a strict\nproof of the
        correctness of the maxim of Pragmaticism. My\noriginal essay, having been
        written for a popular monthly,\nassumes, for no better reason than that real
        inquiry cannot\nbegin until a state of real doubt arises and ends as soon
        as\nBelief is attained, that \"a settlement of Belief,\" or, in other\nwords,
        a state of ''''satisfaction'''', is all that Truth, or the aim of\ninquiry,
        consists in. The reason I gave for this was so flimsy,\nwhile the inference
        was so nearly the gist of Pragmaticism,\nthat I must confess the argument
        of that essay might with\nsome justice be said to beg the question. The first
        part of\nthe essay, however, is occupied with showing that, if Truth\nconsists
        in satisfaction, it cannot be any ''''actual'''' satisfaction,\nbut must be
        the satisfaction which ''''would'''' ultimately be found\nif the inquiry were
        pushed to its ultimate and indefeasible<noinclude></noinclude>"}},"comment":"1
        revision imported","parsedcomment":"1 revision imported","tags":[]}]}},"userinfo":{"id":0,"name":"192.168.10.10","anon":""}}}'
