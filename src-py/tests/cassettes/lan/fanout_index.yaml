        level=\"3\" user=\"JoanSevier\" /></noinclude>august practicality, even to
        the point of earnestly loving and\nadoring his strictly hypothetical God,
        and to that of desiring\nabove all things to shape the whole conduct of life
        and all the\nsprings of action into conformity with that hypothesis. Now\nto
        be deliberately and thoroughly prepared to shape one''s\nconduct into conformity
        with a proposition is neither more\nnor less than the state of mind called
        Believing that proposition,\nhowever long the conscious classification of
        it under that head\nbe postponed.\n\n{{center|{{x-larger|III.}}}}\n\nThere
        is my poor sketch of the Neglected Argument,\ngreatly cut down to bring it
        within the limits assigned to\nthis article. Next should come the discussion
        of its logicality;\nbut nothing readable at a sitting could possibly bring
        home\nto readers my full proof of the principal points of such an\nexamination.
        I can only hope to make the residue of this\npaper a sort of table of contents,
        from which some may\npossibly guess what I have to say; or to lay down a series
        of\nplausible points through which the reader will have to construct the continuous
        line of reasoning for himself. In my\nown mind the proof is elaborated, and
        I am exerting my\nenergies to getting it submitted to public censure. My\npresent
        abstract will divide itself into three unequal parts.\nThe first shall give
        the headings of the different steps of\nevery well-conducted and complete
        inquiry, without noticing\npossible divergencies from the norm. I shall have
        to mention\nsome steps which have nothing to do with the Neglected\nArgument
        in order to show that they add no jot nor tittle\nto the truth which is invariably
        brought just as the Neglected\nArgument brings it. The second part shall very
        briefly state,\nwithout argument (for which there is no room), just wherein\nlies
        the logical validity of the reasoning characteristic of each\nof the main
        stages of inquiry. The third part shall indicate\nthe place of the Neglected
        Argument in a complete inquiry\ninto the Reality of God, and shall show how
        well it would\nfill that place, and what its logical value is supposing the<noinclude></noinclude>"}},"comment":"1
