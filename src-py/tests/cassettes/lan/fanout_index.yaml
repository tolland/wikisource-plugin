        level=\"3\" user=\"JoanSevier\" /></noinclude>understanding sufficient for
        the conduct of life. This brings\nhim, for testing the hypothesis, to taking
        his stand upon\nPragmaticism, which implies faith in common sense and in\ninstinct,
        though only as they issue from the cupel-furnace of\nmeasured criticism. In
        short, he will say that the N.A. is the\nFirst Stage of a scientific inquiry,
        resulting in a hypothesis of\nthe very highest Plausibility, whose ultimate
        test must lie in\nits value in the self-controlled growth of man''s conduct
        of life.\n\n\nSince I have employed the word ''''Pragmaticism'''', and\nshall
        have occasion to use it once more, it may perhaps be\nwell to explain it.
        About forty years ago, my studies of\nBerkeley, Kant, and others led me, after
        convincing myself\nthat all thinking is performed in Signs, and that meditation\ntakes
        the form of a dialogue, so that it is proper to speak of\nthe \"meaning\"
        of a concept, to conclude that to acquire full\nmastery of that meaning it
        is requisite, in the first place, to\nlearn to recognise the concept under
        every disguise, through\nextensive familiarity with instances of it. But this,
        after all,\ndoes not imply any true understanding of it; so that it is\nfurther
        requisite that we should make an abstract logical\nanalysis of it into its
        ultimate elements, or as complete an\nanalysis as we can compass. But, even
        so, we may still be\nwithout any living comprehension of it; and the only
        way to\ncomplete our knowledge of its nature is to discover and recognise
        just what general habits of conduct a belief in the truth\nof the concept
        (of any conceivable subject, and under any conceivable circumstances) would
        reasonably develop; that is to\nsay, what habits would ultimately result from
        a sufficient consideration of such truth. It is necessary to understand the\nword
        \"conduct,\" here, in the broadest sense. If, for example,\nthe predication
        of a given concept were to lead to our admitting that a given form of reasoning
        concerning the subject of\nwhich it was affirmed was valid, when it would
        not otherwise\nbe valid, the recognition of that effect in our reasoning would\ndecidedly
        be a habit of conduct.<noinclude></noinclude>"}},"comment":"1 revision imported","parsedcomment":"1
