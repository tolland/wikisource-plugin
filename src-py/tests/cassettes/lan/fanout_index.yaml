        level=\"3\" user=\"JoanSevier\" /></noinclude>truth in the hypothesis with
        every new instance; and given\nany degree of error there will ''''sometime''''
        be an estimate (or\nwould be, if the probation were persisted in) which will
        be\nabsolutely the last to be infected with so much falsity.\nGradual Induction
        is either Qualitative or Quantitative, and\nthe latter either depends on measurements,
        or on statistics, or\non countings.\n\n{{center|{{x-larger|IV.}}}}\n\nConcerning
        the question of the nature of the logical\nvalidity possessed by Deduction,
        Induction, and Retrod uction,\nwhich is still an arena of controversy, I shall
        confine myself to\nstating the opinions which I am prepared to defend by positive
        proofs. The validity of Deduction was correctly, if not\nvery clearly, analysed
        by Kant. This kind of reasoning deals\nexclusively with Pure Ideas attaching
        primarily to Symbols\nand derivatively to other Signs of our own creation;
        and the\nfact that man has a power of Explicating his own meaning\nrenders
        Deduction valid. Induction is a kind of reasoning\nthat may lead us into error;
        but that it follows a method which,\nsufficiently persisted in, will be Inductively
        Certain (the sort\nof certainty we have that a perfect coin, pitched up often\nenough,
        will ''''sometime'''' turn up heads) to diminish the error\nbelow any predesignate
        degree, is assured by man''s power of\nperceiving Inductive Certainty. In
        all this I am inviting the\nreader to peep through the big end of the telescope;
        there is\na wealth of pertinent detail that must here be passed over.\n\nFinally
