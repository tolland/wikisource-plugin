        supposing it granted, show\nthat reason has nothing to do with my actions?
        Even the\nparallelists will admit that the one explanation leaves the same\nneed
        of the other that there was before it was given; and this\nis certainly sound
        logic. There is a reason, an interpretation,\na logic, in the course of scientific
