        level=\"3\" user=\"JoanSevier\" /></noinclude>deliberation, as to be destructible
        by no positive exercise of internal vigour. I use the word \"self-controlled\"
        for \"controlled by the thinker''s self,\" and not for \"uncontrolled\" except
        in its own spontaneous, ''''i.e.'''' automatic, self-development, as Professor
        J. M. Baldwin uses the word. Take for illustration the sensation undergone
        by a child that puts its forefinger into a flame with the acquisition of a
        habit of keeping all its members out of all flames. A compulsion is \"Brute,\"
        whose immediate efficacy nowise consists in conformity to rule or reason.\n\nOf
        the three Universes of Experience familiar to us all, the first comprises
        all mere Ideas, those airy nothings to which the mind of poet, pure mathematician,
        or another ''''might'''' give local habitation and a name within that mind.
        Their very airy-nothingness, the fact that their Being consists in mere capability
        of getting thought, not in anybody''s Actually thinking them, saves their
        Reality. The second Universe is that of the Brute Actuality of things and
        facts. I am confident that their Being consists in reactions against Brute
        forces, notwithstanding objections redoubtable until they are closely and
        fairly examined. The third Universe comprises everything whose being consists
        in active power to establish connections between different objects, especially
        between objects in different Universes. Such is everything which is essentially
        a Sign\u2014not the mere body of the Sign, which is not essentially such,
        but, so to speak, the Sign''s Soul, which has its Being in its power of serving
        as intermediary between its Object and a Mind. Such, too, is a living consciousness,
        and such the life, the power of growth, of a plant. Such is a living constitution\u2014a
        daily newspaper, a great fortune, a social \"movement.\"\n\nAn \"Argument\"
        is any process of thought reasonably tending to produce a definite belief.
        An \"Argumentation\" is an Argument proceeding upon definitely formulated
