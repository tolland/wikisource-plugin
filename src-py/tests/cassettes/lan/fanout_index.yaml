        or less important for those\ninquiries that self-interest prompts.\n\nThe
        first answer we naturally give to this question is that\nwe cannot help accepting
        the conjecture at such a valuation\nas that at which we do accept it; whether
        as a simple interrogation, or as more or less Plausible, or, occasionally,
        as an\nirresistible belief. But far from constituting, by itself, a\nlogical
        justification such as it becomes a rational being to put\nforth, this pleading,
        that we ''''cannot help'''' yielding to the suggestion, amounts to nothing
        more than a confession of having\nfailed to train ourselves to control our
        thoughts. It is more\nto the purpose, however, to urge that the strength of
        the impulse\nis a symptom of its being instinctive. Animals of all races\nrise
        far above the general level of their intelligence in those\nperformances that
        are their proper function, such as flying and\nnest-building for ordinary
        birds; and what is man''s proper\nfunction if it be not to embody general
        ideas in art-creations,\nin utilities, and above all in theoretical cognition?
        To give\nthe lie to his own consciousness of divining the reasons of\nphenomena
        would be as silly in a man as it would be in a\nfledgling bird to refuse to
