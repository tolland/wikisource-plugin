        x 571.68 pts"}]},{"name":"pdf-Version","value":"1.7"}]},{"name":"text","value":[{"name":0,"value":"A
        NEGLECTED ARGUMENT FOR\nTHE REALITY OF GOD.\nC. S. PE1RCE.\nI.\nTHE word \"
        God,\" so \" capitalised \" (as we Americans say), is\ntlie definable proper
        name, signifying Ens necessarium ; in my\nbelief Really creator of all three
        Universes of Experience.\nSome words shall herein be capitalised when used,
        not as\nvernacular, but as terms defined. Thus an \" idea \" is the\nsubstance
        of an actual unitary thought or fancy ; but \" Idea,\"\nnearer Plato''s idea
        of tSe''a, denotes anything whose Being consists in its mere capacity for
        getting fully represented, regardless\nof any person''s faculty or impotence
        to represent it.\n\" Real \" is a word invented in the thirteenth century
        to\nsignify having Properties, i.e. characters sufficing to identify\ntheir
        subject, and possessing these whether they be anywise\nattributed to it by
        any single man or group of men, or not.\nThus, the substance of a dream is
        not Real, since it was such\nas it was, merely in that a dreamer so dreamed
        it ; but the fact\nof the dream is Real, if it was dreamed ; since if so,
        its date,\nthe name of the dreamer, etc., make up a set of circumstances\nsufficient
        to distinguish it from all other events ; and these\nbelong to it, i.e. would
        be true if predicated of it, whether\nA, B, or C Actually ascertains them
        or not. The \" Actual \"\nis that which is met with in the past, present,
        or future.\nAn \" Experience \" is a brutally produced conscious effect\nthat
        contributes to a habit, self-controlled, yet so satisfying, on\n\n"},{"name":1,"value":"THE\n\nREALITY\n\nOF\n\nGOD\n\n91\n\ndeliberation,
        as to be destructible by no positive exercise of\ninternal vigour. I use the
        word \" self-controlled \" for \" controlled by the thinker''s self,\" and
        not for \"uncontrolled\"\nexcept in its own spontaneous, i.e. automatic, self-development,\nas
        Professor J. M. Baldwin uses the word. Take for illustration\nthe sensation
        undergone by a child that puts its forefinger into a\nflame with the acquisition
        of a habit of keeping all its members\nout of all flames. A compulsion is
        \" Brute,\" whose immediate\nefficacy nowise consists in conformity to rule
        or reason.\nOf the three Universes of Experience familiar to us all,\nthe
        first comprises all mere Ideas, those airy nothings to which\nthe mind of
        poet, pure mathematician, or another might give\nlocal habitation and a name
        within that mind. Their very\nairy-nothingness, the fact that their Being
        consists in mere\ncapability of getting thought, not in anybody''s Actually\nthinking
        them, saves their Reality. The second Universe is\nthat of the Brute Actuality
        of things and facts. I am confident that their Being consists in reactions
        against Brute\nforces, notwithstanding objections redoubtable until they are\nclosely
        and fairly examined. The third Universe comprises\neverything whose being
        consists in active power to establish\nconnections between different objects,
        especially between\nobjects in different Universes. Such is everything which
        is\nessentially a Sign \u2014 not the mere body of the Sign, which is not\nessentially
        such, but, so to speak, the Sign''s Soul, which has\nits Being in its power
        of serving as intermediary between its\nObject and a Mind. Such, too, is a
        living consciousness, and\nsuch the life, the power of growth, of a plant.
        Such is a living\nconstitution \u2014 a daily newspaper, a great fortune,
        a social\n\" movement.\"\nAn \"Argument\" is any process of thought reasonably\ntending
        to produce a definite belief. An \" Argumentation \" is\nan Argument proceeding
        upon definitely formulated premisses.\nIf God Really be, and be benign, then,
        in view of the\ngenerally conceded truth that religion, were it but proved,\nwould
        be a good outweighing all others, we should naturally\n\n"},{"name":2,"value":"92\n\nTHE\n\nHIBBERT\n\nJOURNAL\n\nexpect
        that there would be some Argument for His Reality\nthat should be obvious
        to all minds, high and low alike, that\nshould earnestly strive to find the
        truth of the matter ; and\nfurther, that this Argument should present its
        conclusion, not\nas a proposition of metaphysical theology, but in a form
        directly\napplicable to the conduct of life, and full of nutrition for\nman''s
        highest growth. What I shall refer to as the N.A.\u2014\nthe Neglected Argument
        \u2014 seems to me best to fulfil this\ncondition, and I should not wonder
        if the majority of those\nwhose own reflections have harvested belief in God
        must\nbless the radiance of the N. A. for that wealth. Its persuasiveness
        is no less than extraordinary ; while it is not unknown\nto anybody. Nevertheless,
        of all those theologians (within my\nlittle range of reading) who, with commendable
        assiduity,\nscrape together all the sound reasons they can find or concoct\nto
        prove the first proposition of theology, few mention this\none, and they most
        briefly. They probably share those current\nnotions of logic which recognise
        no other Arguments than\nArgumentations.\nThere is a certain agreeable occupation
        of mind which,\nfrom its having no distinctive name, I infer is not as commonly\npractised
        as it deserves to be ; for indulged in moderately \u2014 say\nthrough some
        five to six per cent, of one''s waking time, perhaps\nduring a stroll \u2014
        it is refreshing enough more than to repay the\nexpenditure. Because it involves
        no purpose save that of\ncasting aside all serious purpose, I have sometimes
        been halfinclined to call it reverie, with some qualification ; but for a\nframe
        of mind so antipodal to vacancy and dreaminess such a\ndesignation would be
        too excruciating a misfit. In fact, it is\nPure Play. Now, Play, we all know,
        is a lively exercise of\none''s powers. Pure Play has no rules, except this
        very law\nof liberty. It bloweth where it listeth. It has no purpose,\nunless
        recreation. The particular occupation I mean \u2014 a petite\nbouchee with
        the Universes \u2014 may take either the form of\nesthetic contemplation,
        or that of distant castle-building\n(whether in Spain or within one''s own
        moral training), or\n\n"},{"name":3,"value":"THE\n\nREALITY\n\nOF\n\nGOD\n\n93\n\nthat
        of considering some wonder in one of the Universes, or\nsome connection between
        two of the three, with speculation\nconcerning its cause. It is this last
        kind \u2014 I will call it\n\"Musement\" on the whole \u2014 that I particularly
        recommend,\nbecause it will in time flower into the N.A. One who sits\ndown
        with the purpose of becoming convinced of the truth\nof religion is plainly
        not inquiring in scientific singleness of\nheart, and must always suspect
        himself of reasoning unfairly.\nSo he can never attain the entirety even of
        a physicist''s belief\nin electrons, although this is avowedly but provisional.
        But\nlet religious meditation be allowed to grow up spontaneously\nout of
        Pure Play without any breach of continuity, and the\nMuser will retain the
        perfect candour proper to Musement.\nIf one who had determined to make trial
        of Musement\nas a favourite recreation were to ask me for advice, I should\nreply
        as follows : The dawn and the gloaming most invite\none to Musement ; but
        I have found no watch of the\nnychthemeron that has not its own advantages
        for the pursuit.\nIt begins passively enough with drinking in the impression\nof
        some nook in one of the three Universes. But impression\nsoon passes into
        attentive observation, observation into\nmusing, musing into a lively give-and-take
        of communion\nbetween self and self. If one''s observations and reflections\nare
        allowed to specialise themselves too much, the Play will\nbe converted into
        scientific study ; and that cannot be pursued\nin odd half-hours.\nI should
        add: adhere to the one ordinance of Play, the\nlaw of liberty. I can testify
        that the last half century, at\nleast, has never lacked tribes of Sir Oracles,
        colporting\nbrocards to bar off one or another roadway of inquiry ; and\na
        Rabelais would be needed to bring out all the fun that has\nbeen packed in
        their airs of infallibility. Auguste Comte,\nnotwithstanding his having apparently
        produced some unquestionably genuine thinking, was long the chief of such
        a band.\nThe vogue of each particular maxim of theirs was necessarily\nbrief.
        For what distinction can be gained by repeating saws\n\n"},{"name":4,"value":"94\n\nTHE\n\nHIBBERT\n\nJOURNAL\n\nheard
        from all mouths ? No bygone fashion seems more\ngrotesque than a panache of
        obsolete wisdom. I remember\nthe days when a pronouncement all the rage was
        that no\nscience must borrow the methods of another ; the geologist\nmust
        not use a microscope, nor the astronomer a spectroscope. Optics must not meddle
        with electricity, nor logic\nwith algebra. But twenty years later, if you
        aspired to pass\nfor a commanding intellect, you would have to pull a long\nface
        and declare that \" It is not the business of science to\nsearch for origins.\"
        This maxim was a masterpiece, since\nno timid soul, in dread of being thought
        naive, would dare\ninquire what \" origins \" were, albeit the secret confessor
        within\nhis breast compelled the awful self-acknowledgment of his\nhaving
        no idea into what else than \" origins \" of phenomena\n(in some sense of
        that indefinite word) man can inquire.\nThat human reason can comprehend some
        causes is past\ndenial, and once we are forced to recognise a given element\nin
        experience, it is reasonable to await positive evidence before\nwe complicate
        our acknowledgment with qualifications.\nOtherwise, why venture beyond direct
        observation? Illustrations of this principle abound in physical science. Since,\nthen,
        it is certain that man is able to understand the laws\nand the causes of some
        phenomena, it is reasonable to assume,\nin regard to any given problem, that
        it would get rightly\nsolved by man, if a sufficiency of time and attention
        were\ndevoted to it. Moreover, those problems that at first blush\nappear
        utterly insoluble receive, in that very circumstance, as\nEdgar Poe remarked
        in his The Murders in the Rue Morgue,\ntheir smoothly-fitting keys. This particularly
        adapts them to\nthe Play of Musement.\nForty or fifty minutes of vigorous
        and unslackened analytic\nthought bestowed upon one of them usually suffices
        to educe\nfrom it all there is to educe, its general solution. There is\nno
        kind of reasoning that I should wish to discourage in\nMusement ; and I should
        lament to find anybody confining\nit to a method of such moderate fertility
        as logical analysis.\n\n"},{"name":5,"value":"THE\n\nREALITY\n\nOF\n\nGOD\n\n95\n\nOnly,
        the Player should bear in mind that the higher weapons\nin the arsenal of
        thought are not play -things but edge-tools.\nIn any mere Play they can be
        used by way of exercise alone ;\nwhile logical analysis can be put to its
        full efficiency in\nMusement. So, continuing the counsels that had been asked\nof
        me, I should say, \" Enter your skiff of Musement, push\noff into the lake
        of thought, and leave the breath of heaven\nto swell your sail. With your
        eyes open, awake to what is\nabout or within you, and open conversation with
        yourself;\nfor such is all meditation.\" It is, however, not a conversation\nin
        words alone, but is illustrated, like a lecture, with diagrams\nand with experiments.\nDifferent
        people have such wonderfully different ways of\nthinking, that it would be
        far beyond my competence to say\nwhat courses Musements might not take ; but
        a brain endowed\nwith automatic control, as man''s indirectly is, is so naturally\nand
        rightly interested in its own faculties that some psychological and semi-psychological
        questions would doubtless get\ntouched ; such, in the latter class, as this
        : Darwinians, with\ntruly surprising ingenuity, have concocted, and with still
        more\nastonishing confidence have accepted as proved, one explanation for
        the diverse and delicate beauties of flowers, another\nfor those of butterflies,
        and so on ; but why is all nature \u2014 the\nforms of trees, the compositions
        of sunsets \u2014 suffused with such\nbeauties throughout, and not nature
        only, but the other two\nUniverses as well ? Among more purely psychological
        questions, the nature of pleasure and pain will be likely to attract\nattention.
        Are they mere qualities of feeling, or are they\nrather motor instincts attracting
        us to some feelings and\nrepelling others ? Have pleasure and pain the same
        sort of\nconstitution, or are they contrasted in this respect, pleasure\narising
        upon the formation or strengthening of an association\nby resemblance, and
        pain upon the weakening or disruption of\nsuch a habit or conception ?\nPsychological
        speculations will naturally lead on to musings\nupon metaphysical problems
        proper, good exercise for a mind\n\n"},{"name":6,"value":"96\n\nTHE\n\nHIBBERT\n\nJOURNAL\n\nwith
        a turn for exact thought. It is here that one finds those\nquestions that
        at first seem to offer no handle for reason''s\nclutch, but which readily
        yield to logical analysis. But\nproblems of metaphysics will inevitably present
        themselves\nthat logical analysis will not suffice to solve. Some of the\nbest
        will be motived by a desire to comprehend universe-wide\naggregates of unformulated
        but partly experienced phenomena.\nI would suggest that the Muser be not too
        impatient to\nanalyse these, lest some significant ingredient be lost in the\nprocess
        ; but that he begin by pondering them from every\npoint of view, until he
        seems to read some truth beneath the\nphenomena.\nAt this point a trained
        mind will demand that an examination be made of the truth of the interpretation
        ; and\nthe first step in such examination must be a logical analysis\nof the
        theory. But strict examination would be a task a\nlittle too serious for the
        Musement of hour-fractions, and if\nit is postponed there will be ample remuneration
        even in the\nsuggestions that there is not time to examine ; especially since\na
        few of them will appeal to reason as all but certain.\nLet the Muser, for
        example, after well appreciating, in its\nbreadth and depth, the unspeakable
        variety of each Universe,\nturn to those phenomena that are of the nature
        of homogeneities of connectedness in each ; and what a spectacle will unroll\nitself
        ! As a mere hint of them 1 may point out that every\nsmall part of space,
        however remote, is bounded by just such\nneighbouring parts as every other,
        without a single exception\nthroughout immensity. The matter of Nature is
        in every star\nof the same elementary kinds, and (except for variations of\ncircumstance)
        what is more wonderful still, throughout the\nwhole visible universe, about
        the same proportions of the\ndifferent chemical elements prevail. Though the
        mere catalogue of known carbon-compounds alone would fill an\nunwieldy volume,
        and perhaps, if the truth were known, the\nnumber of amido-acids alone is
        greater, yet it is unlikely that\nthere are in all more than about 600 elements,
        of which 500\n\n"},{"name":7,"value":"THE\n\nREALITY\n\nOF\n\nGOD\n\n97\n\ndart
        through space too swiftly to be held down by the earth''s\ngravitation, coronium
        being the slowest-moving of these. This\nsmall number bespeaks comparative
        simplicity of structure.\nYet no mathematician but will confess the present
        hopelessness of attempting to comprehend the constitution of the\nhydrogen-atom,
        the simplest of the elements that can be\nheld to earth.\nFrom speculations
        on the homogeneities of each Universe,\nthe Muser will naturally pass to the
        consideration of homogeneities and connections between two different Universes,
        or\nall three. Especially in them all we find one type of occurrence, that
        of growth, itself consisting in the homogeneities of\nsmall parts. This is
        evident in the growth of motion into\ndisplacement, and the growth of force
        into motion. In growth,\ntoo, we find that the three Universes conspire ;
        and a universal\nfeature of it is provision for later stages in earlier ones.
        This\nis a specimen of certain lines of reflection which will inevitably\nsuggest
        the hypothesis of God''s Reality. It is not that such\nphenomena might not
        be capable of being accounted for, in\none sense, by the action of chance
        with the smallest conceivable\ndose of a higher element ; for if by God be
        meant the Ens\nnecessarium, that very hypothesis requires that such should
        be\nthe case. But the point is that that sort of explanation leaves\na mental
        explanation just as needful as before. Tell me, upon\nsufficient authority,
        that all cerebration depends upon movements of neurites that strictly obey
        certain physical laws, and\nthat thus all expressions of thought, both external
        and internal,\nreceive a physical explanation, and I shall be ready to believe\nyou.
        But if you go on to say that this explodes the theory\nthat my neighbour and
        myself are governed by reason, and are\nthinking beings, I must frankly say
        that it will not give me a\nhigh opinion of your intelligence. But however
        that may be,\nin the Pure Play of Musement the idea of God''s Reality will\nbe
        sure sooner or later to be found an attractive fancy, which\nthe Muser will
        develop in various ways. The more he ponders\nit, the more it will find response
        in every part of his mind, for\nVOL. VII.\u2014 No. 1.\n7\n\n"},{"name":8,"value":"98\n\nTHE\n\nHIBBERT\n\nJOURNAL\n\nits
        beauty, for its supplying an ideal of life, and for its\nthoroughly satisfactory
        explanation of his whole threefold\nenvironment.\nII.\nThe hypothesis of God
        is a peculiar one, in that it supposes\nan infinitely incomprehensible object,
        although every hypothesis,\nas such, supposes its object to be truly conceived
        in the\nhypothesis. This leaves the hypothesis but one way of understanding
        itself; namely, as vague yet as true so far as it is\ndefinite, and as continually
        tending to define itself more and\nmore, and without limit. The hypothesis,
        being thus itself\ninevitably subject to the law of growth, appears in its
        vagueness to represent God as so, albeit this is directly contradicted\nin
        the hypothesis from its very first phase. But this apparent\nattribution of
        growth to God, since it is ineradicable from the\nhypothesis, cannot, according
        to the hypothesis, be flatly false.\nIts implications concerning the Universes
        will be maintained\nin the hypothesis, while its implications concerning God
        will\nbe partly disavowed, and yet held to be less false than their\ndenial
        would be. Thus the hypothesis will lead to our\nthinking of features of each
        Universe as purposed ; and this\nwill stand or fall with the hypothesis. Yet
        a purpose essentially involves growth, and so cannot be attributed to God.\nStill
        it will, according to the hypothesis, be less false to speak\nso than to represent
        God as purposeless.\nAssured as I am from my own personal experience that\nevery
        man capable of so controlling his attention as to perform\na little exact
        thinking will, if he examines Zeno''s argument\nabout Achilles and the tortoise,
        come to think, as I do, that it\nis nothing but a contemptible catch, I do
        not think that I\neither am or ought to be less assured, from what I know
        of\nthe effects of Musement on myself and others, that any normal\nman who
        considers the three Universes in the light of the\nhypothesis of God''s Reality,
        and pursues that line of reflection\nin scientific singleness of heart, will
        come to be stirred to the\ndepths of his nature by the beauty of the idea
        and by its\n\n"},{"name":9,"value":"THE\n\nREALITY\n\nOF\n\nGOD\n\n99\n\naugust
        practicality, even to the point of earnestly loving and\nadoring his strictly
        hypothetical God, and to that of desiring\nabove all things to shape the whole
        conduct of life and all the\nsprings of action into conformity with that hypothesis.
        Now\nto be deliberately and thoroughly prepared to shape one''s\nconduct into
        conformity with a proposition is neither more\nnor less than the state of
        mind called Believing that proposition,\nhowever long the conscious classification
        of it under that head\nbe postponed.\nIII.\nThere is my poor sketch of the
        Neglected Argument,\ngreatly cut down to bring it within the limits assigned
        to\nthis article. Next should come the discussion of its logicality ;\nbut
        nothing readable at a sitting could possibly bring home\nto readers my full
        proof of the principal points of such an\nexamination. I can only hope to
        make the residue of this\npaper a sort of table of contents, from which some
        may\npossibly guess what I have to say ; or to lay down a series of\nplausible
        points through which the reader will have to construct the continuous line
        of reasoning for himself. In my\nown mind the proof is elaborated, and I am
        exerting my\nenergies to getting it submitted to public censure. My\npresent
        abstract will divide itself into three unequal parts.\nThe first shall give
        the headings of the different steps of\nevery well-conducted and complete
        inquiry, without noticing\npossible divergencies from the norm. I shall have
        to mention\nsome steps which have nothing to do with the Neglected\nArgument
        in order to show that they add no jot nor tittle\nto the truth which is invariably
        brought just as the Neglected\nArgument brings it. The second part shall very
        briefly state,\nwithout argument (for which there is no room), just wherein\nlies
        the logical validity of the reasoning characteristic of each\nof the main
        stages of inquiry. The third part shall indicate\nthe place of the Neglected
        Argument in a complete inquiry\ninto the Reality of God, and shall show how
        well it would\nfill that place, and what its logical value is supposing the\n\n"},{"name":10,"value":"100\n\nTHE\n\nHIBBERT\n\nJOURNAL\n\ninquiry
        to be limited to this ; and I shall add a few words to\nshow how it might
        be supplemented.\nEvery inquiry whatsoever takes its rise in the observation,\nin
        one or another of the three Universes, of some surprising\nphenomenon, some
        experience which either disappoints an\nexpectation, or breaks in upon some
        habit of expectation of\nthe inquisiturus ; and each apparent exception to
        this rule only\nconfirms it. There are obvious distinctions between the\nobjects
        of surprise in different cases ; but throughout this\nslight sketch of inquiry
        such details will be unnoticed,\nespecially since it is upon such that the
        logic-books descant.\nThe inquiry begins with pondering these phenomena in
        all\ntheir aspects, in the search of some point of view whence the\nwonder
        shall be resolved.\nAt length a conjecture arises that\nfurnishes a possible
        Explanation, by which I mean a syllogism\nexhibiting the surprising fact as
        necessarily consequent upon\nthe circumstances of its occurrence together
        with the truth of\nthe credible conjecture, as premisses.\nOn account of this\nExplanation,
        the inquirer is led to regard his conjecture, or\nhypothesis, with favour.\nAs
        I phrase it, he provisionally holds\nit to be \" Plausible \" ; this acceptance
        ranges in different\ncases \u2014 and reasonably so \u2014 from a mere expression
        of it in the\ninterrogative mood, as a question meriting attention and reply,\nup
        through all appraisals of Plausibility, to uncontrollable\ninclination to
        believe.\nThe whole series of mental performances between the notice of the
        wonderful phenomenon\nand the acceptance of the hypothesis, during which the\nusually
        docile understanding seems to hold the bit between\nits teeth and to have
        us at its mercy \u2014 the search for pertinent\ncircumstances and the laying
        hold of them, sometimes without\nour cognisance, the scrutiny of them, the
        dark labouring, the\nbursting out of the startling conjecture, the remarking
        of its\nsmooth fitting to the anomaly, as it is turned back and forth\nlike
        a key in a lock, and the final estimation of its Plausibility,\nI reckon as
        composing the First Stage of Inquiry.\nIts\ncharacteristic formula of reasoning
        I term Retroduction, i.e.\n\n"},{"name":11,"value":"THE\n\nREALITY\n\nOF\n\nGOD\n\n101\n\nreasoning
        from consequent to antecedent. In one respect\nthe designation seems inappropriate;
        for in most instances\nwhere conjecture mounts the high peaks of Plausibility
        \u2014 and\nis really most worthy of confidence \u2014 the inquirer is unable\ndefinitely
        to formulate just what the explained wonder is ; or\ncan only do so in the
        light of the hypothesis. In short, it is\na form of Argument rather than of
        Argumentation.\nRetroduction does not afford security. The hypothesis\nmust
        be tested.\nThis testing, to be logically valid, must honestly start,\nnot
        as Retroduction starts, with scrutiny of the phenomena,\nbut with examination
        of the hypothesis, and a muster of all\nsorts of conditional experiential
        consequences which would\nfollow from its truth. This constitutes the Second
        Stage of\nInquiry. For its characteristic form of reasoning our language\nhas,
        for two centuries, been happily provided with the name\nDeduction.\nDeduction
        has two parts. For its first step must be by\nlogical analysis to Explicate
        the hypothesis, i.e. to render it\nas perfectly distinct as possible. This
        process, like Retroduction, is Argument that is not Argumentation.\nBut unlike\nRetroduction,
        it cannot go wrong from lack of experience, but\nso long as it proceeds rightly
        must reach a true conclusion.\nExplication is followed by Demonstration, or
        Deductive\nArgumentation.\nIts procedure is best learned from Book I.\nof
        Euclid''s Elements, a masterpiece which in real insight is far\nsuperior to
        Aristotle''s Analytics-, and its numerous fallacies\nrender it all the more
        instructive to a close student.\nIt invariably requires something of the nature
        of a diagram ; that is, an\n\" Icon,\" or Sign that represents its Object
        in resembling it. It\nusually, too, needs \" Indices,\" or Signs that represent
        their\nObjects by being actually connected with them.\nBut it is\nmainly composed
        of \" Symbols,\" or Signs that represent their\nObjects essentially because
        they will be so interpreted. Demonstration should be Corollarial when it can.\nAn
        accurate\ndefinition of Corollarial Demonstration would require a long\n\n"},{"name":12,"value":"102\n\nTHE\n\nHIBBERT\n\nJOURNAL\n\nexplanation
        ; but it will suffice to say that it limits itself to\nconsiderations already
        introduced or else involved in the Explication ofits conclusion; while Theorematic
        Demonstration\nresorts to a more complicated process of thought.\nThe purpose
        of Deduction, that of collecting consequents\nof the hypothesis, having been
        sufficiently carried out, the\ninquiry enters upon its Third Stage, that of
        ascertaining how\nfar those consequents accord with Experience, and of judging\naccordingly
        whether the hypothesis is sensibly correct, or\nrequires some inessential
        modification, or must be entirely\nrejected. Its characteristic way of reasoning
        is Induction.\nThis stage has three parts. For it must begin with Classification,
        which is an Inductive Non-argumentational kind of\nArgument, by which general
        Ideas are attached to objects of\nExperience ; or rather by which the latter
        are subordinated to\nthe former. Following this will come the testing-argumentations,
        the Probations ; and the whole inquiry will be wound\nup with the Sentential
        part of the Third Stage, which, by\nInductive reasonings, appraises the different
        Probations singly,\nthen their combinations, then makes self-appraisal of
        these\nvery appraisals themselves, and passes final judgment on the\nwhole
        result.\nThe Probations, or direct Inductive Argumentations, are\nof two kinds.
        The first is that which Bacon ill described as\n\" inductio ilia quce procedit
        per enumerationem simplicem\" So\nat least he has been understood. For an
        enumeration of\ninstances is not essential to the argument that, for example,\nthere
        are no such beings as fairies, or no such events as\nmiracles. The point is
        that there is no well-established instance of such a thing. I call this Crude
        Induction. It is\nthe only Induction which concludes a logically Universal\nProposition.
        It is the weakest of arguments, being liable to\nbe demolished in a moment,
        as happened toward the end of\nthe eighteenth century to the opinion of the
        scientific world\nthat no stones fall from the sky. The other kind is Gradual\nInduction,
        which makes a new estimate of the proportion of\n\n"},{"name":13,"value":"THE\n\nREALITY\n\nOF\n\nGOD\n\n103\n\ntruth
        in the hypothesis with every new instance ; and given\nany degree of error
        there will sometime be an estimate (or\nwould be, if the probation were persisted
        in) which will be\nabsolutely the last to be infected with so much falsity.\nGradual
        Induction is either Qualitative or Quantitative, and\nthe latter either depends
        on measurements, or on statistics, or\non countings.\nIV.\nConcerning the
        question of the nature of the logical\nvalidity possessed by Deduction, Induction,
        and Retrod uction,\nwhich is still an arena of controversy, I shall confine
        myself to\nstating the opinions which I am prepared to defend by positive
        proofs. The validity of Deduction was correctly, if not\nvery clearly, analysed
        by Kant. This kind of reasoning deals\nexclusively with Pure Ideas attaching
        primarily to Symbols\nand derivatively to other Signs of our own creation
        ; and the\nfact that man has a power of Explicating his own meaning\nrenders
        Deduction valid. Induction is a kind of reasoning\nthat may lead us into error
        ; but that it follows a method which,\nsufficiently persisted in, will be
        Inductively Certain (the sort\nof certainty we have that a perfect coin, pitched
        up often\nenough, will sometime turn up heads) to diminish the error\nbelow
        any predesignate degree, is assured by man''s power of\nperceiving Inductive
        Certainty. In all this I am inviting the\nreader to peep through the big end
        of the telescope ; there is\na wealth of pertinent detail that must here be
        passed over.\nFinally comes the bottom question of logical Critic, What\nsort
        of validity can be attributed to the First Stage of inquiry ?\nObserve that
        neither Deduction nor Induction contributes the\nsmallest positive item to
        the final conclusion of the inquiry.\nThey render the indefinite definite
        ; Deduction Explicates ;\nInduction evaluates : that is all. Over the chasm
        that yawns\nbetween the ultimate goal of science and such ideas of Man''s\nenvironment
        as, coming over him during his primeval wanderings in the forest, while yet
        his very notion of error was of the\nvaguest, he managed to communicate to
        some fellow, we are\n\n"},{"name":14,"value":"104\n\nTHE\n\nHIBBERT\n\nJOURNAL\n\nbuilding
        a cantilever bridge of induction, held together by\nscientific struts and
        ties. Yet every plank of its advance is\nfirst laid by Retroduction alone,
        that is to say, by the spontaneous conjectures of instinctive reason ; and
        neither Deduction nor Induction contributes a single new concept to the\nstructure.
        Nor is this less true or less important for those\ninquiries that self-interest
        prompts.\nThe first answer we naturally give to this question is that\nwe
        cannot help accepting the conjecture at such a valuation\nas that at which
        we do accept it ; whether as a simple interrogation, or as more or less Plausible,
        or, occasionally, as an\nirresistible belief. But far from constituting, by
        itself, a\nlogical justification such as it becomes a rational being to put\nforth,
        this pleading, that we cannot help yielding to the suggestion, amounts to
        nothing more than a confession of having\nfailed to train ourselves to control
        our thoughts. It is more\nto the purpose, however, to urge that the strength
        of the impulse\nis a symptom of its being instinctive. Animals of all races\nrise
        far above the general level of their intelligence in those\nperformances that
        are their proper function, such as flying and\nnest-building for ordinary
        birds ; and what is man''s proper\nfunction if it be not to embody general
        ideas in art-creations,\nin utilities, and above all in theoretical cognition
        ? To give\nthe lie to his own consciousness of divining the reasons of\nphenomena
        would be as silly in a man as it would be in a\nfledgling bird to refuse to
        trust to its wings and leave the\nnest, because the poor little thing had
        read Babinet, and\njudged aerostation to be impossible on hydrodynamical grounds.\nYes
        ; it must be confessed that if we knew that the impulse to\nprefer one hypothesis
        to another really were analogous to the\ninstincts of birds and wasps, it
        would be foolish not to give it\nplay, within the bounds of reason ; especially
        since we must\nentertain some hypothesis, or else forego all further knowledge\nthan
        that which we have already gained by that very means.\nBut is it a fact that
        man possesses this magical faculty ? Not,\nI reply, to the extent of guessing
        right the first time, nor\n\n"},{"name":15,"value":"THE\n\nREALITY\n\nOF\n\nGOD\n\n105\n\nperhaps
        the second; but that the well-prepared mind has\nwonderfully soon guessed
        each secret of nature, is historical\ntruth. All the theories of science have
        been so obtained. But\nmay they not have come fortuitously, or by some such
        modification ofchance as the Darwinian supposes ? I answer that\nthree or
        four independent methods of computation show that\nit would be ridiculous
        to suppose our science to have so come\nto pass. Nevertheless, suppose that
        it can be so \" explained,\"\njust as that any purposed act of mine is supposed
        by materialistic necessitarians to have come about. Still, what of it ?\nDoes
        that materialistic explanation, supposing it granted, show\nthat reason has
        nothing to do with my actions ? Even the\nparallelists will admit that the
        one explanation leaves the same\nneed of the other that there was before it
        was given ; and this\nis certainly sound logic. There is a reason, an interpretation,\na
        logic, in the course of scientific advance, and this indisputably proves to
        him who has perceptions of rational or\nsignificant relations, that man''s
        mind must have been attuned\nto the truth of things in order to discover what
        he has discovered. Itis the very bed-rock of logical truth.\nModern science
        has been builded after the model of\nGalileo, who founded it on il lume naturale.
        That truly\ninspired prophet had said that, of two hypotheses, the simpler\nis
        to be preferred ; but I was formerly one of those who, in\nour dull self-conceit
        fancying ourselves more sly than he,\ntwisted the maxim to mean the logically
        simpler, the one that\nadds the least to what has been observed, in spite
        of three\nobvious objections: first, that so there was no support for\nany
        hypothesis ; secondly, that by the same token we ought\nto content ourselves
        with simply formulating the special\nobservations actually made ; and thirdly,
        that every advance\nof science that further opens the truth to our view discloses
        a\nworld of unexpected complications. It was not until long\nexperience forced
        me to realise that subsequent discoveries\nwere every time showing I had been
        wrong, while those who\nunderstood the maxim as Galileo had done, early unlocked
        the\n\n"},{"name":16,"value":"106\n\nTHE\n\nHIBBERT\n\nJOURNAL\n\nsecret,
        that the scales fell from my eyes and my mind awoke\nto the broad and flaming
        daylight that it is the simpler\nHypothesis in the sense of the more facile
        and natural,\nthe one that instinct suggests, that must be preferred ; for\nthe
        reason that unless man have a natural bent in accordance\nwith nature''s,
        he has no chance of understanding nature at all.\nMany tests of this principal
        and positive fact, relating as well\nto my own studies as to the researches
        of others, have confirmed me in this opinion ; and when I shall come to set
        them\nforth in a book, their array will convince everybody. Oh no !\nI am
        forgetting that armour, impenetrable by accurate thought,\nin which the rank
        and file of minds are clad ! They may, for\nexample, get the notion that my
        proposition involves a denial\nof the rigidity of the laws of association
        : it would be quite on a\npar with much that is current. I do not mean that
        logical\nsimplicity is a consideration of no value at all, but only that\nits
        value is badly secondary to that of simplicity in the other\nsense.\nIf, however,
        the maxim is correct in Galileo''s sense, whence\nit follows that man has,
        in some degree, a divinitory power,\nprimary or derived, like that of a wasp
        or a bird, then instances\nswarm to show that a certain altogether peculiar
        confidence in\na hypothesis, not to be confounded with rash cocksureness,\nhas
        a very appreciable value as a sign of the truth of the\nhypothesis. I regret
        I cannot give an account of certain\ninteresting and almost convincing cases.
        The N.A. excites\nthis peculiar confidence in the very highest degree.\nV.\nWe
        have now to apply these principles to the evaluation\nof the N.A. Had I space
        I would put this into the shape of\nimagining how it is likely to be esteemed
        by three types of\nmen : the first of small instruction with corresponding
        natural\nbreadth, intimately acquainted with the N.A., but to whom\nlogic
        is all Greek; the second, inflated with current notions\nof logic, but prodigiously
        informed about the N.A. ; the\n\n"},{"name":17,"value":"THE\n\nREALITY\n\nOF\n\nGOD\n\n107\n\nthird,
        a trained man of science who, in the modern spirit,\nhas added to his specialty
        an exact theoretical and practical\nstudy of reasoning and the elements of
        thought, so that\npsychologists account him a sort of psychologist, and mathematicians
        asort of mathematician.\nI should, then, show how the first would have learned
        that\nnothing has any kind of value in itself\u2014 whether esthetic, moral,\nor
        scientific \u2014 but only in its place in the whole production\nto which
        it appertains ; and that an individual soul with\nits petty agitations and
        calamities is a zero except as filling\nits infinitesimal place, and accepting
        his little futility as his\nentire treasure. He will see that though his God
        would\nnot really (in a certain sense) adapt means to ends, it is\nnevertheless
        quite true that there are relations among phenomena which finite intelligence
        must interpret, and truly\ninterpret, as such adaptations ; and he will macarise
        himself\nfor his own bitterest griefs, and bless God for the law of growth\nwith
        all the fighting it imposes upon him \u2014 Evil, i.e. what it is\nman''s
        duty to fight, being one of the major perfections of\nthe Universe. In that
        fight he will endeavour to perform just\nthe duty laid upon him and no more.
        Though his desperate\nstruggles should issue in the horrors of his rout, and
        he should\nsee the innocents who are dearest to his heart exposed to\ntorments,
        frenzy and despair, destined to be smirched with\nfilth, and stunted in their
        intelligence, still he may hope that\nit be best for them, and will tell himself
        that in any case the\nsecret design of God will be perfected through their
        agency; and\neven while still hot from the battle, will submit with adoration\nto
        His Holy will. He will not worry because the Universes\nwere not constructed
        to suit the scheme of some silly scold.\nThe context of this I must leave
        the reader to imagine.\nI will only add that the third man, considering the
        complex\nprocess of self-control, will see that the hypothesis, irresistible\nthough
        it be to first intention, yet needs Probation; and\nthat though an infinite
        being is not tied down to any consistency, yet man, like any other animal,
        is gifted with power of\n\n"},{"name":18,"value":"108\n\nTHE\n\nHIBBERT\n\nJOURNAL\n\nunderstanding
        sufficient for the conduct of life. This brings\nhim, for testing the hypothesis,
        to taking his stand upon\nPragmaticism, which implies faith in common sense
        and in\ninstinct, though only as they issue from the cupel-furnace of\nmeasured
        criticism. In short, he will say that the N.A. is the\nFirst Stage of a scientific
        inquiry, resulting in a hypothesis of\nthe very highest Plausibility, whose
        ultimate test must lie in\nits value in the self-controlled growth of man''s
        conduct of life.\nSince I have employed the word Pragmaticism, and\nshall
        have occasion to use it once more, it may perhaps be\nwell to explain it.
        About forty years ago, my studies of\nBerkeley, Kant, and others led me, after
        convincing myself\nthat all thinking is performed in Signs, and that meditation\ntakes
        the form of a dialogue, so that it is proper to speak of\nthe \" meaning \"
        of a concept, to conclude that to acquire full\nmastery of that meaning it
        is requisite, in the first place, to\nlearn to recognise the concept under
        every disguise, through\nextensive familiarity with instances of it. But this,
        after all,\ndoes not imply any true understanding of it ; so that it is\nfurther
        requisite that we should make an abstract logical\nanalysis of it into its
        ultimate elements, or as complete an\nanalysis as we can compass. But, even
        so, we may still be\nwithout any living comprehension of it ; and the only
        way to\ncomplete our knowledge of its nature is to discover and recognise
        just what general habits of conduct a belief in the truth\nof the concept
        (of any conceivable subject, and under any conceivable circumstances) would
        reasonably develop ; that is to\nsay, what habits would ultimately result
        from a sufficient consideration of such truth. It is necessary to understand
        the\nword \" conduct,\" here, in the broadest sense. If, for example,\nthe
        predication of a given concept were to lead to our admitting that a given
        form of reasoning concerning the subject of\nwhich it was affirmed was valid,
        when it would not otherwise\nbe valid, the recognition of that effect in our
        reasoning would\ndecidedly be a habit of conduct.\n\n"},{"name":19,"value":"THE\n\nREALITY\n\nOF\n\nGOD\n\n109\n\nIn
        1871, in a Metaphysical Club in Cambridge, Mass., I\nused to preach this principle
        as a sort of logical gospel, representing the unformulated method followed
        by Berkeley, and\nin conversation about it I called it \"Pragmatism.\" In\nDecember
        1877 and January 1878 I set forth the doctrine\nin the Popular Science Monthly,
        and the two parts of my\nessay were printed in French in the Revue Philosopkique,\nvolumes
        vi. and vii. Of course, the doctrine attracted no particular attention, for,
        as I had remarked in my opening sentence,\nvery few people care for logic.
        But in 1897 Professor James\nremodelled the matter, and transmogrified it
        into a doctrine\nof philosophy, some parts of which I highly approved, while\nother
        and more prominent parts I regarded, and still regard, as\nopposed to sound
        logic. About the time Professor Papirie\ndiscovered, to the delight of the
        Pragmatist school, that this\ndoctrine was incapable of definition, which
        would certainly\nseem to distinguish it from every other doctrine in whatever\nbranch
        of science, I was coming to the conclusion that my\npoor little maxim should
        be called by another name ; and\naccordingly, in April 1905, 1 renamed it
        Pragmaticism. I had\nnever before dignified it by any name in print, except
        that, at\nProfessor Baldwin''s request, I wrote a definition of it for his\nDictionary
        of Psychology and Philosophy. I did not insert the\nword in the Century Dictionary,
        though I had charge of the\nphilosophical definitions of that work ; for I
        have a perhaps\nexaggerated dislike of reclame.\nIt is that course of meditation
        upon the three Universes\nwhich gives birth to the hypothesis and ultimately
        to the\nbelief that they, or at any rate two of the three, have a\nCreator
        independent of them, that I have throughout this\narticle called the N.A.,
        because I think the theologians ought\nto have recognised it as a line of
        thought reasonably productive\nof belief. This is the \" humble \" argument,
        the innermost of\nthe nest. In the mind of a metaphysician it will have a\nmetaphysical
        tinge ; but that seems to me rather to detract\nfrom its force than to add
        anything to it. It is just as good\n\n"},{"name":20,"value":"110\n\nTHE\n\nHIBBERT\n\nJOURNAL\n\nan
        argument, if not better, in the form it takes in the mind of\nthe clodhopper.\nThe
        theologians could not have presented the N.A. ; because\nthat is a living
        course of thought of very various forms. But\nthey might and ought to have
        described it, and should have defended it,too, as far as they could, without
        going into original\nlogical researches, which could not be justly expected
        of them.\nThey are accustomed to make use of the principle that that which\nconvinces
        a normal man must be presumed to be sound reasoning; and therefore they ought
        to say whatever can truly be\nadvanced to show that the N.A., if sufficiently
        developed, will\nconvince any normal man. Unfortunately, it happens that\nthere
        is very little established fact to show that this is the\ncase. I have not
        pretended to have any other ground for my\nbelief that it is so than my assumption,
        which each one of us\nmakes, that my own intellectual disposition is normal.
        I am\nforced to confess that no pessimist will agree with me.\nI do not admit
        that pessimists are, at the same time,\nthoroughly sane, and in addition are
        endowed in normal\nmeasure with intellectual vigour ; and my reasons for thinking\nso
        are two. The first is, that the difference between a pessimistic and an optimistic
        mind is of such controlling importance\nin regard to every intellectual function,
        and especially for the\nconduct of life, that it is out of the question to
        admit that both\nare normal, and the great majority of mankind are naturally\noptimistic.
        Now, the majority of every race depart but little\nfrom the norm of that race.
        In order to present my other\nreason, I am obliged to recognise three types
        of pessimists.\nThe first type is often found in exquisite and noble natures
        of\ngreat force of original intellect whose own lives are dreadful histories
        of torment due to some physical malady.\nLeopardi is a famous example. We
        cannot but believe,\nagainst their earnest protests, that if such men had
        had\nordinary health, life would have worn for them the same\ncolour as for
        the rest of us. Meantime, one meets too few\npessimists of this type to affect
        the present question.\n\n"},{"name":21,"value":"THE\n\nREALITY\n\nOF\n\nGOD\n\n111\n\nThe
        second is the misanthropical type, the type that makes\nitself heard. It suffices
        to call to mind the conduct of the\nfamous pessimists of this kind, Diogenes
        the Cynic, Schopenhauer, Carlyle, and their kin with Shakespeare''s Timon
        Of\nAthens, to recognise them as diseased minds. The third is\nthe philanthropical
        type, people whose lively sympathies, easily\nexcited, become roused to anger
        at what they consider the\nstupid injustices of life. Being easily interested
        in everything,\nwithout being overloaded with exact thought of any kind, they\nare
        excellent raw material for litterateurs: witness Voltaire.\nNo individual
        remotely approaching the calibre of a Leibniz is\nto be found among them.\nThe
        third argument, enclosing and defending the other\ntwo, consists in the development
        of those principles of logic\naccording to which the humble argument is the
        first stage of\na scientific inquiry into the origin of the three Universes,
        but\nof an inquiry which produces, not merely scientific belief,\nwhich is
        always provisional, but also a living, practical belief,\nlogically justified
        in crossing the Rubicon with all the freightage of eternity. The presentation
        of this argument would\nrequire the establishment of several principles of
        logic that\nthe logicians have hardly dreamed of, and particularly a strict\nproof
        of the correctness of the maxim of Pragmaticism. My\noriginal essay, having
        been written for a popular monthly,\nassumes, for no better reason than that
        real inquiry cannot\nbegin until a state of real doubt arises and ends as
        soon as\nBelief is attained, that \" a settlement of Belief,\" or, in other\nwords,
        a state of satisfaction, is all that Truth, or the aim of\ninquiry, consists
        in. The reason I gave for this was so flimsy,\nwhile the inference was so
        nearly the gist of Pragmaticism,\nthat I must confess the argument of that
        essay might with\nsome justice be said to beg the question. The first part
        of\nthe essay, however, is occupied with showing that, if Truth\nconsists
        in satisfaction, it cannot be any actual satisfaction,\nbut must be the satisfaction
        which would ultimately be found\nif the inquiry were pushed to its ultimate
        and indefeasible\n\n"},{"name":22,"value":"112\n\nTHE\n\nHIBBERT\n\nJOURNAL\n\nissue.
        This, I beg to point out, is a very different position\nfrom that of Mr Schiller
        and the pragmatists of to-day.\nI trust I shall be believed when I say that
        it is only a\ndesire to avoid being misunderstood in consequence of my\nrelations
        with pragmatism, and by no means as arrogating any\nsuperior immunity from
        error which I have too good reason\nto know that I do not enjoy, that leads
        me to express my\npersonal sentiments about their tenets. Their avowedly undefmable
        position, if it be not capable of logical characterisation,\nseems to me to
        be characterised by an angry hatred of strict\nlogic, and even some disposition
        to rate any exact thought\nwhich interferes with their doctrines as all humbug.
        At the\nsame time, it seems to me clear that their approximate acceptance
        of the Pragmaticist principle, and even that very casting\naside of difficult
        distinctions (although I cannot approve of it),\nhas helped them to a mightily
        clear discernment of some\nfundamental truths that other philosophers have
        seen but\nthrough a mist, and most of them not at all. Among such\ntruths
        \u2014 all of them old, of course, yet acknowledged by\nfew \u2014 I reckon
        their denial of necessitarianism ; their rejection\nof any \"consciousness\"
        different from a visceral or other\nexternal sensation ; their acknowledgment
        that there are,\nin a Pragmatistical sense, Real habits (which Really would\nproduce
        effects, under circumstances that may not happen to\nget actualised, and are
        thus Real generals) ; and their insistence upon interpreting all hypostatic
        abstractions in terms\nof what they would or might (not actually will) come
        to in\nthe concrete. It seems to me a pity they should allow a\nphilosophy
        so instinct with life to become infected with seeds\nof death in such notions
        as that of the unreality of all ideas of\ninfinity and that of the mutability
        of truth, and in such confusions of thought as that of active willing (willing
        to control\nthought, to doubt, and to weigh reasons) with willing not to\nexert
        the will (willing to believe).\nC. S. PEIRCE.\nWESTFALL, PENNSYLVANIA.\n\n"},{"name":23,"value":""}]}],"mime":"application/pdf","mediatype":"OFFICE","bitdepth":0}]}},"userinfo":{"id":0,"name":"192.168.10.10","anon":""}}}'
