        instances\nwhere conjecture mounts the high peaks of Plausibility \u2014 and\nis
        ''''really'''' most worthy of confidence\u2014the inquirer is unable\ndefinitely
        to formulate just what the explained wonder is; or\ncan only do so in the
        light of the hypothesis. In short, it is\na form of Argument rather than of
        Argumentation.\n\nRetroduction does not afford security. The hypothesis must
        be tested.\n\nThis testing, to be logically valid, must honestly start,\nnot
        as Retroduction starts, with scrutiny of the phenomena,\nbut with examination
        of the hypothesis, and a muster of all\nsorts of conditional experiential
        consequences which would\nfollow from its truth. This constitutes the Second
        Stage of\nInquiry. For its characteristic form of reasoning our language\nhas,
        for two centuries, been happily provided with the name\nDeduction.\n\nDeduction
        has two parts. For its first step must be by\nlogical analysis to Explicate
        the hypothesis, ''''i.e.'''' to render it\nas perfectly distinct as possible.
        This process, like Retroduction, is Argument that is not Argumentation.\nBut
        unlike\nRetroduction, it cannot go wrong from lack of experience, but\nso
        long as it proceeds rightly must reach a true conclusion.\nExplication is
        followed by Demonstration, or Deductive\nArgumentation.\nIts procedure is
        best learned from Book I.\nof Euclid''s ''''Elements'''', a masterpiece which
        in real insight is far\nsuperior to Aristotle''s ''''Analytics''''; and its
        numerous fallacies\nrender it all the more instructive to a close student.\nIt
        invariably requires something of the nature of a diagram; that is, an\n\"Icon,\"
