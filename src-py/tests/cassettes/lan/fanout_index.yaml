        a conjecture arises that\nfurnishes a possible Explanation, by which I mean
        a syllogism\nexhibiting the surprising fact as necessarily consequent upon\nthe
        circumstances of its occurrence together with the truth of\nthe credible conjecture,
        as premisses.\nOn account of this\nExplanation, the inquirer is led to regard
        his conjecture, or\nhypothesis, with favour.\nAs I phrase it, he provisionally
        holds\nit to be \"Plausible\"; this acceptance ranges in different\ncases\u2014and
        reasonably so\u2014from a mere expression of it in the\ninterrogative mood,
        as a question meriting attention and reply,\nup through all appraisals of
        Plausibility, to uncontrollable\ninclination to believe.\nThe whole series
