        level=\"3\" user=\"JoanSevier\" /></noinclude>heard from all mouths? No bygone
        fashion seems more\ngrotesque than a ''''panache'''' of obsolete wisdom. I
        remember\nthe days when a pronouncement all the rage was that no\nscience
        must borrow the methods of another; the geologist\nmust not use a microscope,
        nor the astronomer a spectroscope. Optics must not meddle with electricity,
        nor logic\nwith algebra. But twenty years later, if you aspired to pass\nfor
        a commanding intellect, you would have to pull a long\nface and declare that
        \"It is not the business of science to\nsearch for origins.\" This maxim was
        a masterpiece, since\nno timid soul, in dread of being thought na\u00efve,
        would dare\ninquire what \"origins\" were, albeit the secret confessor within\nhis
        breast compelled the awful self-acknowledgment of his\nhaving no idea into
        what else than \"origins\" of phenomena\n(in some sense of that indefinite
        word) man can inquire.\nThat human reason can comprehend some causes is past\ndenial,
        and once we are forced to recognise a given element\nin experience, it is
        reasonable to await positive evidence before\nwe complicate our acknowledgment
        with qualifications.\nOtherwise, why venture beyond direct observation? Illustrations
        of this principle abound in physical science. Since,\nthen, it is certain
        that man is able to understand the laws\nand the causes of some phenomena,
        it is reasonable to assume,\nin regard to any given problem, that it would
        get rightly\nsolved by man, if a sufficiency of time and attention were\ndevoted
        to it. Moreover, those problems that at first blush\nappear utterly insoluble
        receive, in that very circumstance, as\nEdgar Poe remarked in his ''''The
        Murders in the Rue Morgue'''',\ntheir smoothly-fitting keys. This particularly
        adapts them to\nthe Play of Musement.\n\nForty or fifty minutes of vigorous
        and unslackened analytic\nthought bestowed upon one of them usually suffices
        to educe\nfrom it all there is to educe, its general solution. There is\nno
        kind of reasoning that I should wish to discourage in\nMusement; and I should
        lament to find anybody confining\nit to a method of such moderate fertility
        as logical analysis.<noinclude></noinclude>"}},"comment":"1 revision imported","parsedcomment":"1
