        \n\nwir uns eine weisse Flache, auf der unregelmassige \nschwarze Flecken
        waren. Wir sagen nun : Was fur \nein Bild immer hierdurch entsteht, immer
        kann ich \nseiner Beschreibung beliebig nahe kommen, indem \nich die Flache
        mit einem entsprechend feinen qua- \ndratischen Netzwerk bedecke und nun von
        jedem \nQuadrat sage, dass es weiss oder schwarz ist. Ich \nwerde auf diese
        Weise die Beschreibung der Flache \nauf eine einheitliche Form gebracht haben.
        Diese \nForm ist beliebig, denn ich hatte mit dem gleichen \nErfolge ein Netz
        aus dreieckigen oder sechseckigen \nMaschen verwenden konnen. Es kann sein,
        dass \ndie Beschreibung mit Hilfe eines Dreiecks-Netzes \neinfacher geworden
        ware ; das heisst, dass wir die \nFlache mit einem groberen Dreiecks-Netz
        genauer \nbeschreiben konnten, als mit einem feineren qua- \ndratischen (oder
        umgekehrt) usw. Den verschiede- \nnen Netzen entsprechen verschiedene Systeme
        der \nWeltbeschreibung. Die Mechanik bestimmt eine \nForm der Weltbeschreibung,
        indem sie sagt : \nAlle Satze der Weltbeschreibung miissen aus einer \nAnzahl
        gegebener Satze \u2014 den mechanischen Axio- \nmen \u2014 auf eine gegebene
        Art und Weise erhalten \nwerden. Hierdurch liefert sie die Bausteine zum \nBau
        des wissenschaftlichen Gebaudes und sagt : \nWelches Gebaude immer du auffiihren
        willst, jedes \nmusst du irgendwie mit diesen und nur diesen \nBausteinen
        zusammenbringen. \n\n(Wie man mit dem Zahlensystem jede beliebige \nAnzahl,
        so muss man mit dem System der \nMechanik jeden beliebigen Satz der Physik
        \nhinschreiben konnen.) \n6.342 Und nun sehen wir die gegenseitige Stellung
        \n\nvon Logik und Mechanik. (Man konnte das Netz \nauch aus verschiedenartigen
        Figuren etwa aus \nDreiecken und Sechsecken bestehen lassen.) Dass \nsich
        ein Bild, wie das vorhin erwahnte, durch ein \nNetz von gegebener Form beschreiben
        lasst, sagt \n\n"},{"name":178,"value":"TRACTATUS LOGICO-PHILOSOPHICUS \n\nLet
        us imagine a white surface with irregular \nblack spots. We now say : Whatever
        kind of \npicture these make I can always get as near as \nI like to its description,
        if I cover the surface \nwith a sufficiently fine square network and now \nsay
        of every square that it is white or black. \nIn this way I shall have brought
        the description \nof the surface to a unified form. This form is \narbitrary,
        because I could have applied with equal \nsuccess a net with a triangular
        or hexagonal \nmesh. It can happen that the description would \nhave been
        simpler with the aid of a triangular \nmesh ; that is to say we might have
        described \nthe surface more accurately with a triangular, \nand coarser,
        than with the finer square mesh, or \nvice versa, and so on. To the different
        networks \ncorrespond different systems of describing the \nworld. Mechanics
        determine a form of descrip- \ntion by saying : All propositions in the descrip-
        \ntion of the world must be obtained in a given \nway from a number of given
        propositions \u2014 the \nmechanical axioms. It thus provides the bricks \nfor
        building the edifice of science, and says : \nWhatever building thou wouldst
        erect, thou shalt \nconstruct it in some manner with these bricks \nand these
        alone. \n\n(As with the system of numbers one must be \nable to write down
        any arbitrary number, so \nwith the system of mechanics one must be able \nto
        write down any arbitrary physical proposition.) \n\n6.342 And now we see the
        relative position of logic \n\nand mechanics. (We could construct the net-
        \nwork out of figures of different kinds, as out of \ntriangles and hexagons
        together.) That a picture \nlike that instanced above can be described by
        a \nnetwork of a given form asserts nothing about \n\n175 \n\n"},{"name":179,"value":"LOGISCH-PHILOSOPHISCHE
        ABHANDLUNG \n\nliber das Bild nichts aus. (Denn dies gilt fur \njedes Bild
        dieser Art.) Das aber charakterisiert \ndas Bild, dass es sich durch ein bestimmtes
        Netz \nvon bestim mter Feinheit vollstandig be- \nschreiben lasst. \n\nSo
        auch sagt es nichts iiber die Welt aus, dass \nsie sich durch die Newtonsche
        Mechanik be- \nschreiben lasst; wohl aber, dass sie sich so durch \njene beschreiben
        lasst, wie dies eben der Fall ist. \nAuch das sagt etwas iiber die Welt, dass
        sie sich \ndurch die eine Mechanik einfacher beschreiben \nlasst, als durch
        die andere. \n6.343 Die Mechanik ist ein Versuch, alle wahren \n\nSatze, die
        wir zur Weltbeschreibung brauchen, \nnach Einem Plane zu konstruieren. \n\n6.3431
        Durch den ganzen logischen Apparat hindurch \nsprechen die physikalischen
        Gesetze doch von den \nGegenstanden der Welt. \n\n6.3432 Wir diirfen nicht
        vergessen, dass die Weltbe- \nschreibung durch die Mechanik immer die ganz
        \nallgemeine ist. Es ist in ihr z. B. nie von \nbestimmten materiellen Punkten
        die Rede, \nsondern immer nur von irgend welchen. \n\n6.35 Obwohl die Flecke
        in unserem Bild geome- \ntrische Figuren sind, so kann doch selbstver- \nstandlich
        die Geometrie gar nichts iiber ihre \ntatsachliche Form und Lage sagen. Das
        Netz \naber ist r e i n geometrisch, alle seine Eigenschaften \nkonnen a priori
        angegeben werden. \n\nGesetze, wie der Satz vom Grunde, etc., handeln \nvom
        Netz, nicht von dem, was das Netz beschreibt. \n\n6.36 Wenn es ein Kausalitatsgesetz
        gabe, so konnte \nes lauten : \u201eEs gibt Naturgesetze\". \n\nAber freilich
        kann man das nicht sagen : es \nzeigt sich. \n6.361 In der Ausdrucksweise
        Hertz''s konnte man \n\nsagen: Nur gesetzmassige ZusammenhangQ \nsind de n
        kbar. \n\n176 \n\n"},{"name":180,"value":"TRACTATUS LOGICO-PHILOSOPHICUS \n\nthe
        picture. (For this holds of every picture of \nthis kind.) But this does characterize
        the picture, \nthe fact, namely, that it can be completely de- \nscribed by
        a definite net of definite fineness. \n\nSo too the fact that it can be described
        by \nNewtonian mechanics asserts nothing about the \nworld ; but this asserts
        something, namely, that \nit can be described in that particular way in which
        \nas a matter of fact it is described. The fact, \ntoo, that it can be described
        more simply by one \nsystem of mechanics than by another says some- \nthing
        about the world. \n6.343 Mechanics is an attempt to construct according \n\nto
        a single plan all true propositions which we \nneed for the description of
        the world. \n\n6.3431 Through their whole logical apparatus the \nphysical
        laws still speak of the objects of the \nworld. \n\n6.3432 We must not forget
        that the description of the \nworld by mechanics is always quite general.
        \nThere is, for example, never any mention of \nparticular material points
        in it, but always only \nof some points or other. \n\n6.35 Although the spots
        in our picture are geometri- \ncal figures, geometry can obviously say nothing
        \nabout their actual form and position. But the \nnetwork is purely geometrical,
        and all its pro- \nperties can be given a priori. \n\nLaws, like the law of
        causation, etc., treat \nof the network and not of what the network \ndescribes.
        \n\n6.36 If there were a law of causality, it might run : \n** There are natural
        laws \". \n\nBut that can clearly not be said : it shows \nitself. \n6.361
        In the terminology of Hertz we might say : \n\nOnly uniform connexions are
        thinkable, \n\n177 M \n\n"},{"name":181,"value":"LOGISCH-PHILOSOPHISCHE ABHANDLUNG
        \n\n6.3611 Wir konnen keinen Vorgang mit dem \u201eAblauf \nder Zeit\" vergleichen
        \u2014 diesen gibt es nicht \u2014 , \nsondern nur mit einem anderen Vorgang
        (etwa \nmit dem Gang des Chronometers). \n\nDaher ist die Beschreibung des
        zeitlichen \nVerlaufs nur so moglich, dass wir uns auf einen \nanderen Vorgang
        stiitzen. \n\nGanz Analoges gilt fiir den Raum. Wo man \nz. B. sagt, es konne
        keines von zwei Ereignissen \n(die sich gegenseitig ausschliessen) eintreten,
        weil \nkeine Ursache vorhanden sei, warum das eine \neher als das andere eintreten
        solle, da handelt es \nsich in Wirklichkeit darum, dass man gar nicht \neines
        der beiden Ereignisse beschreiben kann, \nwenn nicht irgend eine Asymmetrie
        vorhanden ist. \nUnd wenn eine solche Asymmetrie vorhanden i s t, \nso konnen
        wir diese als Ursache des Eintreffens \ndes einen und Nicht-Eintreffens des
        anderen \nauffassen. \n6.36111 Das Kant''sche Problem von der rechten und
        \nlinken Hand, die man nicht zur Deckung bringen \nkann, besteht schon in
        der Ebene, ja im eindi- \nmensionalen Raum, wo die beiden kongruentea \nFiguren
        a und b auch nicht zur Deckung gebracht \nwerden konnen, ohne aus diesem Raum
        \n\n- - - o X- -X o - - - - \n\na b \n\nherausbewegt zu werden. Rechte und
        linke Hand \nsind tatsachlich vollkommen kongruent. Und \ndass man sie nicht
        zur Deckung bringen kann, \nhat damit nichts zu tun. \n\nDen rechten Handschuh
        konnte man an die \nlinke Hand ziehen, wenn man ihn im vier- \ndimensionalen
        Raum umdrehen konnte. \n\n6.362 Was sich beschreiben lasst, das kann auch
        \ngeschehen, und was das Kausalitatsgesetz aus- \nschliessen soil, das lasst
        sich auch nicht beschreiben. \n\n6.363 Der Vorgang der Induktion besteht darin,
        dass \n\n178 \n\n"},{"name":182,"value":"TRACTATUS LOGICO-PHILOSOPHICUS \n\n6.3611
        We cannot compare any process with the \n** passage of time\" \u2014 there
        is no such thing \u2014 but \nonly with another process (say, with the move-
        \nment of the chronometer). \n\nHence the description of the temporal sequence
        \nof events is only possible if we support ourselves \non another process.
        \n\nIt is exactly analogous for space. When, for \nexample, we say that neither
        of two events (which \nmutually exclude one another) can occur, because \nthere
        is no cause why the one should occur rather \nthan the other, it is really
        a matter of our being \nunable to describe one of the two events unless \nthere
        is some sort of asymmetry. And if there is \nsuch an asymmetry, we can regard
        this as the \ncause of the occurrence of the one and of the non- \noccurrence
        of the other. \n\n6.36111 The Kantian problem of the right and left hand \nwhich
        cannot be made to cover one another already \nexists in the plane, and even
        in one-dimensional \nspace ; where the two congruent figures a and b \ncannot
        be made to cover one another without \n\n. - - o X- \u2022X\u2014 \u2014 o
        - - - - \n\na b \n\nmoving them out of this space. The right and \nleft hand
        are in fact completely congruent. And \nthe fact that they cannot be made
        to cover one \nanother has nothing to do with it. \n\nA right-hand glove could
        be put on a left hand \nif it could be turned round in four-dimensional \nspace.
        \n\n6.362 What can be described can happen too, and \nwhat is excluded by
        the law of causality cannot be \ndescribed. \n\n6.363 The process of induction
        is the process of \n\n179 \n\n"},{"name":183,"value":"LOGISCH-PHILOSOPHISCHE
        ABHANDLUNG \n\nwir das einfachste Gesetz annehmen, das mit \n\nunseren Erfahrungen
        in Einklang zu bringen ist. \n6.3631 Dieser Vorgang hat aber keine logische,
        sondern \n\nnur eine psychologische Begriindung. \n\nEs ist klar, dass kein
        Grund vorhanden ist, zu \n\nglauben, es werde nun auch wirklich der einfachste
        \n\nFall eintreten. \n6.36311 Dass die Sonne morgen aufgehen wird, ist eine
        \n\nHypothese ; und das heisst : wir w i s s e n nicht, ob \n\nsie aufgehen
        wird. \n6.37 Einen Zwang, nach dem Eines geschehen miisste, \n\nweil etwas
        anderes geschehen ist, gibt es nicht. Es \n\ngibt nur eine logische Notwendigkeit.
        \n\n6.371 Der ganzen modernen Weltanschauung liegt die \nTauschung zugrunde,
        dass die sogenannten Natur- \ngesetze die Erklarungen der Naturerscheinungen
        \nseien. \n\n6.372 So bleiben sie bei den Naturgesetzen als bei \netwas Unantastbarem
        stehen, wie die alteren bei \nGott und dem Schicksal. \n\nUnd sie haben ja
        beide Recht, und Unrecht. Die \nAlten sind allerdings insofern klarer, als
        sie einen \nklaren Abschluss anerkennen, wahrend es bei dem \nneuen System
        scheinen soil, als sei alles erklart. \n\n6.373 Die Welt ist unabhangig von
        meinem Willen. \n\n6.374 Auch wenn alles, was wir wiinschen, geschahe, \nso
        ware dies doch nur, sozusagen, eine Gnade des \nSchicksals, denn es ist kein
        logischer Zusam- \nmenhang zwischen Willen und Welt, der dies \nverbiirgte,
        und den angenommenen physikalischen \nZusammenhang konnten wir doch nicht
        selbst \nwieder wollen. \n\n^\u2022375 Wie es nur eine logische Notwendigkeit
        gibt, \n\nso gibt es auch nur eine logische Unmoglichkeit. \n\n6.3751 Dass
        z. B. zwei Farben zugleich an einem Ort \ndes Gesichtsfeldes sind, ist unm6glich
        und zwar \nlogisch unm6glich, denn es ist durch die logische \nStruktur der
        Farbe ausgeschlossen. \n\n180 \n\n"},{"name":184,"value":"TRACTATUS LOGICO-PHILOSOPHICUS
        \n\nassuming the simplest law that can be made to \nharmonize with our experience.
        \n\n6.3631 This process, however, has no logical founda- \ntion but only a
        psychological one. \n\nIt is clear that there are no grounds for believ- \ning
        that the simplest course of events will really \nhappen. \n\n6.36311 That
        the sun will rise to-morrow, is an hypothe- \nsis ; and that means that we
        do not know whether \nit will rise. \n\n6.37 A necessity for one thing to
        happen because \n\nanother has happened does not exist. There is \nonly logical
        necessity. \n\n6.371 At the basis of the whole modern view of \nthe world
        lies the illusion that the so-called \nlaws of nature are the explanations
        of natural \nphenomena. \n\n6.372 So people stop short at natural laws as
        at some- \nthing unassailable, as did the ancients at God \nand Fate. \n\nAnd
        they both are right and wrong. But the \nancients were clearer, in so far
        as they recognized \none clear terminus, whereas the modern system \nmakes
        it appear as though everything were explained. \n\n6-373 The world is independent
        of my will. \n\n6.374 Even if everything we wished were to happen, \nthis
        would only be, so to speak, a favour of \nfate, for there is no logical connexion
        between will \nand world, which would guarantee this, and the \nassumed physical
        connexion itself we could not \nagain will. \n\n6.375 As there is only a logical
        necessity, so there is \nonly a logical impossibility. \n\n6.3751 For two
        colours, e.g, to be at one place in the \nvisual field, is impossible, log^ically
        impossible, \nfor it is excluded by the logical structure of \ncolour. \n\n181
        \n\n"},{"name":185,"value":"LOGISCH-PHILOSOPHISCHE ABHANDLUNG \n\nDenken wir
        daraii) wie sich dieser Widerspruch \nin der Physik darstellt: Ungefahr so,
        dass ein \nTeilchen nicht zu gleicher Zeit zwei Geschwindig- \nkeiten haben
        kann ; das heisst, dass es nicht zu \ngleicher Zeit an zwei Orten sein kann
        ; das heisst, \ndass Teilchen an verschiedenen Orten zu Einer Zeit \nnicht
        identisch sein konnen. \n\n(Es ist klar, dass das logische Produkt zweier
        \nElementarsatze weder eine Tautologie noch eine \nKontradiktion sein kann.
        Die Aussage, dass ein \nPunkt des Gesichtsfeldes zu gleicher Zeit zwei \nverschiedene
        Farben hat, ist eine Kontradiktion.) \n6.4 Alle Satze sind gleichwertig. \n\n6.41
        Der Sinn der Welt muss ausserhalb ihrer liegen. \nIn der Welt ist alles wie
        es ist und geschieht alles \nwie es geschieht ; es gibt i n ihr keinen Wert
        \u2014 und \nwenn es ihn gabe, so hatte er keinen Wert. \n\nWenn es einen
        Wert gibt, der Wert hat, so muss \ner ausserhalb alles Geschehens und So-Seins
        liegen. \nDenn alles Geschehen und So-Sein ist zufallig. \n\nWas es nicht-zufallig
        macht, kann nicht i n der \nWelt liegen, denn sonst ware dies wieder zufallig.
        \n\nEs muss ausserhalb der Welt liegen. \n\n6.42 Darum kann es auch keine
        Satze der Ethik geben. \nSatze konnen nichts Hoheres ausdriicken. \n\n6.421
        Es ist klar, dass sich die Ethik nicht aussprechen \nlasst. \n\nDie Ethik
        ist transscendental. \n(Ethik und Aesthetik sind Eins.) \n\n6.422 Der erste
        Gedanke bei der Aufstellung eines \nethischen Gesetzes von der Form \u201edu
        sollst . . . .\" \nist: Und was dann, wenn ich es nicht tue? Es ist \naber
        klar, dass die Ethik nichts mit Strafe und \nLohn im gewohnlichen Sinne zu
        tun hat. Also \nmuss diese Frage nach den Folgen einer Hand- \nlung belanglos
        sein. \u2014 Zum Mindesten diirfen diese \nFolgen nicht Ereignisse sein. Denn
        etwas muss \ndoch an jener Fragestellung richtig sein. Es muss \n\n182 \n\n"},{"name":186,"value":"TRACTATUS
        LOGICO-PHILOSOPHICUS \n\nLet us consider how this contradiction presents \nitself
        in physics. Somewhat as follows : That a \nparticle cannot at the same time
        have two velo- \ncities, i,e, that at the same time it cannot be in \ntwo
        places, i,e, that particles in different places \nat the same time cannot
        be identical. \n\n(It is clear that the logical product of two \nelementary
        propositions can neither be a tautology \nnor a contradiction. The assertion
        that a point \nin the visual field has two different colours at the \nsame
        time, is a contradiction.) \n\n6.4 All propositions are of equal value. \n\n6.41
        The sense of the world must lie outside the \nworld. In the world everything
        is as it is and \nhappens as it does happen. In it there is no value \n\u2014
        and if there were, it would be of no value. \n\nIf there is a value which
        is of value, it must \nlie outside all happening and being-so. For all \nhappening
        and being-so is accidental. \n\nWhat makes it non-accidental cannot lie in
        \nthe world, for otherwise this would again be acci- \ndental. \n\nIt must
        lie outside the world. \n\n6.42 Hence also there can be no ethical propositions.
        \nPropositions cannot express anything higher. \n\n6.421 It is clear that
        ethics cannot be expressed. \nEthics is transcendental. \n\n(Ethics and aesthetics
        are one.) \n\n6.422 The first thought in setting up an ethical law \nof the
        form **thou shalt . . .''* is: And what \nif I do not do it ? But it is clear
        that ethics has \nnothing to do with punishment and reward in the \nordinary
        sense. This question as to the conse- \nquences of an action must therefore
        be irrelevant. \nAt least these consequences will not be events. \nFor there
        must be something right in that formu- \nlation of the question. There must
        be some sort \n\n183 \n\n"},{"name":187,"value":"LOGISCH PHILOSOPHISCHE ABHANDLUNG
        \n\nzwar eine Art von ethischem Lohn und ethischer \nStrafe geben, aber diese
        miissen in der Handlung \nselbst liegen. \n\n(Und das ist auch klar\u00bb
        dass der Lohn etwas \nAngenehmes, die Strafe etwas Unangenehmes sein \nmuss.)
        \n6.423 Vom Willen als dem Trager des Ethischen kann \n\nnicht gesprochen
        werden. \n\nUnd der Wille als Phanomen interessiert nur \ndie Psychologie.
        \n6.43 Wenn das gute oder bose Wollen die Welt \n\nandert, so kann es nur
        die Grenzen der Welt andern, \nnicht die Tatsachen ; nicht das, was durch
        die \nSprache ausgedriickt werden kann. \n\nKurz, die Welt muss dann dadurch
        iiberhaupt \neine andere werden. Sie muss sozusagen als \nGanzes abnehmen
        oder zunehmen. \n\nDie Welt des Gliicklichen ist eine andere als die \ndes
        Ungliicklichen. \n6.431 Wie auch beim Tod die Welt sich nicht andert, \n\nsondern
        aufhort. \n\n6.4311 Der Tod ist kein Ereignis des Lebens. Den \nTod erlebt
        man nicht. \n\nWenn man unter Ewigkeit nicht unendliche \nZeitdauer, sondern
        Unzeitlichkeit versteht, dann \nlebt der ewig, der in der Gegenwart lebt.
        \n\nUnser Leben ist ebenso endlos, wie unser \nGesichtsfeld grenzenlos ist.
        \n\n6.4312 Die zeitliche Unsterblichkeit der Seele des \nMenschen, das heisst
        also ihr ewiges Fortleben \n^uch nach dem Tode, ist nicht nur auf keine Weise
        \nverbiirgt, sondern vor allem leistet diese Annahme \ngar nicht das, was
        man immer mit ihr erreichen \nwollte. Wird denn dadurch ein Ratsel gelost,
        dass \nich ewig fortlebe? Ist denn dieses ewige Leben \ndann nicht ebenso
        ratselhaft wie das gegenwartige ? \nDie Losung des Ratsels des Lebens in Raum
        und \nZeit liegt ausserhalb von Raum und Zeit. \n\n184 \n\n"},{"name":188,"value":"TRACTATUS
        LOGICO-PHILOSOPHICUS \n\nof ethical reward and ethical punishment, but this
        \nmust lie in the action itself. \n\n(And this is clear also that the reward
        must be \nsomething acceptable, and the punishment some- \nthing unacceptable.)
        \n\n6.423 Of the will as the subject of the ethical we cannot \n\nspeak. \n\nAnd
        the will as a phenomenon is only of interest \n\nto psychology. \n6.43 If
        good or bad willing changes the world, it \n\ncan only change the limits of
        the world, not the \n\nfacts ; not the things that can be expressed in \n\nlanguage.
        \n\nIn brief, the world must thereby become quite \n\nanother. It must so
        to speak wax or wane as a \n\nwhole. \n\nThe world of the happy is quite another
        than \n\nthat of the unhappy. \n6.431 As in death, too, the world does not
        change, \n\nbut ceases. \n\n6.4311 Death is not an event of life. Death is
        not lived \nthrough. \n\nIf by eternity is understood not endless temporal
        \nduration but timelessness, then he lives eternally \nwho lives in the present.
        \n\nOur life is endless in the way that our visual \nfield is without limit.
        \n\n6.4312 The temporal immortality of the human \nsoul, that is to say, its
        eternal survival after \ndeath, is not only in no way guaranteed, but \nthis
        assumption in the first place will not do \nfor us what we always tried to
        make it do. \nIs a riddle solved by the fact that I survive for \never? Is
        this eternal life not as enigmatic as \nour present one? The solution of the
        riddle of \nlife in space and time lies outside space and \ntime. \n\n185
        \n\n"},{"name":189,"value":"LOGISCH-PHILOSOPHISCHE ABHANDLUNG \n\n(Nicht Probleme
        der Naturwissenschaft sind ja \n\nzu losen.) \n6.432 Wie die Welt ist, ist
        fiir das Hohere voll- \n\nkommen gleichgiiltig. Gott offenbart sich nicht
        i n \n\nder Welt. \n6.4321 Die Tatsachen gehoren alle nur zur Aufgabe, \n\nnicht
        zur Losung. \n\n6.44 Nicht w i e die Welt ist, ist das Mystische, \nsondern
        d a s s sie ist. \n\n6.45 Die Anschauung der Welt sub specie aeterni \nist
        ihre Anschauung als \u2014 begrenztes \u2014 Ganzes. \n\nDas Gefiihl der Welt
        als begrenztes Ganzes ist \ndas mystische. \n6.5 Zu einer Antwort, die man
        nicht aussprechen \n\nkann, kann man auch die Frage nicht aussprechen. \n\nDas
        Rats el gibt es nicht. \n\nWenn sich eine Frage iiberhaupt stellen lasst,
        \nso ka n n sie auch beantwortet werden. \n\n6.51 Skeptizismus ist n i c h
        t unwiderleglich, sondern \noffenbar unsinnig, wenn er bezweifeln will, wo
        \nnicht gefragt werden kann. \n\nDenn Zweifel kann nur bestehen, wo eine Frage
        \nbesteht ; eine Frage nur, wo eine Antwort bestehtj \nund diese nur, wo etwas
        g e s a g t werden kann. \n\n6.52 Wir fuhlen, dass selbst, wenn alle m 6 g
        1 i c h e n \nwissenschaftlichen Fragen beantwortet sind, unsere \nLebensprobleme
        noch gar nicht beriihrt sind. \nFreilich bleibt dann eben keine Frage mehr;
        und \neben dies ist die Antwort. \n\n6.521 Die Losung des Problems des Lebens
        merkt \nman am Verschwinden dieses Problems. \n\n(Ist nicht dies der Grund,
        warum Menschen, \ndenen der Sinn des Lebens nach langen Zweifeln \nklar wurde,
        warum diese dann nicht sagen konnten, \nworin dieserSinn bestand.) \n\n6.522
        Es gibt allerdings Unaussprechliches. Dies \nz e i g t sich, es ist das Mystische.
        \n\n6.53 Die richtige Methode der Philosophic ware \n\n186 \n\n"},{"name":190,"value":"TRACTATUS
        LOGICO-PHILOSOPHICUS \n\n(It is not problems of natural science which have
        \n\nto be solved.) \n6.432 How the world is, is completely indifferent for
        \n\nwhat is higher. God does not reveal himself in the \n\nworld. \n6.4321
        The facts all belong only to the task and not to \n\nits performance. \n\n6.44
        Not how the world is, is the mystical, but that \nit is. \n\n6.45 The contemplation
        of the world sub specie aeterni \nis its contemplation as a limited whole.
        \n\nThe feeling of the world as a limited whole is \nthe mystical feeling.
        \n6.5 For an answer which cannot be expressed the \n\nquestion too cannot
        be expressed. \n\nThe riddle does not exist. \n\nIf a question can be put
        at all, then it can also \nbe answered. \n\n6.51 Scepticism is not irrefutable,
        but palpably sense- \nless, if it would doubt where a question cannot be \nasked.
        \n\nFor doubt can only exist where there is a \nquestion ; a question only
        where there is an answer, \nand this only where something can be said* \n\n6.52
        We feel that even if all possible scientific \nquestions be answered, the
        problems of life have \nstill not been touched at all. Of course there is
        \nthen no question left, and just this is the \nanswer. \n\n6.521 The solution
        of the problem of life is seen in the \nvanishing of this problem. \n\n(Is
        not this the reason why men to whom \nafter long doubting the sense of life
        became \nclear, could not then say wherein this sense \nconsisted ?) \n\n6.522
        There is indeed the inexpressible. This shows \nitself; it is the mystical.
        \n\n6.53 The right method of philosophy would be this. \n\n187 \n\n"},{"name":191,"value":"LOGISCH-PHILOSOPHISCHE
        ABHANDLUNG \n\neigentlich die : Nichts zu sagen, als was sich sagen \nlasst,
        also Satze der Naturwissenschaft \u2014 alsoetwas, \nwas mit Philosophic nichts
        zu tun hat \u2014 , und dann \nimmer, wenn ein anderer etwas Metaphysisches
        \nsagen wollte, ihm nachzuweisen, dass er gewissen \nZeichen in seinen Satzen
        keine Bedeutung gegeben \nhat. Diese Methode ware fiir den anderen un- \nbefriedigend
        \u2014 er hatte nicht das Gefiihl, dass wir \nihn Philosophic lehrten \u2014
        abersieware die einzig \nstreng richtige. \n\n6.54 Meine Satze eriautern dadurch,
        dass sie der, \n\nwelcher mich versteht, am Ende als unsinnig \nerkennt, wenn
        er durch sie \u2014 auf ihnen \u2014 libcr sie \nhinausgestiegen ist. (Er
        muss sozusagen die Leiter \nwegwerfen, nachdem erauf ihr hinaufgestiegen ist.)
        \nEr muss diese Satze iiberwinden, dann sicht er \ndie Welt richtig. \n\n7
        Wovon man nicht sprechen kann, dariibermuss \n\nman schweigen. \n\n188 \n\n"},{"name":192,"value":"TRACTATUS
        LOGICO-PHILOSOPHICUS \n\nTo say nothing except what can be said, i,e, the
        \npropositions of natural science, i,e, something that \nhas nothing to do
        with philosophy : and then \nalways, when someone else wished to say some-
        \nthing metaphysical, to demonstrate to him that he \nhad given no meaning
        to certain signs in his \npropositions. This method would be unsatisfying
        \nto the other \u2014 he would not have the feeling that \nwe were teaching
        him philosophy \u2014 but it would be \nthe only strictly correct method.
        \n\n6.54 My propositions are elucidatory in this way: \n\nhe who understands
        me finally recognizes them as \nsenseless, when he has climbed out through
        them, \non them, over them. (He must so to speak throw \naway the ladder,
        after he has climbed up on it.) \n\nHe must surmount these propositions ;
        then he \nsees the world rightly. \n\n7 Whereof one cannot speak, thereof
        one must be \n\nsilent. \n\n189 \n\n"},{"name":193,"value":""},{"name":194,"value":"INDEX*
