        ABHANDLUNG \n\nnicht logische Satze, und dies erklart unser Gefiihl : \nDass
        sie, wenn wahr, so doch nur durch einen \ngiinstigen Zufall wahr sein konnten.
        \n6.1233 Es lasst sich eine Welt denken, in der das \nAxiom of reducibility
        nicht gilt. Es ist aber klar, \ndass die Logik nichts mit der Frage zu schaffen
        \nhat, ob unsere Welt wirklich so ist oder nicht. \n\n6.124 Die logischen
        Satze beschreiben das Geriist der \nWelt, oder vielmehr, sie stellen es dar.
        Sie \n\u201ehandeln\" von nichts. Sie setzen voraus, dass \nNamen Bedeutung,
        und Elementarsatze Sinn \nhaben : Und dies ist ihre Verbindung mit der \nWelt.
        Es ist klar, dass es etwas iiber die Welt \nanzeigen muss, dass gewisse Verbindungen
        von \nSymbolen \u2014 welche wesentlich einen bestimmten \nCharakter haben
        \u2014 Tautologien sind. Hierin liegt \ndas Entscheidende. Wir sagten, manches
        an \nden Symbolen, die wir gebrauchen, ware willkiir- \nlich, manches nicht.
        In der Logik driickt nur \ndieses aus : Dass heisst aber, in der Logik driicken
        \nnicht wir mit Hilfe der Zeichen aus, was wir \nwollen, sondern in der Logik
        sagt die Natur der \nnaturnotwendigen Zeichen selbstaus: Wenn wirdie \nlogische
        SyntaxirgendeinerZeichensprachekennen, \ndann sind bereits alle Satze der
        Logik gegeben. \n\n6.125 Es ist moglich, und zwar auch nach der alten \nAuffassung
        der Logik, von vornherein eine Be- \nschreibung aller \u201ewahren\" logischen
        Satze zu geben. \n\n6.1251 Darum kann es in der Logik auch n i e Uberra- \nschungen
        geben. \n\n6.126 Ob ein Satz der Logik angehort, kann man \nberechnen, indem
        man die logischen Eigen- \nschaften des Symbols berechnet. \n\nUnd dies tun
        wir, wenn wir einen logischen \nSatz \u201ebeweisen\". Denn, ohne uns um einen
        Sinn \nund eine Bedeutung zu kiimmern, bilden wir den \nlogischen Satz aus
        anderen nach blossen Zei- \nchen regel n. \n\n164 \n\n"},{"name":168,"value":"TRACTATUS
        LOGICO-PHILOSOPHICUS \n\nlogical propositions, and this explains our feeling
        \nthat, if true, they can only be true by a happy \nchance. \n6.1233 We can
        imagine a world in which the axiom of \nreducibility is not valid. But it
        is clear that logic \nhas nothing to do with the question whether our \nworld
        is really of this kind or not. \n\n6.124 ^^^ logical propositions describe
        the scaffolding \nof the world, or rather they present it. They \n** treat
        \" of nothing. They presuppose that names \nhave meaning, and that elementary
        propositions \nhave sense. And this is their connexion with the \nworld. It
        is clear that it must show something \nabout the world that certain combinations
        of symbols \n\u2014 which essentially have a definite character \u2014 are
        \ntautologies. Herein lies the decisive point. We said \nthat in the symbols
        which we use something is arbit- \nrary, something not. In logic only this
        expresses : \nbut this means that in logic it is not we who express, \nby
        means of signs, what we want, but in logic the \nnature of the essentially
        necessary signs itself \nasserts. That is to say, if we know the logical \nsyntax
        of any sign language, then all the proposi- \ntions of logic are already given.
        \n\n6.125 It is possible, also with the old conception of \nlogic, to give
        at the outset a description of all \" true \" \nlogical propositions. \n\n6.1251
        Henct there can never be surprises in logic. \n\n6.126 Whether a proposition
        belongs to logic can be \ncalculated by calculating the logical properties
        of \nthe symbol. \n\nAnd this we do when we prove a logical pro- \nposition.
        For without troubling ourselves about \na sense and a meaning, we form the
        logical \npropositions out of others by mere symbolic \nrules. \n\n165 \n\n"},{"name":169,"value":"LOGISCH-PHILOSOPHISCHE
        ABHANDLUNG \n\nDer Beweis der logischen Satze besteht darin, \ndass wir sie
        aus anderen logischen Satzen durch \nsuccessive Anwendung gewisser Operationen
        ent- \nstehen lassen, die aus den ersten immer wieder \nTautologien erzeugen.
        (Und zwar folgen aus \neiner Tautologie nur Tautologien.) \n\nNatiirlich ist
        diese Art zu zeigen, dass ihre \nSatze Tautologien sind, der Logik durchaus
        un- \nwesentlich. Schon darum, weil die Satze, von \nwelchen der Beweis ausgeht,
        ja ohne Beweis zeigen \nmiissen, dass sie Tautologien sind. \n\n6.1261 In
        der Logik sind Prozess und Resultat aquiva- \nlent. (Darum keine Uberraschung.)
        \n\n6.1262 Der Beweis in der Logik ist nur ein mecha- \nnisches Hilfsmittel
        zum leichteren Erkennen der \nTautologie, wo sie kompliziert ist. \n\n6.1263
        Es ware ja auch zu merkwiirdig, wenn man \neinen sinnvollen Satz logisch aus
        anderen be- \nweisen konnte, und einen logischen Satz auch. \nEs ist von vornherein
        klar, dass der logische \nBeweis eines sinnvollen Satzes und der Beweis i
        n \nder Logik zwei ganz verschiedene Dinge sein \nmiissen. \n\n6.1264 Der
        sinnvolle Satz sagt etwas aus, und sein \nBeweis zeigt, dass es so ist ; in
        der Logik ist jeder \nSatz die Form eines Beweises. \n\nJeder Satz der Logik
        ist ein in Zeichen darge- \nstellter modus ponens. (Und den modus ponens \nkann
        man nicht durch einen Satz ausdriicken.) \n\n6.1265 Immer kann man die Logik
        so auffassen, dass \njeder Satz sein eigener Beweis ist. \n\n6.127 Alle Satze
        der Logik sind gleichberechtigt, es \n\ngibt unter ihnen nicht wesentlich
        Grundgesetze \nund abgeleitete Satze. \n\nJede Tautologie zeigt selbst, dass
        sie eine \nTautologie ist. \n6.1271 Es ist klar, dass die Anzahl der Jogischen
        \nGrundgesetze\" willkiirlich ist, denn man kdnnte \n\n166 \n\n"},{"name":170,"value":"TRACTATUS
        LOGICO-PHILOSOPHICUS \n\nWe prove a logical proposition by creating it \nout
        of other logical propositions by applying in \nsuccession certain operations,
        which again generate \ntautologies out of the first. (And from a tautology
        \nonly tautologies /^//^z^/.) \n\nNaturally this way of showing that its pro-
        \npositions are tautologies is quite unessential to \nlogic. Because the propositions,
        from which the \nproof starts, must show without proof that they \nare tautologies.
        \n\n6.1261 In logic process and result are equivalent. \n(Therefore no surprises.)
        \n\n6.1262 Proof in logic is only a mechanical expedient \nto facilitate the
        recognition of tautology, where \nit is complicated. \n\n6.1263 It would be
        too remarkable, if one could prove \na significant proposition logically from
        another, and \na logical proposition also. It is clear from the \nbeginning
        that the logical proof of a significant \nproposition and the proof in logic
        must be two \nquite different things. \n\n6.1264 The significant proposition
        asserts something, \nand its proof shows that it is so ; in logic every \nproposition
        is the form of a proof. \n\nEvery proposition of logic is a modus ponens \npresented
        in signs. (And the modus ponens can \nnot be expressed by a proposition.)
        \n\n6.1265 Logic can always be conceived to be such that \nevery proposition
        is its own proof. \n\n6.127 All propositions of logic are of equal rank ;
        \n\nthere are not some which are essentially primitive \nand others deduced
        from these. \n\nEvery tautology itself shows that it is a \ntautology. \n6.1271
        It is clear that the number of ** primitive pro- \npositions of logic ''*
        is arbitrary, for we could deduce \n\n167 \n\n"},{"name":171,"value":"LOGISCH-PHILOSOPHISCHE
        ABHANDLUNG \n\ndie Logik ja aus Einem Grundgesetz ableiten, \nindem man einfach
        z. B. aus Freges Grundge- \nsetzen das logische Produkt bildet. (Frege wiirde
