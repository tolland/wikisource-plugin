        LOGICO-PHILOSOPHICUS \n\nposition says the same as the proposition. There-
        \nfore that product is identical with the proposition. \nFor the essence of
        the symbol cannot be altered \nwithout altering its sense. \n\n4.466 To a
        definite logical combination of signs \n\ncorresponds a definite logical combination
        of their \nmeanings ; every arbitrary combination only corre- \nsponds to
        the unconnected signs. \n\nThat is, propositions which are true for evety
        \nstate of affairs cannot be combinations of signs at \nall, for otherwise
        there could only correspond to \nthem definite combinations of objects. \n\n(And
        to no logical combination corresponds no \ncombination of the objects.) \n\nTautology
        and contradiction are the limiting \ncases of the combinations of symbols,
        namely their \ndissolution. \n\n4.4661 Of course the signs are also combined
        with one \nanother in the tautology and contradiction, i,e. \nthey stand in
        relations to one another, but these \nrelations are meaningless, unessential
        to the \nsymbol, \n\n4.5 Now it appears to be possible to give the \n\nmost
        general form of proposition ; i.e, to give a \ndescription of the propositions
        of some one sign \nlanguage, so that every possible sense can be \nexpressed
        by a symbol, which falls under the \ndescription, and so that every symbol
        which falls \nunder the description can express a sense, if \nthe meanings
        of the names are chosen accord- \ningly. \n\nIt is clear that in the description
        of the most \ngeneral form of proposition only what is essential \nto it may
        be described \u2014 otherwise it would not be \nthe most general form. \n\nThat
        there is a general form is proved by the \nfact that there cannot be a proposition
        whose \nform could not have been foreseen {ue, constructed). \n\nlOI \n\n"},{"name":105,"value":"LOGISCH-PHILOSOPHISCHE
