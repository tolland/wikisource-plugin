        \nlich unerlaubt ist.) \n\nHat sich aber die Einfuhrung eines neuen \nBehelfes
        an einer Stelle als notig erwiesen, so muss \nman sich nun sofort fragen :
        Wo muss dieser \nBehelf nun i m m e r angewandt werden ? Seine \nStellung
        in der Logik muss nun erklart werden. \n\n5.453 Alle Zahlen der Logik miissen
        sich rechtfertigen \nlassen. \n\nOder vielmehr : Es muss sich herausstellen,
        \ndass es in der Logik keine Zahlen gibt. \nEs gibt keine ausgezeichneten
        Zahlen. \n\n5.454 In der Logik gibt es kein Nebeneinander, kann \nes keine
        Klassifikation geben. \n\nIn der Logik kann es nicht Allgemeineres und \nSpezielleres
        geben. \n5.4541 Die Losungen der logischen Probleme miissen \neinfach sein,
        denn sie setzen den Standard der \nEinfachheit. \n\nDie Menschen haben immer
