        \n\n(The fact that we can infer /a from (x) ,/x shows \nthat generality is
        present also in the symbol \n\n5.132 If/ follows from ^, I can conclude from
        g to p ; \ninfer/ from q. \n\nThe method of inference is to be understood
        \nfrom the two propositions alone. \n\nOnly they themselves can justify the
        inference. \n\nLaws of inference, which \u2014 as in Frege and \nRussell \u2014
        are to justify the conclusions, are sense- \nless and would be superfluous.
        \n\n5.133 All inference takes place a priori. \n\n5.134 From an elementary
        proposition no other can \nbe inferred. \n\n5.135 In no way can an inference
        be made from the \nexistence of one state of affairs to the existence of \nanother
        entirely different from it. \n\n5.136 There is no causal nexus which justifies
        such \nan inference. \n\n5.1361 The events of the future cannot be inferred
        from \nthose of the present. \n\nSuperstition is the belief in the causal
        \nnexus. \n\n5.136^ The freedom of the will consists in the fact that \nfuture
        actions cannot be known now. We could \nonly know them if causality were an
        inner necessity, \nlike that of logical deduction. \u2014 The connexion \nof
