        und Nichtiibereinstimmung mit den Mog- \n\n86 \n\n"},{"name":90,"value":"TRACTATUS
        LOGICO-PHILOSOPHICUS \n\nas it would be to say : 2 + 2 is at 3 o*clock equal
        \nto 4.) \n4.12721 The formal concept is already given with an \nobject, which
        falls under it. One cannot, there- \nfore, introduce both, the objects which
        fall under \na formal concept and the formal concept itself, \nas primitive
        ideas. One cannot, therefore, e,g, \nintroduce (as Russell does) the concept
        of function \nand also special functions as primitive ideas ; or \nthe concept
        of number and definite numbers. \n\n4.1273 If we want to express in logical
        symbolism \nthe general proposition **^ is a successor of ^i\" \nwe need for
        this an expression for the general \nterm of the formal series : aRb^ (H^)
        \u2022 ^^^ \u2022 xRb^ \n{''^x^y) laRx ,xRy ,yRby . . . The general term of
        \na formal series can only be expressed by a \nvariable, for the concept symbolized
        by **term of \nthis formal series \" is a formal concept. (This \nFrege and
        Russell overlooked ; the way in \nwhich they express general propositions
        like the \nabove is, therefore, false ; it contains a vicious \ncircle.) \n\nWe
        can determine the general term of the \nformal series by giving its first
        term and the \ngeneral form of the operation, which generates \nthe following
        term out of the preceding pro- \nposition. \n\n4.1274 The question about the
        existence of a formal \nconcept is senseless. For no proposition can \nanswer
        such a question. \n\n(For example, one cannot ask: **Are there \nunanalysable
        subject-predicate propositions?\") \n4.128 The logical forms are anumericaL
        \n\nTherefore there are in logic no pre-eminent \n\nnumbers, and therefore
        there is no philosophical \n\nmonism or dualism, etc. \n\n4.2 The sense of
        a proposition is its agreement \n\nand disagreement with the possibilities
