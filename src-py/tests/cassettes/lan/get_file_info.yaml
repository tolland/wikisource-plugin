        LOGICO-PHILOSOPHICUS \n\n5.634 This is connected with the fact that no part
        of \n\nour experience is also a priori. \n\nEverything we see could also be
        otherwise. \n\nEverything we can describe at all could also be \notherwise.
        \n\nThere is no order of things a priori. \n\n5.64 Here we see that solipsism
        strictly carried out \n\ncoincides with pure realism. The I in solipsism \nshrinks
        to an extensionless point and there remains \nthe reality co-ordinated with
        it. \n\n5.641 There is therefore really a sense in which in \n\nphilosophy
        we can talk of a non-psychological I. \n\nThe I occurs in philosophy through
        the fact \nthat the ** world is my world \". \n\nThe philosophical I is not
        the man, not the \nhuman body or the human soul of which psy- \nchology treats,
        but the metaphysical subject, the \nlimit \u2014 not a part of the world.
