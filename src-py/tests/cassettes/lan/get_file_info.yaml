        \n3.34 Der Satz besitzt wesentliche und zufallige Ziige. \n\nZufallig sind
        die Ziige, die von der besonderen \n\nArt derHervorbringung desSatzzeichens
        herriihren. \n\nWesentlich diejenigen, welche allein den Satz be- \n\nfahigen,
        seinen Sinn auszudriicken. \n\n3.341 Das Wesentliche am Satz ist also das,
        was alien \nSatzen, welche den gleichen Sinn ausdriicken \nkonnen, gemeinsam
        ist. \n\nUnd ebenso ist allgemein das Wesentliche am \nSymbol das, was alle
        Symbole, die denselben \nZweck erfiillen konnen, gemeinsam haben. \n3.3411
        Man konnte also sagen : Der eigentliche Name \nist das, was alle Symbole,
        die den Gegenstand \nbezeichnen, gemeinsam haben. Es wurde sich so \nsuccessive
        ergeben, dass keinerlei Zusammense- \ntzung fiir den Namen wesentlich ist.
        \n\n3.342 An unseren Notationen ist zwar etwaswillkiirlich, \naber das ist
        nicht willkiirlich : Dass, wenn wir \netwas willkiirlich bestimmt haben, dann
        etwas \nanderes der Fall sein muss. (Dies hangt von dem \nW e s e n der Notation
        ab.) \n\n3.3421 Eine besondere Bezeichnungsweise mag un- \nwichtig sein, aber
        wichtig ist es immer, dass diese \neine mogliche Bezeichnungsweise ist. Und
        so \nverhalt es sich in der Philosophie iiberhaupt : Das \nEinzelne erweist
        sich immer wieder als unwichtig, \naber die Moglichkeit jedes Einzelnen gibt
        uns \neinen Aufschluss iiber das Wesen der Welt. \n\n3.343 Definitionen sind
        Regeln der Ubersetzung von \neiner Sprache in eine andere. Jede richtige Zeichen-
        \nsprache muss sich in jede andere nach solchen \nRegeln iibersetzen lassen
        : Dies ist, was sie alle \ngemeinsam haben. \n\n3.344 Das, was am Symbol bezeichnet,
        ist das Gemein- \nsame aller jener Symbole, durch die das erste den \n\n58
        \n\n"},{"name":62,"value":"TRACTATUS LOGICO-PHILOSOPHICUS \n\n3.334 The rules
        of logical syntax must follow of them- \n\nselves, if we only know how every
        single sign \nsignifies. \n\n3.34 A proposition possesses essential and accidental
        \n\nfeatures. \n\nAccidental are the features which are due to a \nparticular
        way of producing the propositional sign. \nEssential are those which alone
        enable the pro- \nposition to express its sense. \n\n3.341 The essential in
        a proposition is therefore that \nwhich is common to all propositions which
        can \nexpress the same sense. \n\nAnd in the same way in general the essential
        in \na symbol is that which all symbols which can \nfulfil the same purpose
        have in common. \n3.3411 One could therefore say the real name is that \nwhich
        all symbols, which signify an object, have \nin common. It would then follow,
        step by step, \nthat no sort of composition was essential for a name. \n\n3.342
        In our notations there is indeed something \narbitrary, but this is not arbitrary,
        namely that \nif we have determined anything arbitrarily, then \nsomething
        else must be the case. (This results \nfrom the essence of the notation.)
        \n\n3.3421 A particular method of symbolizing may be \nunimportant, but it
        is always important that this \nis a possible method of symbolizing. And this
        \nhappens as a rule in philosophy : The single \nthing proves over and over
        again to be unimportant, \nbut the possibility of every single thing reveals
        \nsomething about the nature of the world. \n\n3.343 Definitions are rules
        for the translation of one \nlanguage into another. Every correct symbolism
        \nmust be translatable into every other according \nto such rules. It is this
        which all have in \ncommon. \n\n3.344 What signifies in the symbol is what
        is \ncommon to all those symbols by which it can \n\n59 \n\n"},{"name":63,"value":"LOGISCH-PHILOSOPHISCHE
