        Tischen, Sttihlen, \nBiichern) zusammengesetzt denken. \n\nDie gegenseitige
        raumliche Lage dieser Dinge \ndriickt dann den Sinn des Satzes aus. \n\n3.1432
        Nicht: ,,Das komplexe Zeichen ,aRb* sagt, \ndass a in der Beziehung R zu b
