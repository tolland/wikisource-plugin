        ABHANDLUNG \n\nKennzeichen des zusammengesetzten Symbols: \nEs hat etwas mit
        anderen Symbolen gemeinsam. \n\n5.5262 Es verandert ja die Wahr- oder Falschheitjedes
        \nSatzes etwas am allgemeinen Bau der Welt. Und \nder Spielraum, welcher ihrem
        Bau durch die \nGesamtheit der Elementarsatze gelassen wird, ist \neben derjenige,
        welchen die ganz allgemeinen \nSatze begrenzen. \n\n(Wenn ein Elementarsatz
        wahr ist, so ist damit \ndoch jedenfalls Ein Elementarsatz mehr wahr.) \n\n5.53
        Gleichheit des Gegenstandes driicke ich durch \n\nGleichheit des Zeichens
        aus, und nicht mit Hilfe \neines Gleichheitszeichens. Verschiedenheit der
        \nGegenstande durch Verschiedenheit der Zeichen. \n\n5.5301 Dass die Identitat
        keine Relation zwischen Ge- \ngenstanden ist, leuchtet ein. Dies wird sehr
        klar, \nwenn man z. B. den Satz \u201e(x) : fx . 3. x = a\" \nbetrachtet.
        Was dieser Satz sagt, ist einfach, \ndass n u r a der Funktion f geniigt,
        und nicht, \ndass nur solche Dinge der Funktion f geniigen, \nwelche eine
        gewisse Beziehung zu a haben. \n\nMan konnte nun freilich sagen, dass eben
        nur \na diese Beziehung zu a habe, aber um dies auszu- \ndriicken, brauchten
        wir das Gleichheitszeichen \nselber. \n\n5.5302 Russells Definition von \u201e
        = \" geniigt nicht; weil \nman nach ihr nicht sagen kann, dass zwei Gegen-
        \nstande alle Eigenschaften gemeinsam haben. \n(Selbst wenn dieser Satz nie
        richtig ist, hat er \ndoch Sinn.) \n\n5*5303 Beilaufig gesprochen : Von zwei
        Dingen zu \nsagen, sie seien identisch, ist ein Unsinn, und von \nE i n e
        m zu sagen, es sei identisch mit sich selbst, \nsagt gar nichts. \n\n5.531
        Ich schreibe also nicht \u201ef(a,b) . a = b\", sondern \n\u201ef(a,a)\" (oder
        ,.f(b,b)\"). Und nicht \u201ef(a,b) . - a = b\", \nsondern \u201ef(a,b)\".
        \n\n5.532 Und analog : Nicht \u201e(ax,y) . f(x,y) . x = y\", \n\n138 \n\n"},{"name":142,"value":"TRACTATUS
        LOGICO-PHILOSOPHICUS \n\nA characteristic of a composite symbol : it has \n\nsomething:
        in common with other symbols. \n5.5262 The truth or falsehood of every proposition
        alters \n\nsomething in the general structure of the world. \n\nAnd the range
        which is allowed to its structure by \n\nthe totality of elementary propositions
        is exactly \n\nthat which the completely general propositions \n\ndelimit.
        \n\n(If an elementary proposition is true, then, at \n\nany rate, there is
        one more elementary proposition \n\ntrue.) \n5.53 Identity of the object I
        express by identity of \n\nthe sign and not by means of a sign of identity.
        \n\nDifference of the objects by difference of the \n\nsigns. \n\n5.5301 That
        identity is not a relation between objects is \nobvious. This becomes very
        clear if, for example, \none considers the proposition ^^ {x) \\ fx ,1^ .
        x = a''''\\ \nWhat this proposition says is simply that only \na satisfies
        the function /, and not that only such \nthings satisfy the function / which
        have a certain \nrelation to a. \n\nOne could of course say that in fact only
        \na has this relation to a^ but in order to express \nthis we should need
        the sign of identity itself. \n\n5.5302 Russell''s definition of *< = ** won''t
        do; because \naccording to it one cannot say that two objects \nhave all their
        properties in common. (Even if \nthis proposition is never true, it is nevertheless
        \nsignificant,^ \n\n5*5303 Roughly speaking: to say of two things that \nthey
        are identical is nonsense, and to say of one \nthing that it is identical
        with itself is to say \nnothing. \n\n5.531 I write therefore not ^^f(a,b)
        . a = b''\\ but ^^f{a,aY'' \n(or **yi;^(^)\"). And not ''''/[a,b) , ''^ a==b''\\
        but \n\n5.532 And analogously : not \" (3;^^) ./(^r^) . ;r=j/\", \n\n139 \n\n"},{"name":143,"value":"LOGISCH-PHILOSOPHISCHE
