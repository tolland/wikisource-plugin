        ABHANDLUNG \n\nEs zeigt sich so auch in Russells Notation, dass \n\u201eq
        : p V ''*'' p\" dasselbe sagt wie \u201eq\" ; dass \u201ep v ''- p\" \nnichtssagt.
        \n\n5.514 1st eine Notation festgelegt, so gibt es in ihr eine \nRegel, nach
        der alle p verneinenden Satz gebildet \nwerden, eine Regel, nach der alle
        p bejahenden \nSatze gebildet werden, eine Regel, nach der alle \np Oder q
        bejahenden Satze gebildet werden, u. s. f. \nDiese Regeln sind den Symbolen
        aquivalent \nund in ihnen spiegelt sich ihr Sinn wieder. \n\n5.515 Es muss
        sich an unseren Symbolen zeigen, dass \ndas, was durch \u201ev\", \u201e .
        \", etc. miteinander verbunden \nist, Satze sein miissen. \n\nUnd dies ist
        auch der Fall, denn das Symbol \u201ep\" \nund \u201eq\" setzt ja selbst das
        \u201ev\", \u201e ^ \", etc. voraus. \nWenn das Zeichen \u201ep\" in \u201epvq\"
        nicht fiir ein kom- \nplexes Zeichen steht, dann kann es allein nicht \nSinn
        haben ; dann konnen aber auch die mit \u201ep\" \ngleichsinnigen Zeichen \u201epvp\",
        \u201ep.p\", etc. keinen \nSinn haben. Wenn aber \u201epvp\" keinen Sinn hat,
        \ndann kann auch \u201epvq\" keinen Sinn haben. \n5.5151 Muss das Zeichen
        des negativen Satzes mit dem \nZeichen des positiven gebildet werden? Warum
        \nsollte man den negativen Satz nicht durch eine ne- \ngative Tatsache ausdrucken
        konnen. (Etwa : Wenn \n\u201ea\" nicht in einer bestimmten Beziehung zu \u201eb\"
        steht, \nkonnte das ausdrucken, dass aRb nicht der Fall ist.) \n\nAber auch
        hier ist ja der negative Satz indirekt \ndurch den positiven gebildet. \n\nDer
        positive Satz muss die Existenz des nega- \ntiven Satzes voraussetzen und
        umgekehrt. \n5.52 Sind die Werte von ^ samtliche Werte einer \n\nFunktion
        fx fiir alle Werte von x, so wird \n\nN(|) = - (Hx) . fx. \n5.521 Ich trenne
        den Begriff Alle von der Wahrheits- \n\nfunktion. \n\nFrege und Russell haben
        die Allgemeinheit in \nVerbindung mit dem logischen Produkt oder der \n\n134
        \n\n"},{"name":138,"value":"TRACTATUS LOGICO-PHILOSOPHICUS \n\nThus in Russell''s
        notation also it appears evident \nthat ^^q''.pw -''/*'' says the same as
        **^\"; that \n**/ V ''^ / ** says nothing. \n\n5.514 If a notation is fixed,
        there is in it a rule accord- \ning to which all the propositions denying
        / are \nconstructed, a rule according to which all the \npropositions asserting
        p are constructed, a rule \naccording to which all the propositions asserting
        \np ox q are constructed, and so on. These rules \nare equivalent to the symbols
        and in them their \nsense is mirrored. \n\n5.515 It must be recognized in
        our symbols that what \nis connected by \"v\", **.\", etc., must be proposi-
        \ntions. \n\nAnd this is the case, for the symbols **/\" and \n**^\" presuppose
        **v\", ** ''^ \", etc. If the sign \n**/\" in ^^pvq^^ does not stand for a
        complex sign, \nthen by itself it cannot have sense ; but then also \nthe
        signs *Vv/\"\u00bb **/\u2022/*''\u00bb ^tc. which have the \nsame sense as
        **/*'' have no sense. If, however, \n**/)v/\" has no sense, then also **/v^\"
        can have \nno sense. \n\n5.5151 Must the sign of the negative proposition
        be \nconstructed by means of the sign of the positive ? \nWhy should one not
        be able to express the \nnegative proposition by means of a negative fact?
        \n(Like: if **<2.\"does not stand in a certain relation \nto ** 3 \", it could
        express that aRb is not the case.) \n\nBut here also the negative proposition
        is in- \ndirectly constructed with the positive. \n\nThe positive proposition
        must presuppose the \nexistence of the negative proposition and con- \nversely.
        \n\n5.52 If the values of ^are the total values of a func- \n\ntion /r for
        all values of ;ir, then N(f)= ^ (g;jr) .fx. \n\n5.521 I separate the concept
        all from the truth-function. \n\nFrege and Russell have introduced generality
        \n\nin connexion with the logical product or the logical \n\n135 \n\n"},{"name":139,"value":"LOGISCH-PHILOSOPHISCHE
        ABHANDLUNG \n\nlogischeh Summe eingefiihrt. So wurde es schwer, \ndie Satze
        \u201e(ax) . fx\" und \u201e(x) . fx\", in welchen beide \nIdeen beschlossen
        liegen, zu verstehen. \n\n5.522 Das Eigentiimliche der Allgemeinheitsbezeich-
        \nnung ist erstens, dass sie auf ein logisches Ur- \nbild hinweist, und zweitens,
        dass sie Konstante \nhervorhebt. \n\n5.523 Die Allgemeinheitsbezeichnung tritt
        als Argu- \nment auf. \n\n5.524 Wenn die Gegenstande gegeben sind, so sind
        \nuns damit auch schon alle Gegenstande gegeben. \n\nWenn die Elementarsatze
        gegeben sind, so sind \ndamit auch alle Elementarsatze gegeben. \n\n5.525
        Es ist unrichtig, den Satz \u201e(gx) . fx\" \u2014 wie \nRussell dies tut
        \u2014 in Worten durch \u201efx ist moglich\" \nwiederzugeben. \n\nGewissheit,
        Moglichkeit oder Unmoglichkeit \neiner Sachlage wird nicht durch einen Satz
        ausge- \ndriickt, sondern dadurch, dass ein Ausdruck eine \nTautologie, ein
        sinnvoller Satz, oder eine Kontra- \ndiktion ist. \n\nJener Prazedenzfall,
        auf den man sich immer \nberufen mochte, muss schon im Symbol selber \nliegen.
        \n\n5.526 Man kann die Welt vollstandig durch voll- \nkommen verallgemeinerte
        Satze beschreiben, das \nheisst also, ohne irgend einen Namen von vorn- \nherein
        einem bestimmten Gegenstand zuzuordnen. \n\nUm dann auf die gewohnliche Ausdrucksweise
        \nzu kommen,muss man einfach nach einem Ausdruck \n\u201ees gibt ein und nur
        ein x, welches . . . .\" sagen : \nUnd dies x ist a. \n5.5261 Ein vollkommen
        verallgemeinerter Satz ist, wie \njeder andere Satz zusammengesetzt. (Dies
        zeigt \nsich daran, dass wir in \u201e(gx , <^) . <^x\" \u201e<^\" und \u201ex''*
        \ngetrennt erwahnen miissen. Beide stehen unab- \nhangig in bezeichnenden
        Beziehungen zur Welt, \nwie im unverallgemeinerten Satz.) \n\n136 \n\n"},{"name":140,"value":"TRACTATUS
        LOGICO-PHILOSOPHICUS \n\nsum. Then it would be difficult to understand \nthe
