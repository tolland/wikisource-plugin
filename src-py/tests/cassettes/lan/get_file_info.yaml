        LOGICO-PHILOSOPHICUS \n\nbecause there is no property which is called \n**
        identical ''*. The proposition is senseless because \nwe have not made some
        arbitrary determination, \nnot because the symbol is in itself unpermissible.)
        \nIn a certain sense we cannot make mistakes in \nlogic. \n\n5.4731 Self-evidence,
        of which Russell has said so \nmuch, can only be discarded in logic by language
        \nitself preventing every logical mistake. That \nlogic is a priori consists
        in the fact that we cannot \nthink illogically. \n\n5.4732 We cannot give
        a sign the wrong sense. \n\n5.47321 Occam''s razor is, of course, not an arbitrary
        rule \nnor one justified by its practical success. It simply \nsays that unnecessary
        elements in a symbolism \nmean nothing. \n\nSigns which serve one purpose
        are logically \nequivalent, signs which serve no purpose are \nlogically meaningless.
        \n5\u00ab4733 Frege says : Every legitimately constructed \nproposition must
        have a sense ; and I say : Every \npossible proposition is legitimately constructed,
        \nand if it has no sense this can only be because \nwe have given no meaning
        to some of its constituent \nparts. \n\n(Even if we believe that we have done
        \nso.) \n\nThus ** Socrates is identical\" says nothing, \nbecause we have
        given no meaning to the word \n** identical\" as adjective. For when it occurs
        as \nthe sign of equality it symbolizes in an entirely \ndifferent way \u2014
        the symbolizing relation is another \n\u2014 therefore the symbol is in the
        two cases entirely \ndifferent ; the two symbols have the sign in \ncommon
        with one another only by accident. \n\n129 I \n\n"},{"name":133,"value":"LOGISCH-PHILOSOPHISCHE
        ABHANDLUNG \n\n5.474 Die Anzahl der notigen Grundoperationen hangt \nnur von
        unserer Notation ab. \n\n5.475 Es kommt nur darauf an, ein Zeichensystem von
        \neiner bestimmten Anzahl von Dimensionen \u2014 von \neiner bestimmten mathematischen
        Mannigfaltigkeit \n\u25a0 \u2014 zu bilden. \n\n5.476 Es ist klar, dass es
        sich hier nicht um eine \nAnzahl von Grundbegriffen handelt, die \nbezeichnet
        werden miissen, sondern um den \nAusdruck einer Regel. \n\n5.5 Jede Wahrheitsfunktion
        ist ein Resultat der \n\nsuccessiven Anwendung der Operation ( W) \n\n(^,
        . . . .) auf Elementarsatze. \n\nDiese Operation verneint samtliche Satze
        in der \nrechten Klammer und ich nenne sie die Negation \ndieser Satze. \n\n5.501
        Einen Klammerausdruck, dessen Glieder Satze \n\nsind,deute ich \u2014 wenn
        die Reihenfolgeder Glieder in \nder Klammer gleichgiiltigist \u2014 durch
        einZeichen von \nder Form \u201e(^)\" an. \u201ef * ist eine Variable, deren
        Werte \ndie Glieder des Klammerausdruckes sind ; und der \nStrich iiber der
        Variablen deutet an, dass sie ihre \nsamtlichen Werte in der Klammer vertritt.
        \n\n(Hat also ^ etwa die 3 Werte P, Q, R, so ist \n\n(?) = (P, Q, R).) \n\nDie
        Werte der Variablen werden festgesetzt. \n\nDie Festsetzung ist die Beschreibung
        der Satze, \nwelche die Variable vertritt. \n\nWie die Beschreibung der Glieder
        des Klammer- \nausdruckes geschieht, ist unwesentlich. \n\nWir k o n n e n
        drei Arten der Beschreibung \nunterscheiden : i. Die direkte Aufzahlung. In
        \ndiesem Fall konnen wir statt der Variablen einfach \nihre konstanten Werte
        setzen. 2. Die Angabe \neiner Funktion fx, deren Werte fiir alle Werte von
        \nX die zu beschreibenden Satze sind. 3. Die Angabe \neines formalen Gesetzes,
        nach welchem jene Satze \ngebildet sind. In diesem Falle sind die Glieder
        des \n\n130 \n\n"},{"name":134,"value":"TRACTATUS LOGICO-PHILOSOPHICUS \n\n5.474
        The number of necessary fundamental opera- \ntions depends only on our notation.
        \n\n5.475 It is only a question of constructing a system \nof signs of a definite
        number of dimensions \u2014 of \na definite mathematical multiplicity. \n\n5.476
        It is clear that we are not concerned here with \na number of primitive ideas
        which must be signified \nbut with the expression of a rule. \n\n5.5 Every
        truth-function is a result of the successive \n\napplication of the operation
        ( T Xf> . . . .) to \n\nelementary propositions. \n\nThis operation denies
        all the propositions in \nthe right-hand bracket and I call it the negation
        \nof these propositions. \n\n5.501 An expression in brackets whose terms are
        \n\npropositions I indicate \u2014 if the order of the terms \nin the bracket
        is indifferent \u2014 by a sign of the form \n**(?)\"\u2022 **^\" is a variable
        whose values are the \nterms of the expression in brackets, and the line \nover
        the variable indicates that it stands for all \nits values in the bracket.
        \n\n(Thus if ^ has the 3 values P, Q, R, then \n(|)=(P,Q, R).) \n\nThe values
        of the variables must be determined. \n\nThe determination is the description
        of the pro- \npositions which the variable stands for. \n\nHow the description
        of the terms of the expres- \nsion in brackets takes place is unessential.
        \n\nWe may distinguish 3 kinds of description : \n\n1. Direct enumeration.
        In this case we can place \nsimply its constant values instead of the variable.
        \n\n2. Giving a function fx^ whose values for all \nvalues of x are the propositions
        to be described. \n\n3. Giving a formal law, according to which those \npropositions
        are constructed. In this case the \n\n131 \n\n"},{"name":135,"value":"LOGISCH-PHILOSOPHISCHE
