        \n\nlichkeiten des Bestehens und Nichtbestehens der \nSachverhalte. \n\n4.21
        Der einfachste Satz, der Elementarsatz, be- \nhauptet das Bestehen eines Sachverhaltes.
        \n\n4.211 Ein Zeichen des Elementarsatzes ist es, dass \n\nkein Elementarsatz
        mit ihm in Widerspruch stehen \nkann. \n\n4.22 Der Elementarsatz besteht aus
        Namen. Er ist \nein Zusammenhang, eine Verkettung, von Namen. \n\n4.221 Es
        ist offenbar, dass wir bei der Analyse der \n\nSatze auf Elementarsatze kommen
        miissen, die aus \nNamen in unmittelbarer Verbindung bestehen. \n\nEs fragt
        sich hier, wie kommt der Satzverband \nzustande. \n\n4.2211 Ailch wenn die
        Welt unendlich komplex ist, \nso dass jede Tatsache aus unendlich vielen Sach-
        \nverhalten besteht und jeder Sachverhalt aus un- \nendlich vielen Gegenstanden
        zusammengesetzt ist, \nauch dann miisste es Gegenstande und Sachver- \nhalte
        geben. \n\n4.23 Der Name kommt im Satz nur im Zusammen- \nhange des Elementarsatzes
        vor. \n\n4.24 Die Namen sind die einfachen Symbole, ich \ndeutesiedurcheinzelneBuchstaben(,,x**,,,y**,
        ,,z**) \nan. \n\nDen Elementarsatz schreibe ich als Funktion \nder Namen in
        der Form : ,,fx*% ,,<^x,y,)**, etc. \n\nOder ich deute ihn durch die Buchstaben
        p, q, \nr an. \n4.241 Gebrauche ich zwei Zeichen in ein und der- \n\nselben
        Bedeutung, so driicke ich dies aus, indem \nich zwischen beide das Zeichen
        ,, = ** setze. \n\n,,a = b*'' heisst also : das Zeichen ,,a** ist durch \ndas
        Zeichen ,,b** ersetzbar. \n\n(Fiihre ich durch eine Gleichung ein neues \nZeichen
        ,,b''* ein, indem ich bestimme, es solle ein \nbereits bekanntes Zeichen ,,a''*
        ersetzen, so schreibe \nich die Gleichung \u2014 Definition \u2014 (wie Russell)
        in \n\n88 \n\n"},{"name":92,"value":"TRACTATUS LOGICO-PHILOSOPHICUS \n\nexistence
        and non-existence of the atomic \nfacts. \n\n4.21 The simplest proposition,
        the elementary pro- \nposition, asserts the existence of an atomic fact. \n\n4.
        211 It is a sign of an elementary proposi- \n\ntion, that no elementary proposition
        can contra- \ndict it. \n\n4.22 The elementary proposition consists of names.
        \nIt is a connexion, a concatenation, of names. \n\n4.221 It is obvious that
        in the analysis of propositions \n\nwe must come to elementary propositions,
        which \nconsist of names in immediate combination. \n\nThe question arises
        here, how the propositional \nconnexion comes to be. \n\n4.2211 Even if the
        world is infinitely complex, so \nthat every fact consists of an infinite
        number \nof atomic facts and every atomic fact is composed \nof an infinite
        number of objects, even then there \nmust be objects and atomic facts. \n\n4.23
        The name occurs in the proposition only in \nthe context of the elementary
        proposition. \n\n4.24 The names are the simple symbols, I indicate \nthem
        by single letters (Xyj^ys), \n\nThe elementary proposition I write as function
        \nof the names, in the form **/r**, **</>(^ji>'')\", etc. \nOr I indicate
        it by the letters /,^,r. \n\n4.241 If I use two signs with one and the same
        \n\nmeaning, I express this by putting between them \nthe sign ** = ''*. \n\n\u2666<cj
        = ^\" means then, that the sign ^*a\" is \nreplaceable by the sign *''^''*.
        \n\n(If I introduce by an equation a new sign **^\", \nby determining that
        it shall replace a previously \nknown sign ^^a''\\ I write the equation \u2014
        definition \n\n89 \n\n"},{"name":93,"value":"LOGISCH-PHILOSOPHISCHE ABHANDLUNG
        \n\nder Form ,,a = b Def/^ Die Definition ist eine \nZeichenregel.) \n\n4.242
        Ausdriicke von der Form ,,a = b*^sind also nur \nBehelfe der Darstellung ;
        sie sagen nichts iiber die \nBedeutung der Zeichen ,,a**, ,,b** aus. \n\n4.243
        Konnen wir zwei Namen verstehen, ohne zu \nwissen, ob sie dasselbe Ding oder
        zwei verschie- \ndene Dinge bezeichnen ? \u2014 Konnen wir einen Satz, \nworin
        zwei Namen vorkommen, verstehen, ohne \nzu wissen, ob sie Dasselbe oder Verschiedenes
        \nbedeuten ? \n\nKenne ich etwa die Bedeutung eines englischen \nund eines
        gleichbedeutenden deutschen Wortes, so \nist es unmoglich, dass ich nicht
        weiss, dass die \nbeiden gleichbedeutend sind ; es ist unmoglich, \ndass ich
        sie nicht ineinander iibersetzen kann. \n\nAusdriicke wie \u201ea = a\", oder
        von diesen abge- \nleitete, sind weder Elementarsatze, noch sonst sinn- \nvolle
        Zeichen. (Dies wird sich spater zeigen.) \n\n4.25 Ist der Elementarsatz wahr,
        so besteht der \nSachverhalt ; ist der Elementarsatz falsch, so be- \nsteht
        der Sachverhalt nicht. \n\n4.26 Die Angabe aller wahren Elementarsatze be-
        \nschreibt die Welt vollstandig. Die Welt ist \nvollstandig beschrieben durch
        die Angaben aller \nElementarsatze plus der Angabe, welche von ihnen \nwahr
        und welche falsch sind. \n\n4.27 Bezuglich des Bestehens und Nichtbestehens
        von \n\nn Sachverhalten gibt es Kn = 2 ( \" ) Moglichkeiten. \n\nEs konnen
        alle Kombinationen der Sachverhalte \nbestehen, die andern nicht bestehen.
        \n\n4.28 Diesen Kombinationen entsprechen ebenso viele \nMoglichkeiten der
        Wahrheit \u2014 und Falschheit \u2014 von \nn Elementarsatzen. \n\n4.3 Die
        Wahrheitsmoglichkeiten der Elementarsatze \n\nbedeuten die Moglichkeiten des
        Bestehens und \nNichtbestehens der Sachverhalte. \n\n90 \n\n"},{"name":94,"value":"TRACTATUS
        LOGICO-PHILOSOPHICUS \n\n\u2014(like Russell) in the form ''''a^b Def.\".
        A \ndefinition is a symbolic rule.) \n\n4.242 Expressions of the form **<2
        = ^''* are therefore only \nexpedients in presentation : They assert nothing
        \nabout the meaning of the signs ** ^z \" and ** ^ \". \n\n4.243 Can we understand
        two names without know- \ning whether they signify the same thing or two \ndifferent
        things? Can we understand a proposition \nin which two names occur, without
