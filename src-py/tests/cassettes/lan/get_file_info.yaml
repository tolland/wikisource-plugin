        allgemeinen Urzeichen nicht \n\n124 \n\n"},{"name":128,"value":"TRACTATUS
        LOGICO-PHILOSOPHICUS \n\n(Thus in the ** Principia Mathematica\" of \nRussell
        and Whitehead there occur definitions \nand primitive propositions in words.
        Why sud- \ndenly words here? This would need a justifica- \ntion. There was
        none, and can be none for the \nprocess is actually not allowed.) \n\nBut
        if the introduction of a new expedient has \nproved necessary in one place,
        we must immedi- \nately ask : Where is this expedient always to be \nused?
        Its position in logic must be made \nclear. \n\n5.453 All numbers in logic
        must be capable of \njustification. \n\nOr rather it must become plain that
        there are \nno numbers in logic. \n\nThere are no pre-eminent numbers. \n\n5.454
        In logic there is no side by side, there can be \nno classification. \n\nIn
        logic there cannot be a more general and a \nmore special. \n5.4541 The solution
        of logical problems must be neat \nfor they set the standard of neatness.
        \n\nMen have always thought that there must be a \nsphere of questions whose
        answers \u2014 a priori \u2014 \nare symmetrical and united into a closed
        regular \nstructure. \n\nA sphere in which the proposition, simplex \nsigillum
        veri, is valid. \n\n5.46 When we have rightly introduced the logical \n\nsigns,
        the sense of all their combinations has been \nalready introduced with them
        : therefore not only \n**/v^\"butalso **^(/v^^)*'', etc. etc. We should \nthen
        already have introduced the effect of all \npossible combinations of brackets
        ; and it would \nthen have become clear that the proper general \nprimitive
        signs are not **/v^\", ** (a^r)./^\", etc., \n\n125 \n\n"},{"name":129,"value":"LOGISCH-PHILOSOPHISCHE
