        es zwei Werte, so ist N(^)= ''^ p . ''^ q (weder \np noch q). \n\n5. 511 Wie
        kann die allumfassende, weltspiegelnde \nLogik so spezielle Haken und Manipulationen
        \ngebrauchen? Nur, indem sich alle diese zu einem \nunendlich feinen Netzwerk,
        zudem grossen Spiegel, \nverkniipfen. \n\n5.512 \u201e ^ p\" ist wahr, wenn
        \u201ep\" falsch ist. Also in \ndem wahren Satz \u201e *\u2022 p\" ist \u201ep''*
        ein falscher Satz. \nWie kann ihn nun der Strich \u201e ^^ \" mit der Wirk-
        \nlichkeit zum Stimmen bringen? \n\nDas, was in \u201e ^ p\" verneint, ist
        aber nicht das \n\u201e ''^ \", sondern dasjenige, was alien Zeichen dieser
        \nNotation, welche p verneinen, gemeinsam ist. \n\nAlso die gemeinsame Regel,
        nach welcher \n\n\u201e ^ p\", \u00bb ^ ^ P\", \u201e ^ p V -'' p\", \u201e
        -'' p . -^ p\", etc. etc. \n\n(ad inf.) gebildet werden. Und dies Gemeinsame
        \nspiegelt die Verneinung wieder. \n\n5.513 Man konnte sagen : Das Gemeinsame
        allerSym- \nbole, die sowohl p als q bejahen, ist der Satz \n\u201ep . q\".
        Das Gemeinsame aller Symbole, die \nentweder p oder q bejahen, ist der Satz
        \u201epvq\". \n\nUnd so kann man sagen : Zwei Satze sind \neinander entgegengesetzt,
        wenn sie nichts mitei- \nnander gemein haben, und : Jeder Satz hat nur ein
        \nNegativ, weil es nur einen Satz gibt, der ganz \nausserhalb seiner liegt.
        \n\n132 \n\n"},{"name":136,"value":"TRACTATUS LOGICO-PHILOSOPHICUS \n\nterms
        of the expression in brackets are all the \nterms of a formal series. \n\n5.502
        Therefore I write instead of **( T) \n\n(^, ....)\", -N(|)\". \n\nN (^) is
