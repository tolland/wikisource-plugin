        Denn wir sehen eben \nwirklich zwei verschiedene Tatsachen. \n\n(Sehe ich
        erst auf die Ecken a und nur fliichtig \nauf b, so erscheint a vorne ; und
        umgekehrt.) \n5.55 Wir miissen nun die Frage nach alien moglichen \n\nFormen
        der Elementarsatze a priori beantworten. \n\nDer Elementarsatz besteht aus
        Namen. Da wir \naber die Anzahl der Namen von verschiedener \nBedeutung nicht
        angeben k6nnen, so kSnnen wir \nauch nicht die Zusammensetzung des Elementar-
        \nsatzes angeben. \n\n5.551 Unser Grundsatz ist, dass jede Frage, die sich
        \niiberhaupt durch die Logik entscheiden lasst, sich \nohne weiteres entscheiden
        lassen muss. \n\n(Und wenn wir in die Lage kommen, ein solches \nProblem durch
        Ansehen der Welt beantworten zu \nmiissen, so zeigt dies, dass wir auf grundfalscher
        \nFahrte sind.) \n\n5.552 Die \u201eErfahrung\", die wir zum Verstehen der
        \nLogik brauchen, ist nicht die, dass sich etwas so \nund so verhalt, sondern,
        dass etwas ist: aber das \nist eben k e i n e Erfahrung. \n\nDie Logik ist
        vor jeder Erfahrung \u2014 dass etwas \ns o ist. \n\nSie ist vor dem Wie,
        nicht vor dem Was. \n144 \n\n"},{"name":148,"value":"TRACTATUS LOGICO-PHILOSOPHICUS
        \n\nits constituents are combined in such and such a \nway. \n\nThis perhaps
        explains that the figure \n\n5 b \n\na \n\naj \n\na \n\na \n\ncan be seen
        in two ways as a cube ; and all similar \nphenomena. For we really see two
        different facts. \n\n(If I fix my eyes first on the corners a and only \nglance
        at ^, a appears in front and b behind, and \nvice versa.) \n5-55 We must now
        answer a priori the question \n\nas to all possible forms of the elementary
        pro- \npositions. \n\nThe elementary proposition consists of names. \nSince
        we cannot give the number of names with \ndifferent meanings, we cannot give
        the composition \nof the elementary proposition. \n\n5.551 Our fundamental
        principle is that every question \nwhich can be decided at all by logic can
        be decided \noff-hand. \n\n(And if we get into a situation where we need \nto
        answer such a problem by looking at the world, \nthis shows that we are on
        a fundamentally wrong \ntrack.) \n\n5.552 The ** experience \" which we need
        to under- \nstand logic is not that such and such is the \ncase, but that
        something is ; but that is no experi- \nence. \n\nhogic precedes every experience
        \u2014 that something \nis so. \n\nIt is before the How, not before the WHat.
        \n145 K \n\n"},{"name":149,"value":"LOGISCH-PHILOSOPHISCHE ABHANDLUNG \n\n5.5521
        Und wenn dies nicht so ware, wie konnten wir \ndie Logik anwenden? Man kOnnte
        sagen : Wenn \nes eine Logik gabe, auch wenn es keine Welt gabe, \nwie konnte
        es dann eine Logik geben, da es eine \nWelt gibt. \n\n5*553 Russell sagte,
        es gabe einfache Relationen \n\nzwischen verschiedenen Anzahlen von Dingen
        \n(Individuals). Aber zwischen welchen Anzahlen ? \nUnd wie soil sich das
        entscheiden? \u2014 Durch die \nErfahrung ? \n\n(Eine ausgezeichnete Zahl
        gibt es nicht.) \n\n5.554 Die Angabe jeder speziellen Form ware voll- \nkommen
        willkiirlich. \n\n5.5541 Es soil sich a priori angeben lassen, ob ieh z. B.
        \nin die Lage kommen kann, etwas mit dem \nZeichen einer 27-stelligen Relation
        bezeichnen zu \nmiissen. \n\n5.5542 Diirfen wir denn aber iiberhaupt so fragen?
        \nKonnen wir eine Zeichenform aufstellen und nicht \nwissen, ob ihr etwas
        entsprechen konne? \n\nHat die Frage einen Sinn: Was muss sein, \ndamit etwas
        der-Fall-sein kann? \n\n5.555 Es ist klar, wir haben vom Elementarsatz einen
        \nBegriff, abgesehen von seiner besonderen logischen \nForm. \n\nWo man aber
        Symbole nach einem System \nbilden kann, dort ist dieses System das logisch
        \nwichtige und nicht die einzelnen Symbole. \n\nUnd wie ware es auch moglich,
        dass ich es in \nder Logik mit Formen zu tun hatte, die ich erfinden \nkann
        ; sondern mit dem muss ich es zu tun haben, \nwas es mir moglich macht, sie
        zu erfinden. \n\n5.556 Eine Hierarchic der Formen der Elementar- \nsatze kann
        es nicht geben. Nur was wir selbst \nkonstruieren, konnen wir voraussehen.
        \n\n5.5561 Die empirische Realitat ist begrenzt durch die \nGesamtheit der
        Gegenstande. Die Grenze zeigt \nsich wieder in der Gesamtheit der Elementarsatze.
        \n\n146 \n\n"},{"name":150,"value":"TRACTATUS LOGICO-PHILOSOPHICUS \n\n5.5521
        And if this were not the case, how could \nwe apply logic? We could say: if
        there \nwere a logic, even if there were no world, \nhow then could there
        be a logic, since there is a \nworld ? \n\n5.553 Russell said that there were
        simple relations \nbetween different numbers of things (individuals). \nBut
        between what numbers? And how should \nthis be decided \u2014 by experience
        ? \n\n(There is no pre-eminent number.) \n\n5.554 The enumeration of any special
        forms would \nbe entirely arbitrary. \n\n5.5541 How could we decide a priori
        whether, for \nexample, I can get into a situation in which I need \nto symbolize
        with a sign of a 27-termed relation ? \n\n5.5542 May we then ask this at all?
        Can we set out \na sign form and not know whether anything can \ncorrespond
        to it? \n\nHas the question sense : what must there be \nin order that anything
        can be the case ? \n5-555 ^^ *^ clear that we have a concept of the \n\nelementary
        proposition apart from its special \nlogical form. \n\nWhere, however, we
        can build symbols \naccording to a system, there this system is the \nlogically
        important thing and not the single \nsymbols. \n\nAnd how would it be possible
        that I should \nhave to deal with forms in logic which I can \ninvent: but
        I must have to deal with that which \nmakes it possible for me to invent them.
        \n5.556 There cannot be a hierarchy of the forms of the \n\nelementary propositions.
        Only that which we \nourselves construct can we foresee. \n5.5561 Empirical
        reality is limited by the totality of \nobjects. The boundary appears again
        in the \ntotality of elementary propositions. \n\n147 \n\n"},{"name":151,"value":"LOGISCH-PHILOSOPHISCHE
        ABHANDLUNG \n\nDie Hierarchien sind, und mussen unabhangig \nvon der Realitat
        sein. \n5.5562 Wissen wir aus rein logischen Griinden, dass \nes Elementarsatze
        geben muss, dann muss es jeder \nwissen, der die Satze in ihrer unanalysierten
        Form \nversteht. \n5*5563 ^^^^ Satze unserer Umgangssprache sind tatsach-
        \nlich, so wie sie sind, logisch voUkommen geordnet. \n\u2014 Jenes Einfachste,
        was wir hier angeben sollen, \nist nicht ein Gleichnis der Wahrheit, sondern
        die \nvoile Wahrheit selbst. \n\n(Unsere Probleme sind nicht abstrakt, sondern
        \nvielleicht die konkretesten, die es gibt.) \n5*557 ^^^ Anwendung der Logik
        entscheidet \n\ndariiber, welche Elementarsatze es gibt. \n\nWas in der Anwendung
        liegt, kann die Logik \nnicht vorausnehmen. \n\nDas ist klar : Die Logik darf
        mit ihrer Anwen- \ndung nicht kollidieren. \n\nAber die Logik muss sich mit
        ihrer Anwendung \nberiihren. \n\nAlso diirfen die Logik und ihre Anwendung
        \n\neinander nicht libergreifen. \n\n5-5571 Wenn ich die Elementarsatze nicht
        a priori \n\nangeben kann, dann muss es zu ofFenbarem Unsinn \n\nfiihren,
        sie angeben zu woUen. \n\n5.6 DieGrenzenmeinerSprache bedeuten \n\ndie Grenzen
        meiner Welt. \n5.61 Die Logik erfiillt die Welt ; die Grenzen der \n\nWelt
        sind auch ihre Grenzen. \n\nWir konnen also in der Logik nicht sagen : Das
        \nund das gibt es in der Welt, jenes nicht. \n\nDas wiirde namlich scheinbar
        voraussetzen, dass \nwir gewisse Moglichkeiten ausschliessen und dies \nkann
        nicht der Fall sein, da sonst die Logik \nliber die Grenzen der Welt hinaus
        miisste ; wenn \nsie namlich diese Grenzen auch von der anderen \nSeite betrachten
        konnte. \n\n148 \n\n"},{"name":152,"value":"TRACTATUS LOGICO-PHILOSOPHICUS
        \n\nThe hierarchies are and must be independent \nof reality. \n\n5.5562 If
        we know on purely logical grounds, that \nthere must be elementary propositions,
        then this \nmust be known by everyone who understands \npropositions in their
        unanalysed form. \n\n5*55^3 ^^^ propositions of our colloquial language are
        \nactually, just as they are, logically completely \nin order. That simple
        thing which we ought to \ngive here is not a model of the truth but the complete
        \ntruth itself. \n\n(Our problems are not abstract but perhaps the \nmost
        concrete that there are.) \n\n5''557 The application of logic decides what
        elementary \n\npropositions there are. \n\nWhat lies in its application logic
        cannot anticipate. \n\nIt is clear that logic may not conflict with its \napplication.
        \n\nBut logic must have contact with its application. \n\nTherefore logic
        and its application may not \noverlap one another. \n\n5.5571 If I cannot
        give elementary propositions a \npriori then it must lead to obvious nonsense
        to \ntry to give them. \n\n5.6 The limits of my language mean the limits of
        my \n\nworld. \n\n5.61 Logic fills the world : the limits of the world \n\nare
        also its limits. \n\nWe cannot therefore say in logic : This and \nthis there
        is in the world, that there is not. \n\nFor that would apparently presuppose
        that we \nexclude certain possibilities, and this cannot be \nthe case since
        otherwise logic must get outside \nthe limits of the world : that is, if it
        could \nconsider these limits from the other side \nalso. \n\n149 \n\n"},{"name":153,"value":"LOGISCH-PHILOSOPHISCHE
        ABHANDLUNG \n\nWas wir nicht denken konnen, das konnen wir \nnicht denken
        ; wir konnen also auch nicht s a g e n, \nwas wir nicht denken konnen. \n\n5.62
        Diese Bemerkung gibt den Schliissel zur \nEntscheidung der Frage, inwieweitder
        Solipsismus \neine Wahrheit ist. \n\nWas der Solipsismus namlich m e i n t,
        ist ganz \nrichtig, nur lasst es sich nicht sagen, sondern es \nzeigt sich.
        \n\nDass dieWeltm eine Welt istjdaszeigtsichdarin, \ndass die Grenzen der
        Sprache(der Sprache,dieallein \nich verstehe) die Grenzen m e i n e r Welt
        bedeuten. \n5.621 Die Welt und das Leben sind Kins. \n\n5.63 Ich bin meine
        Welt. (Der Mikrokosmos.) \n\n5.631 Das denkende,vorstellende,Subjekt gibt
        esnicht \nWenn ich ein Buch schriebe \u201eDie Welt, wie ich \n\nsie vorfand\",
        so ware darin auch iiber meinen Leib \nzu berichten und zu sagen, welche Glieder
        meinem \nWillen unterstehen und welche nicht etc., dies ist \nnamlich eine
        Methode, das Subjekt zu isolieren, \noder vielmehr zu zeigen, dass es in einem
        wichtigen \nSinne kein Subjekt gibt: Von ihm allein namlich \nkonnte in diesem
        Buche nicht die Rede sein. \u2014 \n\n5.632 Das Subjekt gehort nicht zur Welt,
        sondern es \nist eine Grenze der Welt. \n\n5.633 Wo in der Welt ist ein metaphysisches
        Subjekt \nzu merken? \n\nDu sagst, es verhalt sich hier ganz, wie mit Auge
        \nund Gesichtsfeld. Aber das Auge siehst du wirklich \nnicht. \n\nUnd nichts
        am Gesichtsfeld lasst darauf \nschliessen, dass es von einem Auge gesehen
        wird. \n5.6331 Das Gesichtsfeld hat namlich nicht etwa eine \n\nsolche Form
        : \n\n150 \n\n"},{"name":154,"value":"TRACTATUS LOGICO-PHILOSOPHICUS \n\nWhat
        we cannot think, that we cannot think : \nwe cannot therefore say what we
        cannot \nthink. \n\n5.62 This remark provides a key to the question, to \nwhat
        extent solipsism is a truth. \n\nIn fact what solipsism meansy is quite correct,
