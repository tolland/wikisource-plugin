        Die Darwinsche Theorie hat mit der Philosophic \nnicht mchr zu schaffen, als
        irgend eine andcre \nHypothese der Naturwissenschaft. \n\n4. 113 Die Philosophic
        begrenzt das bestrcitbarc \nGebict der Naturwissenschaft. \n\n4. 114 Sic soil
        das Denkbare abgrcnzcn und damit das \nUndenkbarc. \n\nSic soil das Undenkbarc
        von innen durch das \nDenkbare begrenzen. \n\n4. 115 Sic wird das Unsagbare
        bedeuten, indem sie \ndas Sagbare klar darstellt. \n\n4. 116 Allcs was iiberhaupt
        gedacht werden kann, \n\n76 \n\n"},{"name":80,"value":"TRACTATUS LOGICO-PHILOSOPHICUS
        \n\nwhich stands above or below, but not beside the \nnatural sciences.) \n4.
        112 The object of philosophy is the logical clarifica- \n\ntion of thoughts.
        \n\nPhilosophy is not a theory but an activity. \n\nA philosophical work consists
        essentially of \nelucidations. \n\nThe result of philosophy is not a number
        of \n** philosophical propositions \", but to make proposi- \ntions clear.
        \n\nPhilosophy should make clear and delimit \nsharply the thoughts which
        otherwise are, as it \nwere, opaque and blurred. \n\n4.II21 Psychology is
        no nearer related to philosophy, \nthan is any other natural science. \n\nThe
        theory of knowledge is the philosophy of \npsychology. \n\nDoes not my study
        of sign-language correspond \nto the study of thought processes which philosophers
        \nheld to be so essential to the philosophy of logic? \nOnly they got entangled
        for the most part in un- \nessential psychological investigations, and there
        \nis an analogous danger for my method. \n\n4.1122 The Darwinian theory has
        no more to do with \nphilosophy than has any other hypothesis of natural \nscience.
        \n\n4. 113 Philosophylimitsthe disputable sphere of natural \nscience. \n\n4.
        114 It should limit the thinkable and thereby the \nunthinkable. \n\nIt should
        limit the unthinkable from within \nthrough the thinkable. \n\n4. 115 It will
        mean the unspeakable by clearly dis- \nplaying the speakable. \n\n4. 116 Everything
        that can be thought at all can be \n\n"},{"name":81,"value":"LOGISCH-PHILOSOPHISCHE
        ABHANDLUNG \n\nkann klar gedacht werden. Alles was sich aus- \nsprechen lasst,
        lasst sich klar aussprechen. \n4.12 Der Satz kann die gesamte Wirklichkeit
        dar- \n\nstellen, aber er kann nicht das darstellen, was er \nmit der Wirklichkeit
        gemein haben muss, um sie \ndarstellen zu konnen \u2014 die logische Form.
        \n\nUm die logische Form darstellen zu konnen, \nmiissten wir uns mit dem
        Satze ausserhalb der \nLogik aufstellen konnen, das heisst ausserhalb der
        \nWelt. \n\n4. 121 Der Satz kann die logische Form nicht darstellen, \nsie
        spiegelt sich in ihm. \n\nWas sich in der Sprache spiegelt, kann sie \nnicht
        darstellen. \n\nWas sich in der Sprache ausdriickt, konnen \nw i r nicht durch
        sie ausdriicken. \n\nDer Satz z e i g t die logische Form der Wirk- \nlichkeit.
        \n\nEr weist sie auf. \n\n4.1211 So zeigt ein Satz \u201efa\", dass in seinem
        Sinn der \nGegenstand a vorkommt, zwei Satze \u201efa\" und \u201ega''*, \ndass
        in ihnen beiden von demselben Gegenstand \ndie Rede ist. \n\nWenn zwei Satze
        einander widersprechen, so \nzeigt dies ihre Struktur ; ebenso, wenn einer
        aus \ndem anderen folgt. U.s.w. \n\n4. 1212 Was gezeigt werden kann, kann
        nicht gesagt \nwerden. \n\n4.1213 Jetzt verstehen wir auch unser Gefiihl :
        dass wir \nim Besitze einer richtigen logischen Auffassung \nseien, wenn nur
        einmal alles in unserer Zeichen- \nsprache stimmt. \n\n4.122 Wir konnen in
        gewissem Sinne von formalen \nEigenschaften der Gegenstande und Sachverhalte
        \nbezw. von Eigenschaften der Struktur der Tat- \nsachen reden und in demselben
        Sinne von formalen \nRelationen und Relationen von Strukturen. \n\n(Statt
        Eigenschaft der Struktur sage ich auch \n\n78 \n\n"},{"name":82,"value":"TRACTATUS
        LOGICO-PHILOSOPHICUS \n\nthought clearly. Everything that can be said can
        \nbe said clearly. \n4.12 Propositions can represent the whole reality, \n\nbut
        they cannot represent what they must have in \ncommon with reality in order
        to be able to repre- \nsent it \u2014 the logical form. \n\nTo be able to
        represent the logical form, we \nshould have to be able to put ourselves with
        the \npropositions outside logic, that is outside the \nworld. \n4. 121 Propositions
        cannot represent the logical form : \n\nthis mirrors itself in the propositions.
        \n\nThat which mirrors itself in language, language \ncannot represent. \n\nThat
        which expresses itself in language, we \ncannot express by language. \n\nThe
        propositions show the logical form of reality. \n\nThey exhibit it. \n\n4.1211
        Thus a proposition ^^fa \" shows that in its sense \nthe object a occurs,
        two propositions **/^\" and \n^^ ga^^ that they are both about the same object.
        \n\nIf two propositions contradict one another, this \nis shown by their structure
        ; similarly if one follows \nfrom another, etc. \n\n4.1212 What can be shown
        cannot be said. \n\n4.1213 Now we understand our feeling that we are in \npossession
        of the right logical conception, if only \nall is right in our symbolism.
        \n\n4.122 We can speak in a certain sense of formal \n\nproperties of objects
        and atomic facts, or of pro- \nperties of the structure of facts, and in the
        same \nsense of formal relations and relations of \nstructures. \n\n(Instead
        of property of the structure I also say \n79 \n\n"},{"name":83,"value":"LOGISCH-PHILOSOPHISCHE
        ABHANDLUNG \n\n\u201einterne Eigenschaft\" ; statt Relation der Struk- \nturen
        \u201einterne Relation''''. \n\nIch fiihre diese Ausdriicke ein, um den Grund
        \nder, bei den Philosophen sehr verbreiteten Ver- \nwechslung zwischen den
        internen Relationen und \nden eigentlichen (externen) Relationen zu zeigen.)
        \n\nDas Bestehen solcher interner Eigenschaften \nund Relationen kann aber
        nicht durch Satze \nbehauptet werden, sondern es zeigt sich in den \nSatzen,
        welche jene Sachverhalte darstellen und \nvon jenen Gegenstanden handeln.
        \n4.1221 Eine interne Eigenschaft einer Tatsache konnen \nwir auch einen Zug
        dieser Tatsache nennen. (In \ndem Sinn, in welchem wir etwa von Gesichtsziigen
        \nsprechen.) \n\n4.123 Eine Eigenschaft ist intern, wenn es undenkbar \nist,
        dass ihr Gegenstand sie nicht besitzt. \n\n(Diese blaue Farbe und jene stehen
        in der \ninternen Relation von heller und dunkler eo ipso. \nEs ist undenkbar,
        dass diese beiden Gegenstande \nnicht in dieser Relation stunden.) \n\n(Hier
        entspricht dem schwankenden Gebrauch \nder Worte \u201eEigenschaft\" und \u201eRelation\"
        der \nschwankende Gebrauch des Wortes \u201eGegenstand\".) \n\n4.124 Das Bestehen
        einer internen Eigenschaft einer \nmoglichen Sachlage wird nicht durch einen
        Satz \nausgedriickt, sondern es driickt sich in dem sie \ndarstellenden Satz,
        durch eine interne Eigenschaft \ndieses Satzes aus. \n\nEs ware ebenso unsinnig,
        dem Satze eine \nformale Eigenschaft zuzusprechen, als sie ihm \nabzusprechen.
        \n4.1241 Formen kann man nicht dadurch von einander \nunterscheiden, dass
        man sagt, die eine habe diese, \ndie andere aber jene Eigenschaft ; denn dies
        setzt \nvoraus, dass es einen Sinn habe, beide Eigen- \nschaften von beiden
        Formen auszusagen. \n\n4.125 Das Bestehen einer internen Relation zwischen
        \n\n80 \n\n"},{"name":84,"value":"TRACTATUS LOGICO-PHILOSOPHICUS \n\n** internal
        property\"; instead of relation of struc- \ntures ** internal relation \".
        \n\nI introduce these expressions in order to show \nthe reason for the confusion,
        very widespread \namong philosophers, between internal relations \nand proper
        (external) relations.) \n\nThe holding of such internal properties and rela-
        \ntions cannot, however, be asserted by propositions, \nbut it shows itself
        in the propositions, which \npresent the facts and treat of the objects in
        question. \n\n4.1221 An internal property of a fact we also call a \nfeature
        of this fact. (In the sense in which we \nspeak of facial features.) \n\n4.123
        A property is internal if it is unthinkable that \nits object does not possess
        it. \n\n(This blue colour and that stand in the internal \nrelation of brighter
        and darker eo ipso. It is \nunthinkable that these two objects should not
        stand \nin this relation.) \n\n(Here to the shifting use of the words * *
        property ** \nand ** relation\" there corresponds the shifting use \nof the
        word ** object \".) \n\n4.124 The existence of an internal property of a possible
        \nstate of affairs is not expressed by a proposition, \nbut it expresses itself
        in the proposition which \npresents that state of affairs, by an internal
        property \nof this proposition. \n\nIt would be as senseless to ascribe a
        formal \nproperty to a proposition as to deny it the formal \nproperty. \n4.1241
        One cannot distinguish forms from one another \nby saying that one has this
        property, the other \nthat : for this assumes that there is a sense in assert-
        \ning either property of either form. \n\n4.125 The existence of an internal
        relation between \n\n81 F \n\n"},{"name":85,"value":"LOGISCH-PHILOSOPHISCHE
        ABHANDLUNG \n\nmoglichen Sachlagen driickt sich sprachlich durch \neine interne
        Relation zwischen den sie darstellenden \nSatzen aus. \n\n4.1251 Hier erledigt
        sich nun die Streitfrage \u201eob alle \nRelationen intern oder extern\" seien.
        \n\n4.1252 Reihen, welche durch interne Relationen \ngeordnet sind, nenne
        ich Formenreihen. \n\nDie Zahlenreihe ist nicht nach einer externen, \nsondern
        nach einer internen Relation geordnet. \n\nEbenso die Reihe der Satze \u201eaRb\",
        \n\u201e(3x) : aRx . xRb\", \n\u201e(g[x,y) : aRx . xRy . yRb\", u. s. f.
        \n\n(Steht b in einer dieser Beziehungen zu a, so \nnenne ich b einen Nachfolger
        von a.) \n4.126 In dem Sinne, in welchem wir von formalen \n\nEigenschaften
        sprechen, konnen wir nun auch \nvon formalen Begriffen reden. \n\n(Ich fiihre
        diesen Ausdruck ein, um den Grund \nder Verwechslung der formalen Begriffe
        mit den \neigentlichen Begriffen, welche die ganze alte Logik \ndurchzieht,
        klar zu machen.) \n\nDass etwas unter einen formalen Begriff als \ndessen
        Gegenstand fallt, kann nicht durch einen \nSatz ausgedriickt werden. Sondern
        es zeigt sich \nan dem Zeichen dieses Gegenstandes selbst. (Der \nName zeigt,
        dass er einen Gegenstand bezeichnet, \ndas Zahlenzeichen, dass es eine Zahl
        bezeichnet etc.) \n\nDie formalen Begriffe konnen ja nicht, wie \ndie eigentlichen
        Begriffe, durch eine Funktion \ndargestellt werden. \n\nDenn ihre Merkmale,
        die formalen Eigenschaf- \nten, werden nicht durch Funktionen ausgedriickt.
        \n\nDer Ausdruck der formalen Eigenschaft ist ein \nZug gewisser Symbole.
        \n\nDas Zeichen der Merkmale eines formalen \nBegriffes ist also ein charakteristischer
        Zug aller \nSymbole, deren Bedeutungen unter den Begriff \nfallen. \n\n82
        \n\n"},{"name":86,"value":"TRACTATUS LOGICO-PHILOSOPHICUS \n\npossible states
        of affairs expresses itself in language \nby an internal relation between
        the propositions \npresenting them. \n\n4.1251 Now this settles the disputed
        question \" whether \nall relations are internal or external\". \n\n4.1252
        Series which are ordered by internal relations I \ncall formal series. \n\nThe
        series of numbers is ordered not by an \nexternal, but by an internal relation.
        \n\nSimilarly the series of propositions ** aRb^\\ \n\n\" (3Jc,jv) :aRx.xRy.yRV\\
        etc. \n\n(If ^ stands in one of these relations to a^ I call \nb a successor
        of a.) \n4.126 In the sense in which we speak of formal \n\nproperties we
        can now speak also of formal \nconcepts. \n\n(I introduce this expression
        in order to make \nclear the confusion of formal concepts with proper \nconcepts
        which runs through the whole of the old \nlogic.) \n\nThat anything falls
        under a formal concept as \nan object belonging to it, cannot be expressed
        by \na proposition. But it is shown in the symbol for \nthe object itself.
        (The name shows that it signifies \nan object, the numerical sign that it
        signifies a \nnumber, etc.) \n\nFormal concepts cannot, like proper concepts,
        \nbe presented by a function. \n\nFor their characteristics, the formal properties,
        \nare not expressed by the functions. \n\nThe expression of a formal property
        is a feature \nof certain symbols. \n\nThe sign that signifies the characteristics
        of a \nformal concept is, therefore, a characteristic feature \nof all symbols,
        whose meanings fall under the \nconcept. \n\n83 \n\n"},{"name":87,"value":"LOGISCH-PHILOSOPHISCHE
        ABHANDLUNG \n\nDer Ausdruck des formalen Begriffes also, eine \nSatzvariable,
        in welcher nur dieser charakteristische \nZug konstant ist. \n4.127 Die Satzvariable
        bezeichnet den formalen \n\nBegriff und ihre Werte die Gegenstande, welche
        \nunter diesen Begriff fallen. \n\n4.1271 Jede Variable ist das Zeichen eines
        formalen \nBegriffes. \n\nDenn jede Variable stellt eine konstante Form \ndar,
        welche alle ihre Werte besitzen, und die als \nformale Eigenschaft dieser
        Werte aufgefasst werden \nkann. \n\n4.1272 So ist der variable Name \u201ex\"
        das eigentliche \nZeichen des Scheinbegriffes Gegenstand. \n\nWo immer das
        Wort \u201eGegenstand\" (\u201eDing\", \n\u201eSache\", etc.) richtig gebraucht
        wird, wird es in \nder Begriffsschrift durch den variablen Namen \nausgedriickt.
        \n\nZum Beispiel in dem Satz \u201ees gibt 2 Gegen- \nstande, welche . . .\"
        durch \u201e(ax,y) . . .\". \n\nWo immer es anders, also als eigentliches
        \nBegriffswort gebraucht wird, entstehen unsinnige \nScheinsatze. \n\nSo kann
        man z. B. nicht sagen \u201eEs gibt Gegen- \nstande\", wie man etwa sagt \u201eEs
        gibt Bucher\". \nUnd ebenso wenig \u201eEs gibt 100 Gegenstande\", \noder
        \u201eEs gibt N^ Gegenstande\". \n\nUnd es ist unsinnig, von der Anzahl aller
        \nGegenstande zu sprechen. \n\nDasselbe gilt von den Worten ,,Komplex**, \n,,Tatsache*S
        ,,Funktion*S ,,Zahl''*, etc. \n\nSie alle bezeichnen formale Begriffe und
        werden \nin der Begriffsschrift durch Variable, nicht durch \nFunktionen oder
        Klassen dargestellt. (Wie Frege \nund Russell glaubten.) \n\nAusdriicke wie
        ,,i ist eine Zahl**, ,,es gibt nur \nEine NulP* und alle ahnlichen sind unsinnig.
        \n\n(Es ist ebenso unsinnig zu sagen ,,es gibt nur \n\n84 \n\n"},{"name":88,"value":"TRACTATUS
        LOGICO-PHILOSOPHICUS \n\nThe expression of the formal concept is there \nfore
        a prepositional variable in which only this \ncharacteristic feature is constant.
        \n4.127 The prepositional variable signifies the formal \n\nconcept, and its
        values signify the objects which \nfall under this concept. \n\n4.1271 Every
        variable is the sign of a formal \nconcept. \n\nFor every variable presents
        a constant form, \nwhich all its values possess, and which can \nbe conceived
        as a formal property of these \nvalues. \n\n4.1272 So the variable name ^*;\u00bbr\"
        is the proper sign of \nthe pseudo-concept object. \n\nWherever the word \"
        object \" (\" thing \", \" entity \", \netc.) is rightly used, it is expressed
        in logical \nsymbolism by the variable name. \n\nFor example in the proposition
        ** there are two \nobjects which . . .\", by ^^3^,^) . . .**. \n\nWherever
        it is used otherwise, i,e, as a proper \nconcept word, there arise senseless
        pseudo- \npropositions. \n\nSo one cannot, e,g, say *^ There are objects''*
        \nas one says ** There are books\". Nor ** There \nare 100 objects\" or **
        There are K^ objects\". \n\nAnd it is senseless to speak of the number of
        all \nobjects. \n\nThe same holds of the words ** Complex\", \n'''' Fact\",
        '''' Function \", '''' Number\", etc. \n\nThey all signify formal concepts
        and are \npresented in logical symbolism by variables, not \nby functions
        or classes (as Frege and Russell \nthought). \n\nExpressions like **i is a
        number\", ** there is \nonly one number nought\", and all like them are \nsenseless.
        \n\n(It is as senseless to say, ** there is only one i \" \n\n85 \n\n"},{"name":89,"value":"LOGISCH-PHILOSOPHISCHE
