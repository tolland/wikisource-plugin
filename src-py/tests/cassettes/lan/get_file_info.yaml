        ist der Philosophic nicht ver- \nwandter als irgend cine andcre Naturwissen-
        \nschaft. \n\nErkcnntnistheorie ist die Philosophic der \nPsychologic. \n\nEntspricht
        nicht mein Studium der Zeichen- \nsprache dem Studium der Denkprozesse, welches
