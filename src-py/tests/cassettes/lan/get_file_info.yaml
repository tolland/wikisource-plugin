        the arguments of \nfunctions with the indices of names. For I \nrecognize
        the meaning of the sign containing it \nfrom the argument just as much as
        from the \nindex. \n\nIn RusselFs \" -\\-c\\ for example, ** c \" fs an \nindex
        which indicates that the whole sign is the \naddition sign for cardinal numbers.
        But this way \nof symbolizing depends on arbitrary agreement, \nand one could
        choose a simple sign instead of \n** +/'': but in \" ^/\" <*/\" is not an
        index but \nan argument ; the sense of ** ''\u2022^ \" cannot be under- \nstood,
