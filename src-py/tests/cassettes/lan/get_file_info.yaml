        \n\n(just as the musical theme is not a mixture of \ntones). \n\nThe proposition
        is articulate. \n\n3.142 Only facts can express a sense, a class of names
        \ncannot. \n\n3.143 That the propositional sign is a fact is concealed \nby
        the ordinary form of expression, written or \nprinted. \n\n(For in the printed
        proposition, for example, the \nsign of a proposition does not appear essentially
        \ndifferent from a word. Thus it was possible for \nFrege to call the proposition
        a compounded \nname.) \n\n3.1431 The essential nature of the propositional
        sign \nbecomes very clear when we imagine it made up \nof spatial objects
        (such as tables, chairs, books) \ninstead of written signs. \n\nThe mutual
        spatial position of these things then \nexpresses the sense of the proposition.
        \n\n3.1432 We must not say, **The complex sign ^ aRb^ \nsays * a stands in
        relation R to ^ '' \" ; but we must \nsay, ** That * a^ stands in a certain
        relation to *^'' \nsays tkat aRb \". \n\n3.144 States of affairs can be described
        but not \nnamed. \n\n(Names resemble points ; propositions resemble \narrows,
        they have sense.) \n3.2 In propositions thoughts can be so expressed \n\nthat
        to the objects of the thoughts correspond the \nelements of the propositional
        sign. \n\n3.201 These elements I call ** simple signs\" and the \nproposition
        ''* completely analysed \". \n\n3.202 The simple signs employed in propositions
        are \ncalled names. \n\n3.203 The name means the object. The object is its
        \nmeaning. (** A \" is the same sign as *'' -<4 \".) \n\n3.21 To the configuration
        of the simple signs in the \n\n47 \n\n"},{"name":51,"value":"LOGISCH-PHILOSOPHISCHE
        ABHANDLUNG \n\nSatzzeichen entspricht die Konfiguration der Ge- \ngenstande
        in der Sachlage. \n\n3.22 Der Name vertritt im Satz den Gegenstand. \n3.221
        DieGegenstandekannichnur nennen. Zeichen \n\nvertreten sie. Ich kann nur von
        ihnen sprechen, \nsie aussprechen kann ich nicht. Ein Satz \nkann nur sagen,
        wie ein Ding ist, nicht was es ist. \n\n3.23 Die Forderung der Moglichkeit
        der einfachen \nZeichen ist die Forderung der Bestimmtheit des \nSinnes. \n\n3.24
        Der Satz, welcher vom Komplex handelt, steht \nin interner Beziehung zum Satze,
        der von dessen \nBestandteil handelt. \n\nDer Komplex kann nur durch seine
        Beschrei- \nbung gegeben sein, und diese wird stimmen oder \nnicht stimmen.
        Der Satz, in welchem von einem \nKomplex die Rede ist, wird, wenn dieser nicht
        \nexistiert, nicht unsinnig,sondern einfach falsch sein. \n\nDassein Satzelement
        einen Komplex bezeichnet, \nkann man aus einer Unbestimmtheit in den Satzen
        \nsehen, worin es vorkommt. Wir wissen, durch \ndiesen Satz ist noch nicht
        alles bestimmt. (Die \nAllgemeinheitsbezeichnung enthalt jaein Urbild.) \n\nDie
        Zusammenfassung des Symbols eines Kom- \nplexes in ein einfaches Symbol kann
        durch eine \nDefinition ausgedriickt werden. \n\n3.25 Es gibt eine und nur
        eine vollstandige Analyse \ndes Satzes. \n\n3.251 Der Satz driickt auf bestimmte,
        klar angebbare \n\nWeise aus, was er ausdriickt : Der Satz ist artiku- \nliert.
        \n\n3.26 Der Name ist durch keine Definition weiter zu \nzergliedern : er
        ist ein Urzeichen. \n\n3.261 Jedes definierte Zeichen bezeichnet iiber jene
        \n\nZeichen, durch welche es definiert wurde ; und die \nDefinitionen weisen
        den Weg. \n\nZwei Zeichen, ein Urzeichen, und ein durch \nUrzeichen definiertes,
        konnen nicht auf dieselbe \n\n48 \n\n"},{"name":52,"value":"TRACTATUS LOGICO-PHILOSOPHICUS
        \n\nprepositional sign corresponds the configuration \nof the objects in the
        state of affairs. \n\n3.22 In the proposition the name represents the object.
        \n3.221 Objects I can only name. Signs represent them. \n\nI can only speak
        of them. I cannot assert them, \nA proposition can only say how a thing is,
        not \nwhat it is. \n\n3.23 The postulate of the possibility of the simple
        \nsigns is the postulate of the determinateness of \nthe sense. \n\n3.24 A
        proposition about a complex stands in \ninternal relation to the proposition
        about its \nconstituent part. \n\nA complex can only be given by its description,
        \nand this will either be right or wrong. The pro- \nposition in which there
        is mention of a complex, \nif this does not exist, becomes not nonsense but
        \nsimply false\u00ab \n\nThat a prepositional element signifies a complex
        \ncan be seen from an indeterminateness in the pro- \npositions in which it
        occurs. We know that every- \nthing is not yet determined by this proposition.
        \n(The notation for generality contains a, prototype.) \n\nThe combination
        of the symbols of a complex \nin a simple symbol can be expressed by a defini-
        \ntion. \n\n3.25 There is one and only one complete analysis of \nthe proposition.
        \n\n3.251 The proposition expresses what it expresses in \n\na definite and
        clearly specifiable way : the pro- \nposition is articulate. \n\n3.26 The
        name cannot be analysed further by any \ndefinition. It is a primitive sign.
        \n\n3.261 Every defined sign signifies via those signs \n\nby which it is
        defined, and the definitions show \nthe way. \n\nTwo signs, one a primitive
        sign, and one \ndefined by primitive signs, cannot signify in the \n\n49 D
        \n\n"},{"name":53,"value":"LOGISCH-PHILOSOPHISCHE ABHANDLUNG \n\nArt und Weise
        bezeichnen. Namen kann man \nnicht durch Definitionen auseinanderlegen. (Kein
        \nZeichen, welches allein, selbstandig eine Bedeutung \nhat) \n\n3.262 Was
        in den Zeichen nicht zum Ausdruck kommt, \ndas zeigt ihre Anwendung. Was die
        Zeichen \nverschlucken, das spricht ihre Anwendung aus. \n\n3.263 Die Bedeutungen
        von Urzeichen konnen durch \nErlauterungen erklart werden. Erlauterungen \nsind
        Satze, welche die Urzeichen enthalten. Sie \nkonnen also nur verstanden werden,
        wenn die \nBedeutungen dieser Zeichen bereits bekannt sind. \n\n3.3 Nur derSatz
        hat Sinn ; nur im Zusammenhange \n\ndes Satzes hat ein Name Bedeutung. \n3.31
        jeden Teil des Satzes, der seinen Sinn charak- \n\nterisiert, nenne ich einen
        Ausdruck (ein Symbol). \n(Der Satz selbst ist ein Ausdruck.) \nAusdruck ist
        alles, fiir den Sinn des Satzes \n\nwesentliche, was Satze miteinander gemein
        haben \n\nkonnen. \n\nDer Ausdruck kennzeichnet eine Form und \n\neinen Inhalt.
        \n\n3. 311 Der Ausdruck setzt die Formen aller Satze \nvoraus, in welchen
        er vorkommen kann. Er ist \ndas gemeinsame charakteristische Merkmal einer
        \nKlasse von Satzen. \n\n3.312 Er wird also dargestellt durch die allgemeine
        \nForm der Satze, die er charakterisiert. \n\nUnd zwar wird in dieser Form
        der Ausdruck \nkonstant und alles librige v a r i a b e 1 sein. \n\n3.313
        Der Ausdruck wird also durch eine Variable \ndargestellt, deren Werte die
        Satze sind, die den \nAusdruck enthalten. \n\n(Im Grenzfall wird die Variable
        zur Konstanten, \nder Ausdruck zum Satz.) \n\nIch nenne eine solche Variable
        \u201eSatzvariable\". \n\n3.314 Der Ausdruck hat nur im Satz Bedeutung. \nJede
        Variable lasst sich als Satzvariable auffassen. \n\n50 \n\n"},{"name":54,"value":"TRACTATUS
        LOGICO-PHILOSOPHICUS \n\nsame way. Names cannot be taken to pieces by \ndefinition
        (nor any sign which alone and independ- \nently has a meaning). \n\n3.262
        What does not get expressed in the sign is \nshown by its application. What
        the signs conceal, \ntheir application declares. \n\n3.263 The meanings of
        primitive signs can be \nexplained by elucidations. Elucidations are pro-
        \npositions which contain the primitive signs. They \ncan, therefore, only
        be understood when the \nmeanings of these signs are already known. \n\n3.3
        Only the proposition has sense ; only in the \n\ncontext of a proposition
        has a name meaning. \n3.31 Every part of a proposition which characterizes
        \n\nits sense I call an expression (a symbol) \n(The proposition itself is
        an expression.) \nExpressions are everything \u2014 essential for the \nsense
        of the proposition \u2014 that propositions can \nhave in common with one
        another. \n\nAn expression characterizes a form and a \ncontent. \n\n3. 311
        An expression presupposes the forms of all \npropositions in which it can
        occur. It is the \ncommon characteristic mark of a class of pro- \npositions.
        \n\n3.312 It is therefore represented by the general form \nof the propositions
        which it characterizes. \n\nAnd in this form the expression is constant and
        \neverything else variable, \n\n3.313 An expression is thus presented by a
        variable, \nwhose values are the propositions which contain \nthe expression.
        \n\n(In the limiting case the variable becomes \nconstant, the expression
        a proposition.) \n\nI call such a variable a ^*propositional variable\". \n\n3.314
        An expression has meaning only in a pro- \nposition. Every variable can be
        conceived as a \nprepositional variable. \n\n51 \n\n"},{"name":55,"value":"LOGISCH-PHILOSOPHISCHE
        ABHANDLUNG \n\n(Auch der variable Name.) \n\n3.315 Verwandeln wir einen Bestandteil
        eines Satzes \nin eine Variable, so gibt es eine Klasse von Satzen, \nwelche
        samtlich Werte des so entstandenen varia- \nblen Satzes sind. Diese Klasse
        hangt im allge- \nmeinen noch davon ab, was wir, nach willkiirlicher \nUbereinkunft,
        mit Teilen jenes Satzes meinen. \nVerwandeln wir aber alle jene Zeichen, deren
        \nBedeutung willkiirlich bestimmt wurde, in Variable, \nso gibt es nun noch
        immer eine solche Klasse. \nDiese aber ist nun von keiner Ubereinkunft \nabhangig,
        sondern nur noch von der Natur des \nSatzes. Sie entspricht einer logischen
        Form \u2014 \neinem logischen Urbild. \n\n3.316 Welche Werte die Satzvariable
        annehmen darf, \nwird festgesetzt. \n\nDie Festsetzung der Werte ist die Variable.
        \n\n3.317 Die Festsetzung der Werte der Satzvariablen \nist die Angabe derSatze,
        deren gemeinsames \nMerkmal die Variable ist. \n\nDie Festsetzung ist eine
        Beschreibung dieser \nSatze. \n\nDie Festsetzung wird also nur von Symbolen,
        \nnicht von deren Bedeutung handeln. \n\nUnd nur dies ist der Festsetzung
        wesentlich, \ndass sie nur eine Beschreibung von \nSymbolen ist und nichts
        iiber das Be- \nzeichnete aussagt. \n\nWie die Beschreibung der Satze geschieht,
        ist \nunwesentlich. \n\n3.318 Den Satz fasse ich \u2014 wie Frege und Russell
        \u2014 \nals Funktion der in ihm enthaltenen Ausdriicke auf. \n\n3.32 Das
        Zeichen ist das sinnlich Wahrnehmbare am \n\nSymbol. \n3.321 Zwei verschiedene
        Symbole konnen also das \n\nZeichen (Schriftzeichen oder Lautzeichen etc.)
        \n\nmiteinander gemein haben \u2014 sie bezeichnen dann \n\nauf verschiedene
        Art und Weise. \n\n52 \n\n"},{"name":56,"value":"TRACTATUS LOGICO-PHILOSOPHICUS
        \n\n(Including the variable name.) \n\n3.315 If we change a constituent part
        of a proposition \ninto a variable, there is a class of propositions \nwhich
        are all the values of the resulting variable \nproposition. This class in
        general still depends \non what, by arbitrary agreement, we mean by \nparts
        of that proposition. But if we change all \nthose signs, whose meaning was
        arbitrarily deter- \nmined, into variables, there always remains such \na
        class. But this is now no longer dependent on \nany agreement ; it depends
        only on the nature of \nthe proposition. It corresponds to a logical form,
        \nto a logical prototype. \n\n3.316 What values the prepositional variable
        can \nassume is determined. \n\nThe determination of the values is the variable.
        \n\n3.317 The determination of the values of the pro- \npositional variable
        is done by indicating the pro- \npositions whose common mark the variable
        is. \n\nThe determination is a description of these \npropositions. \n\nThe
        determination will therefore deal only with \nsymbols not with their meaning.
        \n\nAnd only this is essential to the determination, \nthat it is only a description
        of symbols and asserts \nnothing about what is symbolized. \n\nThe way in
        which we describe the propositions \nis not essential. \n\n3.318 I conceive
        the proposition \u2014 like Frege and \nRussell \u2014 as a function of the
        expressions contained \nin it. \n\n3.32 The sign is the part of the symbol
        perceptible \n\nby the senses. \n\n3.321 Two different symbols can therefore
        have the \n\nsign (the written sign or the sound sign) in \ncommon \u2014
        they then signify in different ways. \n\n53 \n\n"},{"name":57,"value":"LOGISCH-PHILOSOPHISCHE
        ABHANDLUNG \n\n3.322 Es kann nie das gemeinsame Merkmal zweier \nGegenstande
        anzeigen, dass wir sie mit demselben \nZeichen, aber durch zwei verschiedene
        Bezeich- \nnungsweisen bezeichnen. Denn das Zeichen \nist ja willkiirlich.
        Man konnte also auch zwei ver- \nschiedene Zeichen wahlen, und wo bliebe dann
        das \nGemeinsame in der Bezeichnung. \n\n3.323 In der Umgangssprache kommt
        es ungemein \nhaufig vor, dass dasselbe Wort auf verschiedene \nArt und Weise
        bezeichnet \u2014 also verschiedenen \nSymbolen angehort \u2014 , oder, dass
        zwei Worter, \ndie auf verschiedene Art und Weise bezeichnen, \nausserlich
        in der gleichen Weise im Satze ange- \nwandt werden. \n\nSo erscheint das
        Wort \u201eist\" als Kopula, als \nGleichheitszeichen und als Ausdruck der
        Existenz ; \n\u201eexistieren\" als intransitives Zeitwort wie \u201egehen\"
        ; \n\u201eidentisch\" als Eigenschaftswort ; wir reden von \nEtwas, aber auch
        davon, dass etwas geschieht. \n\n(Im Satze \u201eGrun ist griin\" \u2014 wo
        das erste Wort \nein Personenname, das letzte ein Eigenschaftswort \nist \u2014
        haben diese Worte nicht einfach verschiedene \nBedeutung, sondern es sind
        verschiedene \nSy m bole.) \n\n3.324 So entstehen leicht die fundamentalsten
        Ver- \nwechslungen (deren die ganze Philosophic voll \nist). \n\n3.325 Um
        diesen Irrtumern zu entgehen, miissen \nwir eine Zeichensprache verwenden,
        welche sie \nausschliesst, indem sie nicht das gleiche Zeichen \nin verschiedenen
        Symbolen, und Zeichen, welche \nauf verschiedene Art bezeichnen, nicht ausserlich
        \nauf die gleiche Art verwendet. Eine Zeichensprache \nalso, die der logischen
        Grammatik \u2014 der logi- \nschen Syntax \u2014 gehorcht. \n\n(Die Begriffsschrift
        Frege''s und Russell''s ist \neine solche Sprache, die allerdings noch nicht
        alle \nFehler ausschliesst.) \n\n54 \n\n"},{"name":58,"value":"TRACTATUS LOGICO-PHILOSOPHICUS
        \n\n3.322 It can never indicate the common characteristic \nof two objects
        that we symbolize them with the \nsame signs but by different methods of symbolizing.
        \nFor the sign is arbitrary. We could therefore \nequally well choose two
        different signs and \nwhere then would be what was common in the \nsymbolization.
        \n\n3.323 In the language of everyday life it very often \nhappens that the
        same word signifies in two dif- \nferent ways \u2014 and therefore belongs
        to two different \nsymbols \u2014 or that two words, which signify in \ndifferent
        ways, are apparently applied in the same \nway in the proposition. \n\nThus
        the word **is\" appears as the copula, \nas the sign of equality, and as the
        expression of \nexistence; **to exist \"as an intransitive verb like \n**to
        go\"; *'' identical\" as an adjective; we speak \nof something but also of
        the fact of something \nhappening. \n\n(In the proposition ** Green is green\"
        \u2014 where \nthe first word is a proper name and the last an \nadjective
        \u2014 these words have not merely different \nmeanings but they are different
        symbols,) \n\n3.324 Thus there easily arise the most fundamental \nconfusions
        (of which the whole of philosophy is \nfull). \n\n3.325 In order to avoid
        these errors, we must employ \na symbolism which excludes them, by not apply-
        \ning the same sign in different symbpls and by \nnot applying signs in the
        same way which signify \nin different ways. A symbolism, that is to say, \nwhich
        obeys the rules of logical gra.mmB,r \u2014 of logical \nsyntax. \n\n(The
        logical symbolism of Frege and Russell \nis such a language, which, however,
        does still not \nexclude all errors.) \n\n55 \n\n"},{"name":59,"value":"LOGISCH-PHILOSOPHISCHE
        ABHANDLUNG \n\n3.326 Um das Symbol am Zeichen zu erkennen, muss \nman auf
        den sinnvollen Gebrauch achten. \n\n3.327 Das Zeichen bestimmt erst mit seiner
