        \n\n6.13 Die Logik ist keine Lehre, sondern ein Spie- \n\ngelbild der Welt.
        \n\nDie Logik ist transcendental. \n\n6.2 Die Mathematik ist eine logische
        Methode. \n\nDie Satze der Mathematik sind Gleichungen \nalso Scheinsatze.
        \n\n6.21 Der Satz der Mathematik driickt keinen Gedan- \nken aus. \n\n6. 211
        Im Leben ist es ja nie der mathematische Satz, \n\nden wir brauchen, sondern
        wir beniitzen den \nmathematischen Satz nur, um aus Satzen, welche \nnicht
        der Mathematik angehoren, auf andere zu \nschliessen, welche gleichfalls nicht
        der Mathe- \nmatik angehoren. \n\n(In der Philosophie fiihrt die Frage \u201ewozu
        \ngebrauchen wir eigentlich jenes Wort, jenen Satz\" \nimmer wieder zu wertvollen
        Einsichten.) \n\n6.22 Die Logik der Welt, die die Satze der Logik in \nden
        Tautologien zeigen, zeigt die Mathematik in \nden Gleichungen. \n\n6.23 Wenn
        zwei Ausdriicke durch das Gleichheits- \nzeichen verbunden werden, so heisst
        das, sie sind \ndurch einander ersetzbar. Ob dies aber der Fall ist \nmuss
        sich an den beiden Ausdriicken selbst zeigen. \n\nEs charakterisiert die logische
        Form zweier Aus- \ndriicke, dass sie durch einander ersetzbar sind. \n6.231
        Es ist eine Eigenschaft der Bejahung, dass man \n\nsie als doppelte Verneinung
        auffassen kann. \n\nEs ist eine Eigenschaft von \u201ei + l4-l-t-l\", dass
        \nman es als \u201e(i + 1) H- (l + 1)\" auffassen kann. \n\n168 \n\n"},{"name":172,"value":"TRACTATUS
        LOGICO-PHILOSOPHICUS \n\nlogic from one primitive proposition by simply \nforming,
        for example, the logical product of Frege''s \nprimitive propositions. (Frege
        would perhaps say \nthat this would no longer be immediately self- \nevident.
        But it is remarkable that so exact a \nthinker as Frege should have appealed
        to the \ndegree of self- evidence as the criterion of a \nlogical proposition.)
        \n\n6.13 Logic is not a theory but a reflexion of the \n\nworld. \n\nLogic
        is transcendental. \n\n6.2 Mathematics is a logical method. \n\nThe propositions
        of mathematics are equations, \nand therefore pseudo-propositions, \n\n6.21
        Mathematical propositions express no thoughts. \n6. 211 In life it is never
        a mathematical proposition \n\nwhich we need, but we use mathematical pro-
        \npositions only in order to infer from propositions \nwhich do not belong
        to mathematics to others \nwhich equally do not belong to mathematics. \n\n(In
        philosophy the question \" Why do we really \nuse that word, that proposition
        ? ''* constantly leads \nto valuable results.) \n\n6.22 The logic of the world
        which the propositions \nof logic show in tautologies, mathematics shows \nin
        equations. \n\n6.23 If two expressions are connected by the sign of \nequality,
        this means that they can be substituted \nfor one another. But whether this
        is the case \nmust show itself in the two expressions them- \nselves. \n\nIt
        characterizes the logical form of two expres- \nsions, that they can be substituted
        for one \nanother. \n6.231 It is a property of affirmation that it can be
        \n\nconceived as double denial. \n\nIt is a property of **n-l + i + i\" that
        it can be \nconceived as ** (i-}-i)4- (i + i) ''*. \n\n169 \n\n"},{"name":173,"value":"LOGISCH-PHILOSOPHISCHE
        ABHANDLUNG \n\n6.232 Frege sagt, die beiden Ausdriicke haben dieselbe \nBedeutung,
        aber verschiedenen Sinn. \n\nDas Wesentliche an der Gleichung ist aber, dass
        \nsie nicht notwendig ist, um zu zeigen, dass die beiden \nAusdriicke, die
        das Gleichheitszeichen verbindet, \ndieselbe Bedeutung haben, da sich dies
        aus den \nbeiden Ausdriicken selbst ersehen lasst. \n\n6.2321 Und, dass die
        Satze der Mathematik bewiesen \nwerden kOnnen, heisst ja nichts anderes, als
        dass \nihre Richtigkeit einzusehen ist, ohne dass das, was \nsie ausdriicken,
        selbst mit den Tatsachen auf seine \nRichtigkeit hin verglichen werden muss.
        \n\n6.2322 Die Identitat der Bedeutung zweier Ausdriicke \nlasst sich nicht
        behaupten. Denn um etwas von \nihrer Bedeutung behaupten zu konnen, muss ich
        \nihre Bedeutung kennen : und indem ich ihre Be- \ndeutung kenne, weiss ich,
        ob sie dasselbe oder \nverschiedenes bedeuten. \n\n6.2323 Die Gleichung kennzeichnet
        nur den Stand- \npunkt, von welchem ich die beiden Ausdriicke \nbetrachte,
        namlich vom Standpunkte ihrer Bedeu- \ntungsgleichheit. \n\n6.233 Die Frage,
        ob man zur Losung der mathemati- \nschen Probleme die Anschauung brauche,
        muss \ndahin beantwortet werden, dass eben die Sprache \nhier die n5tige Anschauung
        liefert. \n\n6.2331 Der Vorgang des Rechnens vermittelt eben \ndiese Anschauung.
        \n\nDie Rechnung ist kein Experiment. \n\n6.234 ^^^ Mathematik ist eine Methode
        der Logik. \n6.2341 Das Wesentliche der mathematischen Methode \n\nist es,
        mit Gleichungen zu arbeiten. Auf dieser \nMethode beruht es namlich, dass
        jeder Satz der \nMathematik sich von selbst verstehen muss. \n6.24 Die Methode
        der Mathematik, zu ihren Glei- \n\nchungen zu kommen, ist die Substitutionsmethode,
        \nDenn die Gleichungen driicken die Ersetzbarkeit \nzweier Ausdriicke aus
        und wir schreiten von einer \n\n170 \n\n"},{"name":174,"value":"TRACTATUS
        LOGICO-PHILOSOPHICUS \n\n6.232 Frege says that these expressions have the
        same \nmeaning but different senses. \n\nBut what is essential about equation
        is that it \nis not necessary in order to show that both ex- \npressions,
        which are connected by the sign of \nequality, have the same meaning : for
        this can be \nperceived from the two expressions themselves. \n\n6.2321 And,
        that the propositions of mathematics can \nbe proved means nothing else than
        that their \ncorrectness can be seen without our having to \ncompare what
        they express with the facts as regards \ncorrectness. \n\n6.2322 The identity
        of the meaning of two expressions \ncannot be asserted. For in order to be
        able to \nassert anything about their meaning, I must know \ntheir meaning,
        and if I know their meaning, I \nknow whether they mean the same or something
        \ndifferent. \n\n6.2323 The equation characterizes only the standpoint \nfrom
        which I consider the two expressions, that \nis to say the standpoint of their
        equality of \nmeaning. \n\n6.233 To the question whether we need intuition
        for \nthe solution of mathematical problems it must be \nanswered that language
        itself here supplies the \nnecessary intuition. \n\n6.2331 The process of
        calculation brings about just \nthis intuition. \n\nCalculation is not an
        experiment. \n\n6.234 Mathematics is a method of logic. \n\n6.2341 The essential
        of mathematical method is work- \ning with equations. On this method depends
        the \nfact that every proposition of mathematics must \nbe self-evident. \n6.24
        The method by which mathematics arrives at \n\nits equations is the method
        of substitution. \n\nFor equations express the substitutability of \ntwo expressions,
        and we proceed from a number \n\n171 \n\n"},{"name":175,"value":"LOGISCH-PHILOSOPHISCHE
