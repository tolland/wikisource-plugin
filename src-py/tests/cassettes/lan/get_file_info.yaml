        \n\n"},{"name":127,"value":"LOGISCH-PHILOSOPHISCHE ABHANDLUNG \n\n(So kommen
        in den \u201ePrincipia Mathematica\" \nvon Russell und Whitehead Definitionen
        und \nGrundgesetze in Worten vor. Warum hier plotz- \nlich Worte? Dies bediirfte
