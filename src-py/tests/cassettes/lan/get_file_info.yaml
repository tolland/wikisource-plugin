        sagt, dass aRb. \n\n3.144 Sachlagen kann man beschreiben, nicht be- \nne n
        n e n. \n\n(Namen gleichen Punkten, Satze Pfeilen, sie \nhaben Sinn.) \n3\u00ab2
        Im Satze kann der Gedanke so ausgedriickt sein, \n\ndass den Gegenstanden
        des Gedankens Elemente \ndes Satzzeichens entsprechen. \n\n3.201 Diese Elemente
        nenne ich ,,einfache Zeichen** \nund den Satz ,,vollstandig analysiert**.
        \n\n3.202 Die im Satze angewandten einfachen Zeichen \nheissen Namen. \n\n3.203
        Der Name bedeutet den Gegenstand. Der \nGegenstand ist seine Bedeutung. (,,A**
        ist das- \nselbe Zeichen wie ,,A\".) \n\n3.21 Der Konfiguration der einfachen
