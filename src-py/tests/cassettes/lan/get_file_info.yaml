        ABHANDLUNG \n\nohne eine Ahnung da von zu haben, wie und was \njedes Wort
        bedeutet. \u2014 Wie man auch spricht, ohne \nzu wissen, wie die einzelnen
        Laute hervorgebracht \nwerden. \n\nDie Umgangssprache ist ein Teil des menschli-
        \nchen Organismus und nicht weniger kompliziert als \ndieser. \n\nEs ist menschenunmoglich,
        die Sprachlogik aus \nihr unmittelbar zu entnehmen. \n\nDie Sprache verkleidet
        den Gedanken. Und \nzwar so, dass man nach der ausseren Form des \nKleides,
        nicht auf die Form des bekleideten Gedan- \nkens schliessen kann ; weil die
        aussere Form des \nKleides nach ganzanderen Zwecken gebildet ist, als \ndanach,
        die Form des Korpers erkennen zu lassen. \n\nDie stillschweigenden Abmachungen
        zum Ver- \nstandnis der Umgangssprache sind enorm komp- \nliziert. \n4.003
        Die meisten Satze und Fragen, welche iiber \n\nphilosophische Dinge geschrieben
        worden sind, sind \nnicht falsch, sondern unsinnig. Wir konnen daher \nFragen
        dieser Art iiberhaupt nicht beantworten, \nsondern nur ihre Unsinnigkeit feststellen.
        Die \nmeisten Fragen und Satze der Philosophen beruhen \ndarauf, das wir unsere
        Sprachlogik nicht verstehen. \n\n(Sie sind von der Art der Frage, ob das Gute
        \nmehr oder weniger identisch sei als das Schone.) \n\nUnd es ist nicht verwunderlich,
        dass die tiefsten \nProbleme eigentlich kei n e Probleme sind. \n4.0031 Alle
        Philosophic ist \u201eSprachkritik\". (AUerdings \nnicht im Sinne Mauthners.)
        Russell''s Verdienst ist \nes, gezeigt zu haben, dass die scheinbare logische
        \nForm des Satzes nicht seine wirkliche sein muss. \n4.01 Der Satz ist ein
        Bild der Wirklichkeit. \n\nDer Satz ist ein Modell der Wirklichkeit, so wie
        \nwir sie uns denken. \n4. oil Auf den ersten Blick scheint der Satz \u2014
        wie er \n\netwa auf dem Papier gedruckt steht \u2014 kein Bild der \n\n62
        \n\n"},{"name":66,"value":"TRACTATUS LOGICO-PHILOSOPHICUS \n\nwithout having
        an idea how and what each word \nmeans \u2014 just as one speaks without knowing
        how \nthe single sounds are produced. \n\nColloquial language is a part of
        the human \norganism and is not less complicated than it \n\nFrom it it is
        humanly impossible to gather \nimmediately the logic of language. \n\nLanguage
        disguises the thought ; so that from \nthe external form of the clothes one
        cannot infer \nthe form of the thought they clothe, because the \nexternal
        form of the clothes is constructed with \nquite another object than to let
        the form of the \nbody be recognized. \n\nThe silent adjustments to understand
        colloquial \nlanguage are enormously complicated. \n\n4.003 Most propositions
        and questions, that have been \n\nwritten about philosophical matters, are
        not false, but \nsenseless. We cannot, therefore, answer questions \nof this
        kind at all, but only state their senselessness. \nMost questions and propositions
        of the philosophers \nresult from the fact that we do not understand the \nlogic
        of our language. \n\n(They are of the same kind as the question \nwhether
        the Good is more or less identical than the \nBeautiful-) \n\nAnd so it is
        not to be wondered at that the \ndeepest problems are really no problems.
        \n\n4.0031 All philosophy is *'' Critique of language\" (but \nnot at all
        in Mauthner''s sense). Russell''s merit is \nto have shown that the apparent
        logical form of the \nproposition need not be its real form. \n\n4.01 The
        proposition is a picture of reality. \n\nThe proposition is a model of the
        reality as we \nthink it is. \n\n4.011 At the first glance the proposition
        \u2014 say as it \n\nstands printed on paper \u2014 does not seem to be a
