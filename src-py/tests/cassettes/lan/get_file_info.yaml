        Wird ein Zeichen nicht gebrauch t, so ist \nes bedeutungslos. Das ist der
        Sinn der Devise \nOccams. \n\n(Wenn sich alles so verhalt als hatte ein Zeichen
        \nBedeutung, dann hat es auch Bedeutung.) \n3.33 In der logischen Syntax darf
        nie die Bedeutung \n\neines Zeichens eine Rolle spielen ; sie muss sich \naufstellen
        lassen, ohne dass dabei von der Bedeu- \ntung eines Zeichens die Rede ware,
        sie darf n u r \ndie Beschreibung der Ausdriicke voraussetzen. \n\n3.331 Von
        dieser Bemerkung sehen wir in Russell''s \n\u201eTheory of types\" hiniiber
