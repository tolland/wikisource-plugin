        Damit eriedigen sich auch alle Probleme, die \n\nan solche Scheinsatze gekniipft
        waren. \n\nAlle Probleme, die Russells \u201eAxioni of Infinity\" \nmit sich
        bringt, sind schon hier zu l5sen. \n\nDas, was das Axiom of infinity sagen
        soil, wiirde \nsich in der Sprache dadurch ausdriicken, dass es \nunendlich
        viele Namen mit verschiedener Bedeu- \ntung gabe. \n\n5.5351 Es gibt gewisse
        Falle, wo man in Versuchung \ngerat, Ausdriicke von der Form \u201ea = a\"
        oder \u201epDp\" \nu. dgl. zu beniitzen. Und zwar geschieht dies, \nwenn man
        von dem Urbild : Satz, Ding, etc. reden \nmochte. So hat Russell in den \u201ePrinciples
        of \nMathematics\" den Unsinn \u201ep ist ein Satz\" in Sym- \nbolen durch
        \u201epDp\" wiedergegeben und als Hypo- \nthese vor gewisse Satze gestellt,
