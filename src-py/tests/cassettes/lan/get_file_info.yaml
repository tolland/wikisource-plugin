        N (^) =''*''/> . ''^ ^(neither \n/ nor g). \n\n5. 511 How can the all-embracing
        logic which mirrors \nthe world use such special catches and manipula- \ntions?
        Only because all these are connected into \nan infinitely fine network, to
        the great mirror. \n\n5.512 ** ''\u2022/\" is true if **^''* is false. Therefore
        in the \ntrue proposition ** ^/> \" **/\" is a false proposition. \nHow then
        can the stroke *^ ''^ \" bring it into \nagreement with reality ? \n\nThat
        which denies in ** ''\u2022/\" is however not \n** ^^\\ but that which all
        signs of this notation, \nwhich deny/, have in common. \n\nHence the common
        rule according to which \n'''' ^p''\\ '''' ^ ^ ^p''\\ **^/>v/\", ''*''-/>.
        -^z^\", \netc. etc. (to infinity) are constructed. And this \nwhich is common
        to them all mirrors denial. \n\n5.513 We could say : What is common to all
        symbols, \nwhich assert both / and g, is the proposition \n**/. ^ \". What
        is common to all symbols, which \nassert either/ or ^, is the proposition
        **/v^\". \n\nAnd similarly we can say : Two propositions \nare opposed to
        one another when they have \nnothing in common with one another ; and every
