        zu sein, von der er handelt. Aber \nauch die Notenschrift scheint auf den
        ersten Blick \nkein Bild der Musik zu sein,und unsere Lautzeichen- \n(Buchstaben-)Schrift
        kein Bild unserer Lautsprache. \nUnd doch erweisen sich diese Zeichensprachen
        \nauch im gewohnlichen Sinne als Bilder dessen, was \nsie darstellen. \n\n4.012
        Offenbar ist, dass wir einen Satz von der Form \n\u201eaRb\" als Bild empfinden.
        Hier ist das Zeichen \noffenbar ein Gleichnis des Bezeichneten. \n\n4.013
        Und wenn wir in das Wesentliche dieser Bild- \nhaftigkeit eindringen, so sehen
        wir, dass dieselbe \ndurch scheinbare Unregelmassigkeiten \n(wie die Verwendung
        der jf und b in der Notenschrift) \nn i c h t gestort wird. \n\nDenn auch
        diese Unregelmassigkeiten bilden \ndas ab, was sie ausdriicken soUen ; nur
        auf eine \nandere Art und Weise. \n\n4.014 Die Grammophonplatte, der musikalische
        Ge- \ndanke, die Notenschrift, die Schallwellen, stehen \nalle in jener abbildenden
        internen Beziehung zu \neinander, die zwischen Sprache und Welt besteht. \n\nIhnen
        alien ist der logische Bau gemeinsam. \n\n(Wie im Marchen die zwei Jiinglinge,
        ihre zwei \nPferde und ihre Lilien. Sie sind alle in gewissem \nSinne Eins.)
        \n4.0141 Dass es eine allgemeine Regel gibt, durch die \nder Musiker aus der
        Partitur die Symphonie \nentnchmen kann, durch welche man aus der Linie \nauf
        der Grammophonplatte die Symphonie und \nnach der ersten Regel wieder die
        Partitur ableiten \nkann, darin besteht eben die innere Ahnlichkeit \ndieser
        scheinbar so ganz verschiedenen Gebilde. \nUnd jene Regel ist das Gesetz der
        Projektion, \nwelches die Symphonie in die Notensprache pro- \njiziert. Sie
        ist die Regel der Ubersetzung der \nNotensprache indie Sprache der Grammophonplatte.
        \n\n4.015 Die Moglichkeit aller Gleichnisse, der ganzen \n\n64 \n\n"},{"name":68,"value":"TRACTATUS
        LOGICO-PHILOSOPHICUS \n\npicture of the reality of which it treats. But nor
        \ndoes the musical score appear at first sight to be a \npicture of a musical
        piece ; nor does our phonetic \nspelling (letters) seem to be a picture of
        our spoken \nlanguage. And yet these symbolisms prove to be \npictures \u2014
        even in the ordinary sense of the word \n\u2014 of what they represent. \n\n4.012
        It is obvious that we perceive a proposition \nof the form aRb as a picture.
        Here the sign is \nobviously a likeness of the signified. \n\n4.013 And if
        we penetrate to the essence of this \npictorial nature we see that this is
        not disturbed \nby apparent irregularities (like the use of | and b in \nthe
        score). \n\nFor these irregularities also picture what they \nare to express
        ; only in another way. \n\n4.014 The gramophone record, the musical thought,
        \nthe score, the waves of sound, all stand to one \nanother in that pictorial
        internal relation, which \nholds between language and the world. \n\nTo all
        of them the logical structure is common. \n\n(Like the two youths, their two
        horses and their \nlilies in the story. They are all in a certain sense \none.)
        \n4.0141 In the fact that there is a general rule by which \nthe musician
        is able to read the symphony out of \nthe score, and that there is a rule
        by which one \ncould reconstruct the symphony from the line on \na gramophone
        record and from this again \u2014 by \nmeans of the first rule \u2014 construct
        the score, herein \nlies the internal similarity between these things \nwhich
        at first sight seem to be entirely different. \nAnd the rule is the law of
        projection which projects \nthe symphony into the language of the musical
        \nscore. It is the rule of translation of this language \ninto the language
        of the gramophone record. \n\n4.015 The possibility of all similes, of all
        the \n\n65 E \n\n"},{"name":69,"value":"LOGISCH-PHILOSOPHISCHE ABHANDLUNG
        \n\nBildhaftigkeit unserer Ausdrucksweise, ruht in der \n\nLogik der Abbildung.
        \n4.016 Um das Wesen des Satzes zu verstehen, denken \n\nwiran dieHieroglyphenschrift,welche
        die Tatsachen \n\ndie sie beschreibt abbildet. \n\nUnd aus ihr wurde die Buchstabenschrift,
        ohne \n\ndas Wesentliche der Abbildung zu verlieren. \n4.02 Dies sehen wir
        daraus, dass wir den Sinn des \n\nSatzzeichens verstehen, ohne dass er uns
        erklart \n\nwurde. \n\n4.021 Der Satz ist ein Bild der Wirklichkeit : Denn
        \nich kenne die von ihm dargestellte Sachlage, wenn \nich den Satz verstehe.
        Und den Satz verstehe ich, \nohne dass mir sein Sinn erklart wurde. \n\n4.022
        Der Satz z e i g t seinen Sinn. \n\nDer Satz z e i g t, wie es sich verhalt,
        wenn er \nwahr ist. Und er s a g t, dass es sich so verhalt. \n\n4.023 Die
        Wirklichkeit muss durch den Satz auf ja \noder nein fixiert sein. \n\nDazu
        muss sie durch ihn vollstandig beschrieben \nwerden. \n\nDerSatz istdie Beschreibungeines
        Sachverhaltes. \n\nWie die Beschreibung einen Gegenstand nach \nseinen externen
        Eigenschaften, so beschreibt der \nSatz die Wirklichkeit nach ihren internen
        Eigen- \nschaften. \n\nDer Satz konstruiert eine Welt mit Hilfe eines \nlogischen
        Geriistes und darum kann man am Satz \nauch sehen, wie sich alles Logische
        verhalt, wenn \ner wahr ist. Man kann aus einem falschen Satz \nSchliisse
        ziehen. \n\n4.024 Einen Satz verstehen, heisst, wissen was der \nFall ist,
        wenn er wahr ist. \n\n(Man kann ihn also verstehen, ohne zu wissen, \nob er
        wahr ist.) \n\nMan versteht ihn, wenn man seine Bestandteile \nversteht. \n\n4.025
        Die Ubersetzung einer Sprache in eine andere \n\n66 \n\n"},{"name":70,"value":"TRACTATUS
        LOGICO-PHILOSOPHICUS \n\nimagery of our language, rests on the logic of \n\nrepresentation.
        \n4.016 In order to understand the essence of the \n\nproposition, consider
        hieroglyphic writing, which \n\npictures the facts it describes. \n\nAnd from
        it came the alphabet without the \n\nessence of the representation being lost.
        \n4.02 This we see from the fact that we understand \n\nthe sense of the propositional
        sign, without having \n\nhad it explained to us. \n\n4.021 The proposition
        is a picture of reality, for I know \nthe state of affairs presented by it,
        if I understand \nthe proposition. And I understand the proposition, \nwithout
        its sense having been explained to me. \n\n4.022 The proposition shows its
        sense. \n\nThe proposition shows how things stand, if it is \ntrue. And it
        saysy that they do so stand. \n\n4.023 The proposition determines reality
        to this \nextent, that one only needs to say **Yes\" or \n** No \" to it to
        make it agree with reality. \n\nReality must therefore be completely described
        by \nthe proposition. \n\nA proposition is the description of a fact. \n\nAs
        the description of an object describes it by \nits external properties so
        propositions describe \nreality by its internal properties. \n\nThe proposition
        constructs a world with the \nhelp of a logical scaffolding, and therefore
        one \ncan actually see in the proposition all the logical \nfeatures possessed
        by reality if it is true. One can \ndraw conclusions from a false proposition.
        \n\n4.024 To understand a proposition means to know \nwhat is the case, if
        it is true. \n\n(One can therefore understand it without \nknowing whether
        it is true or not.) \n\nOne understands it if one understands its \nconstituent
        parts. \n\n4.025 The translation of one language into another \n\n67 \n\n"},{"name":71,"value":"LOGISCH-PHILOSOPHISCHE
        ABHANDLUNG \n\ngeht nicht so vor sich, dass man jeden Satz der \neinen in
        einen Satz der anderen iibersetzt, sondern \nnur die Satzbestandteile werden
        iibersetzt. \n\n(Und das Worterbuch iibersetzt nicht nur \nSubstantiva, sondern
        auch Zeit-, Eigenschafts- und \nBindeworter etc. ; und es behandelt sie alle
        gleich.) \n\n4.026 Die Bedeutungen der einfachen Zeichen (der \nWorter) miissen
        uns erklart werden, dass wir sie \nverstehen. \n\nMit den Satzen aber verstandigen
        wir uns. \n\n4.027 Es liegt im Wesen des Satzes, dass er uns einen \nneuen
        Sinn mitteilen kann. \n\n4.03 Ein Satz muss mit alten Ausdriicken einen \n\nneuen
        Sinn mitteilen. \n\nDer Satz teilt uns eine Sachlage mit, also \nmuss er wesentlich
        mit der Sachlage zusam- \nmenhangen. \n\nUnd der Zusammenhang ist eben, dass
        er ihr \nlogisches Bild ist. \n\nDer Satz sagt nur insoweit etwas aus, als
        er ein \nBild ist. \n\n4.031 Im Satz wird gleichsam eine Sachlage pro- \nbeweise
        zusammengestellt. \n\nMan kann geradezu sagen : statt, dieser Satz \nhat diesen
        und diesen Sinn ; dieser Satz stellt diese \nund diese Sachlage dar. \n\n4.0311
        Ein Name steht fiir ein Ding, ein anderer fiir \nein anderes Ding und untereinander
        sind sie \nverbunden, so stellt das Ganze \u2014 wie ein lebendes \nBild \u2014
        den Sachverhalt vor. \n\n4.0312 Die Moglichkeit des Satzes beruht auf dem
        \nPrinzip der Vertretung von Gegenstanden durch \nZeichen. \n\nMein Grundgedanke
        ist, dass die \u201elogischen \nKonstanten\" nicht vertreten. Dass sich die
        Logik \nder Tatsachen nicht vertreten lasst. \n\n4.032 Nur insoweit ist der
        Satz ein Bild einer Sachlage, \nals er logisch gegliedert ist. \n\n68 \n\n"},{"name":72,"value":"TRACTATUS
        LOGICO-PHILOSOPHICUS \n\nis not a process of translating each proposition
        \nof the one into a proposition of the other, but \nonly the constituent parts
        of propositions are \ntranslated. \n\n(And the dictionary does not only translate
        \nsubstantives but also adverbs and conjunctions, \netc., and it treats them
        all alike.) \n\n4.026 The meanings of the simple signs (the words) \nmust
        be explained to us, if we are to understand \nthem. \n\nBy means of propositions
        we explain ourselves. \n\n4.027 It is essential to propositions, that they
        can \ncommunicate a new sense to us. \n\n4.03 A proposition must communicate
        a new sense \n\nwith old words. \n\nThe proposition communicates to us a state
        of \naffairs, therefore it must be essentially connected \nwith the state
        of affairs. \n\nAnd the connexion is, in fact, that it is its \nlogical picture.
        \n\nThe proposition only asserts something, in so \nfar as it is a picture.
        \n\n4.031 In the proposition a state of affairs is, as it \nwere, put together
        for the sake of experiment. \n\nOne can say, instead of. This proposition
        has \nsuch and such a sense. This proposition represents \nsuch and such a
        state of affairs. \n\n4.0311 One name stands for one thing, and another \nfor
        another thing, and they are connected together. \nAnd so the whole, like a
        living picture, presents \nthe atomic fact. \n\n4.0312 The possibility of
        propositions is based upon the \nprinciple of the representation of objects
        by signs. \n\nMy fundamental thought is that the *Mogical \nconstants \" do
        not represent. That the logic of the \nfacts cannot be represented. \n\n4.032
        The proposition is a picture of its state of \naffairs, only in so far as
        it is logically articulated. \n\n69 \n\n"},{"name":73,"value":"LOGISCH-PHILOSOPHISCHE
        ABHANDLUNG \n\n(Auch der Satz \u201eambulo\" ist zusammengesetzt, \ndenn sein
        Stamm ergibt mit einer anderen Endung \nund seine Endung mit einem anderen
        Stamm, einen \nanderen Sinn.) \n\n4.04 Am Satz muss gerade soviel zu unterscheiden
        \nsein, als an der Sachlage die er darstellt. \n\nDie beiden miissen die gleiche
        logische (mathe- \nmatische) Mannigfaltigkeit besitzen. (Vergleiche \nHertz''s
        Mechanik, iiber Dynamische Modelle.) \n4.041 Diese mathematische Mannigfaltigkeit
        kann \n\nman naturlich nicht selbst wieder abbilden. Aus \nihr kann man beim
        Abbilden nicht heraus. \n\n4.0411 Wollten wir z. B. das, was wir durch \u201e(x)
        fx\" \nausdriicken, durch Vorsetzen eines Indexes vor \n\u201efx\" ausdriicken
        \u2014 etwa so : \u201eAlg. fx\", es wiirde \nnicht geniigen \u2014 wir wussten
        nicht, was verall- \ngemeinert wurde. Wollten wir es durch einen \nIndex \u201ea\"
        anzeigen \u2014 etwa so: \u201ef(xa)\" \u2014 es wiirde \nauch nicht geniigen
        \u2014 wir wussten nicht den \nBereich der Allgemeinheitsbezeichnung. \n\nWollten
        wir es durch Einfiihrung einer Marke \nin die Argumentstellen versuchen \u2014
        etwa so : \n\u201e(A, A) . F (A, A)\" \u2014 es wiirde nicht geniigen \u2014
        wir \nkonnten die Identitat der Variablen nicht feststellen. \nU.s.w. \n\nAUe
        diese Bezeichnungsweisen geniigen nicht, \nweil sie nicht die notwendige mathematische
        \nMannigfaltigkeit haben. \n\n4.0412 Aus demselben Grunde geniigt die idealistische
        \nErklarung des Sehens der raumlichen Beziehungen \ndurch die \u201eRaumbrille\"
        nicht, weil sie nicht die \nMannigfaltigkeit dieser Beziehungen erklaren kann.
        \n\n4.05 Die Wirklichkeit wird mit dem Satz verglichen. \n\n4.06 Nur dadurch
        kann der Satz wahr oder falsch \nsein, indem er ein Bild der Wirklichkeit
        ist. \n\n4.061 Beachtet man nicht, dass der Satz einen von \n\nden Tatsachen
        unabhangigen Sinn hat, so kann \nman leicht glauben, dass wahr und falsch
        gleich- \n\n70 \n\n"},{"name":74,"value":"TRACTATUS LOGICO-PHILOSOPHICUS \n\n(Even
        the proposition **ambulo\" is composite, \nfor its stem gives a different
        sense with another \ntermination, or its termination with another \nstem.)
        \n\n4.04 In the proposition there must be exactly as \nmany things distinguishable
        as there are in the \nstate of affairs, which it represents. \n\nThey must
        both possess the same logical \n(mathematical) multiplicity (cf. Hertz''s
        Mechanics, \non Dynamic Models). \n4.041 This mathematical multiplicity naturally
        cannot \n\nin its turn be represented. One cannot get outside \nit in the
        representation. \n\n4.0411 If we tried, for example, to express what is \nexpressed
        by ** (x) ./x^* by putting an index before \n/Xy like: **Gen. ySr\",. it would
        not do, we should \n\nnot know what was generalized. If we tried to \nshow
        it by an index ^, like : *^/(^g) \" it would not \ndo \u2014 we should not
        know the scope of the general^ \nization. \n\nIf we were to try it by introducing
        a mark \nin the argument places, like ** (G^G) . F (G,G) \", it \nwould not
        do \u2014 we could not determine the identity \nof the variables, etc. \n\nAll
        these ways of symbolizing are inadequate \nbecause they have not the necessary
        mathematical \nmultiplicity. \n\n4.0412 For the same reason the idealist explanation
        of \nthe seeing of spatial relations through ** spatial \nspectacles''* does
        not do, because it cannot explain \nthe multiplicity of these relations. \n\n4.05
        Reality is compared with the proposition. \n\n4.06 Propositions can be true
        or false only by being \npictures of the reality. \n\n4.061 If one does not
        observe that propositions have \n\na sense independent of the facts, one can
        easily \nbelieve that true and false are two relations \n\n71 \n\n"},{"name":75,"value":"LOGISCH-PHILOSOPHISCHE
        ABHANDLUNG \n\nberechtigte Beziehungen von Zeichen und Bezeich- \nnetem sind.
        \n\nMan konnte dann z. B. sagen, dass \u201ep\" auf die \nwahre Art bezeichnet,
        was \u201e -'' p\" auf die falsche \nArt, etc. \n\n4.062 Kann man sich nicht
        mit falschen Satzen, wie \nbisher mit wahren, verstandigen ? Solange man \nnur
        weiss, dass sie falsch gemeint sind. Nein I \nDenn, wahr ist ein Satz, wenn
        es sich so verhalt, \nwie wir es durch ihn sagen ; und wenn wir mit \n\u201ep\"
        ^ p meinen, und es sich so verhalt wie wir es \nmeinen, so ist \u201ep\" in
        der neuen Auffassung wahr \nund nicht falsch. \n\n4.0621 Dass aber die Zeichen
        \u201ep\" und \u201e -'' p\" das gleiche \nsagen k6nnen, ist wichtig. Denn
        es zeigt, dass \ndem Zeichen \u201e -^ \" in der Wirklichkeit nichts \nentspricht.
        \n\nDass in einem Satz die Verneinung vorkommt, \nist noch kein Merkmal seines
        Sinnes {^ ''^ p = p). \n\nDie Satze \u201ep\" und \u201e ^ p\" haben entgegen-
        \ngesetzten Sinn, aber es entspricht ihnen eine und \ndieselbe Wirklichkeit.
        \n\n4.063 Ein Bild zur Erklarung des Wahrheitsbegriffes: \nSchwarzer Fleck
        auf weissem Papier ; die Form \ndes Fleckes kann man beschreiben, indem man
        \nfur jeden Punkt der Flache angibt, ob er weiss \noder schwarz ist. Der Tatsache,
        dass ein Punkt \nschwarz ist, entspricht eine positive \u2014 der, dass \nein
        Punkt weiss (nicht schwarz) ist, eine negative \nTatsache. Bezeichne ich einen
        Punkt der Flache \n(einen Frege''schen Wahrheitswert), so entspricht \ndies
        der Annahme, die zur Beurteilung aufgestellt \nwird, etc. etc. \n\nUm aber
        sagen zu konnen, ein Punkt sei \nschwarz oder weiss, muss ich vorerst wissen,
        \nwann man einen Punkt schwarz und wann \nman ihn weiss nennt ; um sagen zu
        konnen : \n\u201ep\" ist wahr (oder falsch), muss ich bestimmt \n\n72 \n\n"},{"name":76,"value":"TRACTATUS
        LOGICO-PHILOSOPHICUS \n\nbetween signs and things signified with equal \nrights.
        \n\nOne could then, for example, say that **/\" \nsignifies in the true way
        what ** ''*/*'' signifies in \nthe false way, etc. \n\n4.062 Can we not make
        ourselves understood by \nmeans of false propositions as hitherto with true
        \nones, so long as we know that they are meant to \nbe false ? No I For a
        proposition is true, if \nwhat we assert by means of it is the case ; and
        if \nby **/** we mean ^/, and what we mean is the \ncase, then **/** in the
        new conception is true \nand not false. \n\n4.0621 That, however, the signs
        **/\" and ** ^p^^ can \nsay the same thing is important, for it shows \nthat
        the sign <* ^ \" corresponds to nothing in \nreality. \n\nThat negation occurs
        in a proposition, is no \ncharacteristic of its sense (''*'' ''^P~p)* \n\nThe
        propositions \"/\" and ** ''^Z\" have op- \nposite senses, but to them corresponds
        one and \nthe same reality. \n\n4.063 An illustration to explain the concept
        of truth. \nA black spot on white paper ; the form of the spot \ncan be described
        by saying of each point of the \nplane whether it is white or black. To the
        fact \nthat a point is black corresponds a positive fact ; \nto the fact that
        a point is white (not black), a \nnegative fact. If I indicate a point of
        the plane \n(a truth-value in Frege''s terminology), this corre- \nsponds
        to the assumption proposed for judgment, \netc. etc. \n\nBut to be able to
        say that a point is black or \nwhite, I must first know under what conditions
        a \npoint is called white or black ; in order to be able \nto say**/\" is
        true (or false) 1 must have deter- \nmined under what conditions 1 call **/\"
        true, \n\n73 \n\n"},{"name":77,"value":"LOGISCH-PHILOSOPHISCHE ABHANDLUNG
        \n\nhaben, unter welchen Umstanden ich \u201ep\" wahr \nnenne, und damit bestimme
        ich den Sinn des \nSatzes. \n\nDer Punkt an dem das Gleichnis hinkt ist \nnun
        der: Wir konnen auf einen Punkt des Papiers \nzeigen, auch ohne zu wissen,
        was weiss und \nschwarz ist ; einem Satz ohne Sinn aber entspricht \ngar nichts,
        denn er bezeichnet kein Ding (Wahr- \nheitswert) dessen Eigenschaften etwa
        \u201efalsch\" oder \n\u201ewahr\" hiessen ; das Verbum eines Satzes ist nicht
        \n\u201eist wahr\" oder \u201eist falsch\" \u2014 wie Frege glaubte \u2014
        , \nsondern das, was \u201ewahr ist\" muss das Verbum \nschon enthalten. \n4.064
        Jeder Satz muss schon einen Sinn haben; \n\ndie Bejahung kann ihn ihm nicht
        geben, denn \nsie bejaht ja gerade den Sinn. Und dasselbe gilt \nvon der Verneinung,
        etc. \n4.0641 Man konnte sagen : Die Verneinung bezieht \nsich schon auf den
        logischen Ort, den der verneinte \nSatz bestimmt. \n\nDer verneinende Satz
        bestimmt einen a n d e r e n \nlogischen Ort als der verneinte. \n\nDer verneinende
        Satz bestimmt einen logischen \nOrt mit Hilfe des logischen Ortes des verneinten
        \nSatzes, indem er jenen ausserhalb diesem liegend \nbeschreibt. \n\nDass
        man den verneinten Satz wieder verneinen \n\nkann, zeigt schon, dass das,
        was verneint wird, \n\nschon ein Satz und nicht erst die Vorbereitung \n\nzu
        einem Satze ist. \n\n4.1 Der Satz stellt das Bestehen und Nichtbestehen \n\nder
        Sachverhalte dar. \n4. II Die Gesamtheit der wahren Satze ist die \n\ngesamte
        Naturwissenschaft (oder die Gesamtheit \nder Naturwissenschaften). \n4.111
        Die Philosophic ist keine der Naturwissen- \n\nschaften. \n\n(Das Wort \u201ePhilosophie\"
        muss etwas bedeuten, \n\n74 \n\n"},{"name":78,"value":"TRACTATUS LOGICO-PHILOSOPHICUS
        \n\nand thereby I determine the sense of the pro- \nposition. \n\nThe point
        at which the simile breaks down is \nthis : we can indicate a point on the
        paper, without \nknowing what white and black are ; but to a pro- \nposition
        without a sense corresponds nothing at \nall, for it signifies no thing (truth-value)
        whose \nproperties are called ** false\" or **true\" ; the verb \nof the proposition
        is not ** is true *'' or /* is false\" \u2014 \nas Frege thought \u2014 but
        that which *''is true\" must \nalready contain the verb. \n\n4.064 Every proposition
        must already have a sense ; \n\nassertion cannot give it a sense, for what
        it asserts \nis the sense itself. And the same holds of \ndenial, etc. \n\n4.0641
        One could say, the denial is already related to \nthe logical place determined
        by the proposition \nthat is denied. \n\nThe denying proposition determines
        a logical \nplace other than does the proposition denied. \n\nThe denying
        proposition determines a logical \nplace, with the help of the logical place
        of the \nproposition denied, by saying that it lies outside \nthe latter place.
        \n\nThat one can deny again the denied proposition, \nshows that what is denied
        is already a pro- \nposition and not merely the preliminary to a \nproposition.
        \n\n4\u00abl A proposition presents the existence and non- \n\nexistence of
        atomic facts. \n\n4.11 The totality of true propositions is the total \n\nnatural
        science (or the totality of the natural \nsciences). \n\n4. Ill Philosophy
        is not one of the natural \n\nsciences. \n\n(The word ** philosophy \" must
        mean something \n75 \n\n"},{"name":79,"value":"LOGISCH-PHILOSOPHISCHE ABHANDLUNG
        \n\nwas iiber oder unter, aber nicht neben den Natur- \nwissenschaften steht.)
