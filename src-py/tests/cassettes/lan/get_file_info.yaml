        ABHANDLUNG \n\nunwahrscheinlich. Ein Ereignis trifft ein, oder \nes trifft
        nicht ein, ein Mittelding gibt es nicht. \n\n5.154 In einer Urne seien gleichviel
        weisse und \nschwarze Kugeln (und keine anderen). Ich ziehe \neine Kugel nach
        der anderen und lege sie wieder \nin die Urne zuriick. Dann kann ich durch
        den \nVersuch feststellen, dass sich die Zahlen der \ngezogenen schwarzen
        und weissen Kugeln bei \nfortgesetztem Ziehen einander nahern. \n\nDas ist
        also kein mathematisches Faktum. \n\nWenn ich nun sage : Es ist gleich wahr-
        \nscheinlich, dass ich eine weisse Kugel wie eine \nschwarze ziehen werde,
        so heisst das : Alle mir \nbekannten Umstande (die hypothetisch angenom- \nmenen
        Naturgesetze mitinbegriffen) geben dem \nEintreffen des einen Ereignisses
        nicht mehr \nWahrscheinlichkeit als dem Eintreffen des anderen. \nDas heisst,
        sie geben \u2014 wie aus den obigen Er- \nklarungen leicht zu entnehmen ist
        \u2014 jedem die \nWahrscheinlichkeit ^. \n\nWas ich durch den Versuch bestatige
        ist, dass \ndas Eintreffen der beiden Ereignisse von den Um- \nstanden, die
        ich nicht naher kenne, unabhangig ist. \n\n5.155 Die Einheit des Wahrscheinlichkeitssatzes
        ist: \nDie Umstande \u2014 die ich sonst nicht weiter kenne \u2014 \ngeben
        dem Eintreffen eines bestimmten Ereignisses \nden und den Grad der Wahrscheinlichkeit.
        \n\n5.156 So ist die Wahrscheinlichkeit eine Verallge- \nmeinerung. \n\nSie
        involviert eine allgemeine Beschreibung \neiner Satzform. \n\nNur in Ermanglung
        der Gewissheit gebrauchen \nwir die Wahrscheinlichkeit. \u2014 Wenn wir zwar
        eine \nTatsache nicht vollkommen kennen, wohl aber \netwas iiber ihre Form
        wissen. \n\n(Ein Satz kann zwar ein unvollstandiges Bild \neiner gewissen
        Sachlage sein, aber er ist immer \nei n vollstandiges Bild.) \n\n112 \n\n"},{"name":116,"value":"TRACTATUS
        LOGICO-PHILOSOPHICUS \n\nimprobable. An event occurs or does not occur, \nthere
        is no middle course. \n\n5.154 In an urn there are equal numbers of white
        \nand black balls (and no others). I draw one \nball after another and put
        them back in the \nurn. Then I can determine by the experiment \nthat the
        numbers of the black and white balls \nwhich are drawn approximate as the
        drawing \ncontinues. \n\nSo this is not a mathematical fact. \n\nIf then,
        I say, It is equally probable that \nI should draw a white and a black ball,
        this \nmeans, All the circumstances known to me (in- \ncluding the natural
        laws hypothetically assumed) \ngive to the occurrence of the one event no
        more \nprobability than to the occurrence of the other. \nThat is they give
        \u2014 as can easily be under- \nstood from the above explanations \u2014
        to each the \nprobability \\. \n\nWhat I can verify by the experiment is that
        \nthe occurrence of the two events is independent \nof the circumstances with
        which I have no closer \nacquaintance. \n\n5.155 The unit of the probability
        proposition is: The \ncircumstances \u2014 with which I am not further ac-
        \nquainted \u2014 give to the occurrence of a definite event \nsuch and such
        a degree of probability. \n\n5.156 Probability is a generalization. \n\nIt
        involves a general description of a proposi- \ntional form. Only in default
        of certainty do we \nneed probability. \n\nIf we are not completely acquainted
        with a fact, \nbut know something about its form. \n\n(A proposition can,
        indeed, be an incomplete \npicture of a certain state of affairs, but it is
        always \na complete picture.) \n\n113 H \n\n"},{"name":117,"value":"LOGISCH-PHILOSOPHISCHE
        ABHANDLUNG \n\nDer Wahrscheinlichkeitssatz ist gleichsam ein \nAuszug aus
        anderen Satzen. \n5.2 Die Strukturen der Satze stehen in internen \n\nBeziehungen
        zu einander. \n\n5.21 Wir konnen diese internen Beziehungen \ndadurch in unserer
        Ausdrucksweise hervorheben, \ndass wir einen Satz als Resultat einer Operation
        \ndarstellen, die ihn aus anderen Satzen (den Basen \nder Operation) hervorbringt.
        \n\n5.22 Die Operation ist der Ausdruck einer Beziehung \nzwischen den Strukturen
        ihres Resultats und ihrer \nBasen. \n\n5.23 Die Operation ist das, was mit
        dem einen Satz \ngeschehen muss,um aus ihmden anderen zu machen. \n\n5.231
        Und das wird natiirlich von ihren formalen \nEigenschaften, von der internen
        Ahnlichkeit ihrer \nFormen abhangen. \n\n5.232 Die interne Relation, die eine
        Reihe ordnet, ist \naquivalent mit der Operation, durch welche ein \nGiied
        aus dem anderen entsteht. \n\n5.233 Die Operation kann erst dort auftreten,
        wo ein \nSatz auf logisch bedeutungsvolle Weise aus einem \nanderen entsteht.
        Also dort, wo die logische \nKonstruktion des Satzes anfangt. \n\n5.234 Die
        Wahrheitsfunktionen der Elementarsatze \nsind Resultate von Operationen, die
        die Elementar- \nsatze als Basen haben. (Ich nenne diese Opera- \ntionen Wahrheitsoperationen.)
        \n\n5.2341 Der Sinn einer Wahrheitsfunktion von p ist \neine Funktion des
        Sinnes von p. \n\nVerneinung, logische Addition, logische Mul- \ntiplikation,
        etc., etc. sind Operationen. \n\n(Die Verneinung verkehrt den Sinn des Satzes.)
        \n\n5.24 Die Operation zeigt sich in einer Variablen ; \nsie zeigt, wie man
        von einer Form von Satzen zu \neiner anderen gelangen kann. \n\nSie bringt
        den Unterschied der Formen zum \nAusdruck. \n\n114 \n\n"},{"name":118,"value":"TRACTATUS
        LOGICO-PHILOSOPHICUS \n\nThe probability proposition is, as it were, an \nextract
        from other propositions. \n5.2 The structures of propositions stand to one
        \n\nanother in internal relations. \n\n5.21 We can bring out these internal
        relations in \nour manner of expression, by presenting a pro- \nposition as
        the result of an operation which pro- \nduces it from other propositions (the
        bases of the \noperation). \n\n5.22 The operation is the expression of a relation
        \nbetween the structures of its result and its \nbases. \n\n5.23 The operation
        is that which must happen to a \nproposition in order to make another out
        of it. \n\n5.231 And that will naturally depend on their formal \nproperties,
        on the internal similarity of their \nforms. \n\n5.232 The internal relation
        which orders a series is \nequivalent to the operation by which one term \narises
        from another. \n\n5.233 The first place in which an operation can occur \nis
        where a proposition arises from another in a \nlogically significant way ;
        i,e, where the logical \nconstruction of the proposition begins. \n\n5.234
        The truth-functions of elementary proposition, \nare results of operations
        which have the ele- \nmentary propositions as bases. (I call these \noperations,
        truth-operations.) \n\n5.2341 The sense of a truth-function of/ is a function
        \nof the sense of/. \n\nDenial, logical addition, logical multiplication,
        \netc. etc., are operations. \n\n(Denial reverses the sense of a proposition.)
        \n\n5.24 An operation shows itself in a variable ; it shows \nhow we can proceed
        from one form of proposition \nto another. \n\nIt gives expression to the
        difference between \nthe forms. \n\n115 \n\n"},{"name":119,"value":"LOGISCH-PHILOSOPHISCHE
        ABHANDLUNG \n\n(Und das Gemeinsame zwischen den Basen \nund dem Resultat der
        Operation sind eben die \nBasen.) \n\n5.241 Die Operation kennzeichnet keine
        Form, son- \ndern nur den Unterschied der Formen. \n\n5.242 Dieselbe Operation,
        die \u201eq\" aus \u201ep\" macht, \nmacht aus \u201eq\" \u201er\" u. s. f.
        Dies kann nur darin \nausgedriickt sein, dass \u201ep\", \u201eq\", \u201er\",
        etc. Variable \nsind, die gewisse formale Relationen allgemein \nzum Ausdruck
        bringen. \n\n5.25 Das Vorkommen der Operation charakterisiert \n\nden Sinn
        des Satzes nicht. \n\nDie Operation sagt ja nichts aus, nur ihr Re- \nsultat,
        und dies hangt von den Basen der Operation \nab. \n\n(Operation und Funktion
        diirfen nicht mitein- \nander verwechselt werden.) \n\n5.251 Eine Funktion
        kann nicht ihr eigenes Argument \nsein, wohl aber kann das Resultat einer
        Operation \nihre eigene Basis werden. \n\n5.252 Nur so ist das Fortschreiten
        von Glied zu Glied \nin einer Formenreihe (von Type zu Type in den \nHierarchien
        Russells und Whiteheads) moglich. \n(Russell und Whitehead haben die Moglichkeit
        \ndieses Fortschreitens nicht zugegeben, aber immer \nwieder von ihr Gebrauch
        gemacht.) \n\n5.2521 Die fortgesetzte Anwendung einer Operation \nauf ihr
        eigenes Resultat nenne ich ihre successive \nAnwendung (\u201e0'' O'' O''
        a\" ist das Resultat der \ndreimaligen successiven Anwendung von \u201e0*
        f \" \nauf \u201ea\"). \n\nIn einem ahnlichen Sinne rede ich von der \nsuccessiven
        Anwendung m ehrerer Operationen \nauf eine Anzahl von Satzen. \n\n5.2522 Das
        allgemeine Glied einer Formenreihe a, O* a, \nO* O'' a, . . . . schreibe ich
        daher so : \u201e[a, x, O''x]*''. \nDieser Klammerausdruck ist eine Variable.
        Das \nerste Glied des Klammerausdruckes ist der An- \n\n116 \n\n"},{"name":120,"value":"TRACTATUS
        LOGICO-PHILOSOPHICUS \n\n(And that which is common to the bases, and \nthe
        result of an operation, is the bases them- \nselves.) \n\n5.241 The operation
        does not characterize a form but \nonly the difference between forms. \n\n5.242
        The same operation which makes **^\" from \n**/\", makes ''*r\" from \"^**,
