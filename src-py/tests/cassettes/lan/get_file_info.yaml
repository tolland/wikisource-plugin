        determined by the number of terms in the right- \nhand bracket.) \n\n4.45
        For n elementary propositions there are Ln \npossible groups of truth-conditions.
        \n\nThe groups of truth-conditions which belong to \nthe truth-possibilities
        of a number of elementary \npropositions can be ordered in a series. \n\n4.46
        Among the possible groups of truth-conditions \nthere are two extreme cases.
        \n\nIn the one case the proposition is true for all the \ntruth-possibilities
