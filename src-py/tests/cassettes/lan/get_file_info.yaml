        \n\n^ \n\n*^ \n\nT^f \n\nInternational Library \n\nOF \n\nPSYCHOLOGY, PHILOSOPHY
        \nAND SCIENTIFIC METHOD \n\nEdited by \nC. K. OGDEN, MA. \n\nhate Fellow of
        Magdalene College, Cambridge \n\nThe International Library, of which over
        one hundred and fifty \nvolumes have been published, is both in quality and
        quantity a unique \nachievement in this department of publishing. Its purpose
        is to give \nexpression, in a convenient form, to the remarkable developments
        \nwhich have recendy occurred in Psychology and its allied sciences. \nThe
        older philosophers were preoccupied by metaphysical interests \nwhich for
        the most part have ceased to attract the younger investi- \ngators, and their
        forbidding terminology too often acted as a \ndeterrent for the general reader.
        The attempt to deal in clear \nlanguage with current tendencies whether in
        England and America \nor on the Continent has met with a very encouraging
        reception, and \nnot only have accepted authorities been invited to explain
        the newer \ntheories, but it has been found possible to include a number of
        \noriginal contributions of high merit. \n\nPublished by \nROUTLEDGE & KEGAN
        PAUL LTD \n\nBROADWAY HOUSE: 68-74 CARTER LANE, LONDON, E.C.4. \n\n1959 \n\n^
