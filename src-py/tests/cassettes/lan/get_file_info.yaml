        is \n97 G \n\n"},{"name":101,"value":"LOGISCH-PHILOSOPHISCHE ABHANDLUNG \n\ndie
        Kontradiktion ist unter keiner Bedingung \nwahr. \n\nTautologie und Kontradiktion
        sind sinnlos. \n\n(Wie der Punkt von dem zwei Pfeile in \nentgegengesetzter
        Richtung auseinandergehen.) \n\n(Ich weiss z. B. nichts uber das Wetter, wenn
        \nich weiss, dass es regnet oder nicht regnet.) \n4.4611 Tautologie und Kontradiktion
        sind aber nicht \nunsinnig ; sie gehoren zum Symbolismus, und \nzwar ahnlich
        wie die \u201eo\" zum Symbolismus der \nArithmetik. \n\n4.462 Tautologie und
        Kontradiktion sind nicht Bilder \nder Wirklichkeit. Sie stellen keine mogliche
        \nSachlage dar. Denn jene lasst jede mogliche \nSachlage zu, diese keine.
        \n\nIn der Tautologie heben die Bedingungen der \ntjbereinstimmung mit der
        Welt \u2014 die darstellenden \nBeziehungen \u2014 einander auf, so dass sie
        in keiner \ndarstellenden Beziehung zur Wirklichkeit steht. \n\n4.463 Die
        Wahrheitsbedingungen bestimmen den \nSpielraum, der den Tatsachen durch den
        Satz \ngelassen wird. \n\n(Der Satz, das Bild, das Modell, sind im \nnegativen
        Sinne wie ein fester Korper, der die \nBewegungsfreiheit der anderen beschrankt
        ; im \npositiven Sinne, wie der von fester Substanz \nbegrenzte Raum, worin
        ein Korper Platz hat.) \n\nDie Tautologie lasst der Wirklichkeit den ganzen
        \n\u2014 unendlichen \u2014 logischen Raum ; die Kontradik- \ntion erfiillt
        den ganzen logischen Raum und lasst \nder Wirklichkeit keinen Punkt. Keine
        von beiden \nkann daher die Wirklichkeit irgendwie bestimmen. \n\n4.464 Die
        Wahrheit der Tautologie ist gewiss, des \nSatzes moglich, der Kontradiktion
        unmoglich. \n\n{Gewiss, moglich, unmoglich : Hier haben wir \ndas Anzeichen
        jener Gradation, die wir in der \nWahrscheinlichkeitslehre brauchen.) \n\n4.465
        Das logische Produkt einer Tautologie und \n\n98 \n\n"},{"name":102,"value":"TRACTATUS
        LOGICO-PHILOSOPHICUS \n\nunconditionally true ; and the contradiction is on
        \nno condition true. \n\nTautology and contradiction are without sense. \n\n(Like
        the point from which two arrows go out in \nopposite directions.) \n\n(I know,
        e.g. nothing about the weather, when \nI know that it rains or does not rain.)
        \n4.4611 Tautology and contradiction are, however, not \nnonsensical ; they
        are part of the symbolism, in the \nsame way that **o*'' is part of the symbolism
        of \nArithmetic. \n\n4.462 Tautology and contradiction are not pictures of
        \nthe reality. They present no possible state of \naffairs. For the one allows
        every possible state \nof affairs, the other none. \n\nIn the tautology the
        conditions of agreement \nwith the world \u2014 the presenting relations \u2014
        cancel \none another, so that it stands in no presenting \nrelation to reality.
        \n\n4.463 The truth-conditions determine the range, which \nis left to the
        facts by the proposition. \n\n(The proposition, the picture, the model, are
        in \na negative sense like a solid body, which restricts \nthe free movement
        of another : in a positive sense, \nlike the space limited by solid substance,
        in which \na body may be placed.) \n\nTautology leaves to reality the whole
        infinite \nlogical space ; contradiction fills the whole logical \nspace and
        leaves no point to reality. Neither of \nthem, therefore, can in any way determine
        \nreality. \n\n4.464 The truth of tautology is certain, of propositions \npossible,
        of contradiction impossible. \n\n(Certain, possible, impossible : here we
        have \nan indication of that gradation which we need in \nthe theory of probability.)
        \n\n4.465 The logical product of a tautology and a pro- \n\n99 \n\n"},{"name":103,"value":"LOGISCH-PHILOSOPHISCHE
        ABHANDLUNG \n\neines Satzes sagt dasselbe, wie der Satz. Also ist \njenes
        Produkt identisch mit dem Satz. Denn man \nkann das Wesentliche des Symbols
        nicht andern, \nohne seinen Sinn zu andern. \n4.466 Einer bestimmten logischen
        Verbindung von \n\nZeichen entspricht eine bestimmte logische Ver- \nbindung
        ihrer Bedeutungen; jede beliebige \nVerbindung entspricht nur den unverbundenen
        \nZeichen. \n\nDas heisst, Satze die fiir jede Sachlage wahr \nsind, konnen
        uberhaupt keine Zeichenverbindungen \nsein, denn sonst konnten ihnen nur bestimmte
        \nVerbindungen von Gegenstanden entsprechen. \n\n(Und keiner logischen Verbindung
        entspricht \nkeine Verbindung der Gegenstande.) \n\nTautologie und Kontradiktion
