        zu \u201epDq . p : D : q\" \nverbinden und nun zeigen, dass dies eine Tauto-
        \nlogie ist. \n\n6.1222 Dies wirft ein Licht auf die Frage, warum die \nlogischen
        Satze nicht durch die Erfahrung bestatigt \nwerden konnen, ebenso wenig, wie
