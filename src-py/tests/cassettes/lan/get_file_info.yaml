        \n\nEspecially in certain propositional forms of \npsychology, like ^* A thinks,
        that/ is the case\", \nor ** A thinks/\", etc. \n\nHere it appears superficially
        as if the proposition \n/ stood to the object A in a kind of relation. \n\n(And
        in modern epistemology (Russell, Moore, \netc.) those propositions have been
        conceived in \nthis way.) \n\n5.542 But it is clear that **A believes that/\",
        **A \nthinks/ \", ** A says / \", are of the form ** */ '' says \n/ \" : and
        here we have no co-ordination of a fact \nand an object, but a co-ordination
