---

# The wtbot API as a service, to be overlaid on either wiki stack:
#
#   docker compose -f compose.seeded.yml -f compose.wtbot.yml \
#       --profile pair --profile api up -d --wait
#   docker compose -f compose.yml -f compose.wtbot.yml \
#       --profile api up -d --wait
#
# A separate file rather than a copy in each base, because the two bases
# already duplicate the MediaWiki services between them and that is the part
# that drifts. One definition, composed with whichever base is wanted.
#
# Why have it at all: the tests reach into the ASGI app in-process
# (TestClient), so nothing exercises wtbot over HTTP and nothing outside pytest
# can see its state. With the API in the stack, `curl`, the `wtbot` CLI, the
# IntelliJ plugin and the viewer all point at the same running thing.

services:
  wtbot:
    profiles: ["api"]
    build:
      context: .
      dockerfile: docker/wtbot/Dockerfile
    depends_on:
      # `mediawiki` only. `mediawiki-local` exists solely under the `pair`
      # profile, and depending on a service whose profile is inactive is an
      # error on older compose versions -- so the dependency is on the wiki
      # that is always there. wtbot does not need either wiki at boot: sites
      # are database rows and a fetch is what first calls out.
      mediawiki:
        condition: service_healthy
    environment:
      # Disposable by design: the database is a cache of wiki content plus the
      # local edit journal, so everything in it is refetchable or not yet
      # pushed. `down --volumes` discards it; WTBOT_RESET_DB=1 discards it
      # without rebuilding the wikis, which are the slow half.
      WTBOT_DATABASE_URL: "sqlite:////data/wtbot.db"
      WTBOT_BLOB_ROOT: "/data/blobs"
      WTBOT_PORT: "8000"
      WTBOT_RESET_DB: "${WTBOT_RESET_DB-0}"
      WTBOT_LOG_LEVEL: "${WTBOT_LOG_LEVEL-INFO}"
    ports:
      - "${WTBOT_PORT:-18583}:8000"
    volumes:
      - wtbot-data:/data
    healthcheck:
      # No curl in python:3.13-slim, and adding one for a healthcheck is a
      # package to keep patched; the interpreter is already here.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  wtbot-data:
